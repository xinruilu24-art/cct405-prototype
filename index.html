<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prove It, Picasso!</title>
<meta name="description" content="CCT405 调解者游戏的可玩原型：用五天时间为被指控使用 AI 的画师应对指控。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet">
<style>
/* Hallmark · v2.0.0 · fast mode prototype · scope app · direction custom: pastel room and a phone of look-alike apps, from the user's sketch · genre playful */
/* critique: a small status panel on the left, the phone carries every action inside apps that read like the real ones */
/* waive 7b: the app screens are near-white, matching the apps they imitate */
/* waive 47a: the user drew the phone frame in their sketch */
:root{
  --desk:#f4d6ea; --desk-dot:#ecc3df; --win:#fff8fc; --title:#cdb2f2; --ink:#3a2347; --line:#3a2347; --muted:#6b5a73;
  --accent:#c2286d; --accent-ink:#fff5fa; --scrim:rgba(58,35,71,.35); --po:#77cdbd; --stress:#ff7d9c; --soft:#f7ecfb;
  --disabled:#e6dcea; --focus:#2d7cff; --paper:#fffdfe; --phone:#3a2347; --hair:#ececec; --grey:#6b6b6b; --grey-bg:#f5f5f5;
  --xhs-red:#d9264a; --xhs-tag:#2a5ba8; --mhs:#6a4bbf; --mhs-soft:#f1ecfc; --wx-bg:#ededed; --wx-green:#95ec69; --wx-ok:#05753f;
  --wx-pay:#a9560a; --eat:#ffcf3d; --eat-soft:#fff6d6; --ios-blue:#0a6cff;
  --px-k:#3a2347; --px-w:#fff8fb; --px-p:#ff9cc4; --px-r:#ff5a7a; --px-y:#ffd36b; --px-o:#ffb067; --px-g:#7fd6a0; --px-b:#8ccdf0; --px-v:#b79cf0; --px-n:#c98b5e;
  --stage-bg:#d6f2ec; --stage-stripe:#c3eae2; --tile-xhs:#ffd0e2; --tile-mhs:#e3d6ff; --tile-eat:#fff0bf; --tile-chat:#d2f5df; --tile-set:#ece6ef;
  --font-ui:"Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; --font-head:"ZCOOL QingKe HuangYou", "Noto Sans SC", sans-serif;
}
*{box-sizing:border-box}
html,body{overflow-x:clip;margin:0}
body{background:var(--desk);background-image:radial-gradient(var(--desk-dot) 1.5px, transparent 1.5px);background-size:14px 14px;color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.45;min-height:100vh}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
summary:focus-visible{outline:3px solid var(--focus);outline-offset:-3px}
.app{max-width:1180px;margin:0 auto;padding:16px}
.win{background:var(--win);border:2px solid var(--line);box-shadow:4px 4px 0 var(--line);min-width:0}
.bar{background:var(--title);border-bottom:2px solid var(--line);padding:4px 12px;font-family:var(--font-head);font-size:17px}
.body{padding:12px;min-width:0}
h1,h2{font-family:var(--font-head);font-weight:400;margin:0 0 8px;overflow-wrap:break-word;min-width:0;text-wrap:balance}
h1{font-size:34px} h2{font-size:24px}
p{margin:0 0 12px}
.muted{color:var(--muted);font-size:14px}
.btn{background:var(--win);border:2px solid var(--line);box-shadow:2px 2px 0 var(--line);padding:8px 12px;cursor:pointer;text-align:left;transition:transform .08s, box-shadow .08s}
.btn:hover{background:var(--soft)}
.btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--line)}
.btn:disabled{background:var(--disabled);color:var(--muted);cursor:not-allowed;box-shadow:none}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.stack{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.center{max-width:760px;margin:6vh auto 0}
.split{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px;align-items:start}
.portrait{border:2px solid var(--line);background:var(--paper);overflow:hidden;height:330px}
.portrait img{display:block;width:100%;height:100%;object-fit:contain}
.px{display:block;image-rendering:pixelated}
.c-k{fill:var(--px-k)} .c-w{fill:var(--px-w)} .c-p{fill:var(--px-p)} .c-r{fill:var(--px-r)} .c-y{fill:var(--px-y)} .c-o{fill:var(--px-o)}
.c-g{fill:var(--px-g)} .c-b{fill:var(--px-b)} .c-v{fill:var(--px-v)} .c-n{fill:var(--px-n)}

/* stage */
.main{display:grid;grid-template-columns:minmax(0,1fr) 400px;max-width:1000px;margin:0 auto;gap:24px;align-items:stretch}
.stage{position:relative;display:flex;flex-direction:column;min-height:740px;background-color:var(--stage-bg);background-image:repeating-linear-gradient(90deg, var(--stage-stripe) 0 8px, transparent 8px 24px);border:2px solid var(--line);box-shadow:4px 4px 0 var(--line);overflow:hidden}
.stage.live{border-color:var(--accent)}
.meters{background:var(--win);border:2px solid var(--line);padding:8px 12px;box-shadow:2px 2px 0 var(--line)}
.hud{display:flex;gap:16px;padding:16px;align-items:stretch}
.day-col{flex:none;width:88px;display:flex;flex-direction:column;box-shadow:2px 2px 0 var(--line)}
.sticker{flex:none;height:48px;margin-top:-2px;overflow:hidden;background:var(--px-p);border:2px solid var(--line);display:flex;flex-direction:column;justify-content:center;gap:4px;padding:0 4px}
.sticker .hr{display:flex;gap:8px}
.sticker .hr.off{margin-left:-12px}
.day{flex:1;min-height:0;border:2px solid var(--line);background:var(--win);display:flex;flex-direction:column;align-items:center;justify-content:center}
.day b{font-family:var(--font-head);font-weight:400;font-size:52px;line-height:1}
.day span{font-size:13px;color:var(--muted)}
.hud-right{flex:1;min-width:0;max-width:300px;display:flex;flex-direction:column}
.money{font-family:var(--font-head);font-size:22px;margin-bottom:4px}
.spot{flex:1}
.evidence-list{margin:0 16px 16px;border:2px solid var(--line);background:var(--win);min-width:0}
.evidence-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border-bottom:2px solid var(--line);background:var(--soft)}
.evidence-heading h2{margin:0;font-size:24px}
.evidence-count{font-size:14px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.evidence-empty{padding:16px 12px;margin:0;color:var(--muted);font-size:14px}
.evidence-item + .evidence-item{border-top:1px solid var(--line)}
.evidence-item summary{padding:12px;cursor:pointer;overflow-wrap:anywhere}
.evidence-item summary:hover{background:var(--soft)}
.evidence-item summary::marker{color:var(--accent)}
.evidence-item summary b{font-size:15px}
.evidence-source{display:block;margin:4px 0 0 16px;font-size:13px;color:var(--muted)}
.evidence-preview{padding:0 12px 12px}
.evidence-preview img{display:block;width:100%;max-height:180px;object-fit:contain;background:var(--paper)}
.evidence-preview .timeline{margin:0;max-width:100%}
.evidence-preview p{margin:8px 0 0;font-size:13px;color:var(--muted)}
.evidence-document{padding:12px;background:var(--paper);border:1px solid var(--hair);font-size:14px;line-height:1.7}
.evidence-document p{white-space:pre-line;font-size:14px}
.meter{margin-bottom:8px} .meter:last-child{margin-bottom:0}
.meter-top{display:flex;justify-content:space-between;font-size:14px}
.track{height:14px;border:2px solid var(--line);background:var(--win);overflow:hidden}
.fill{height:100%;transform-origin:left;transition:transform .3s}
.fill.po{background:var(--po)} .fill.stress{background:var(--stress)}
.clock{align-self:flex-start;background:var(--win);border:2px solid var(--line);padding:8px 12px;text-align:right;font-family:var(--font-head);font-size:20px;line-height:1.2}
.clock span{display:block;font-family:var(--font-ui);font-size:14px;color:var(--muted)}
.bubble{margin:0 16px 16px;background:var(--win);border:2px solid var(--line);padding:8px 12px;font-size:15px}
.actions{display:flex;justify-content:center;gap:32px;padding:16px;border-top:2px solid var(--line);background:var(--soft)}
.live-tag{margin:0 16px;align-self:flex-start;background:var(--accent);color:var(--accent-ink);border:2px solid var(--line);padding:4px 12px;font-family:var(--font-head)}

/* phone */
.phone{background:var(--phone);border-radius:40px;padding:16px 12px 12px;box-shadow:4px 4px 0 var(--line)}
.screen{position:relative;background:var(--paper);border-radius:28px;height:640px;overflow:hidden;display:flex;flex-direction:column}
.status{display:flex;justify-content:space-between;padding:8px 20px 4px;font-size:13px;font-weight:700}
.view{flex:1;overflow-y:auto;min-height:0}
.home{display:block;margin:12px auto 0;width:44px;height:44px;border-radius:50%;border:2px solid var(--paper);background:transparent;cursor:pointer}
.home:hover{background:var(--muted)}
.springboard{background:var(--soft);height:100%;padding:24px 20px}
.icons{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px 8px;padding-top:12px}
.icon{position:relative;border:0;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:15px;padding:2px}
.icon .tile{width:96px;height:96px;border-radius:24px;border:2px solid var(--line);box-shadow:2px 2px 0 var(--line);display:flex;align-items:center;justify-content:center;transition:transform .08s}
.icon:hover .tile{transform:translateY(-2px)}
.icon .badge{position:absolute;top:-4px;right:8px;min-width:22px;height:22px;border-radius:11px;background:var(--xhs-red);color:var(--paper);font-size:12px;display:flex;align-items:center;justify-content:center;padding:0 8px}
.t-xhs{background:var(--tile-xhs)} .t-mhs{background:var(--tile-mhs)} .t-eat{background:var(--tile-eat)} .t-chat{background:var(--tile-chat)} .t-set{background:var(--tile-set)}
.topbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--paper);border-bottom:1px solid var(--hair);font-weight:700;min-height:44px}
.topbar .back{border:0;background:transparent;font-size:24px;line-height:1;cursor:pointer;padding:0 4px}
.topbar .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:32px;height:32px;border-radius:50%;object-fit:cover;flex:none;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--ink)}
.av.sq{border-radius:6px}
.av.lg{width:64px;height:64px}
.ghost{border:0;background:transparent;cursor:pointer;display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--muted);padding:4px}
.ghost.on{color:var(--xhs-red)}
.ghost:disabled{opacity:.4;cursor:default}

/* xiaofenshu */
.feed{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:8px;background:var(--grey-bg)}
.card{background:var(--paper);border:0;border-radius:6px;overflow:hidden;cursor:pointer;text-align:left;padding:0}
.card img,.card .shot{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.card .ct{padding:8px 8px 2px;font-size:13px;font-weight:700;line-height:1.35}
.card .cm{display:flex;align-items:center;gap:8px;padding:4px 8px 8px;font-size:12px;color:var(--grey)}
.card .cm .av{width:18px;height:18px;font-size:10px}
.card .cm .n{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.xnav{position:sticky;bottom:0;display:flex;justify-content:space-around;align-items:center;background:var(--paper);border-top:1px solid var(--hair);padding:8px}
.xnav .plus{background:var(--xhs-red);color:var(--paper);border:0;border-radius:8px;width:48px;height:32px;font-size:22px;line-height:1;cursor:pointer}
.xnav .tab{border:0;background:transparent;font-weight:700;cursor:pointer}
.note-img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.rules-cover{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;background:var(--mhs-soft);color:var(--ink);text-align:center}
.rules-cover b{font-family:var(--font-head);font-size:32px;font-weight:400}
.rules-cover span{font-size:18px}
.rules-cover small{font-size:12px;color:var(--muted)}
.note-body p{white-space:pre-line}
.share-card .rules-cover{width:48px;height:48px;flex:none;padding:4px;gap:0}
.share-card .rules-cover b{font-size:12px}
.share-card .rules-cover span,.share-card .rules-cover small{display:none}
.note-body{padding:12px 16px}
.note-body .nt{font-weight:700;font-size:17px;margin:0 0 8px;font-family:var(--font-ui)}
.note-body p{font-size:15px;margin:0 0 8px}
.tags{color:var(--xhs-tag);font-size:14px}
.ndate{color:var(--grey);font-size:12px;margin-top:8px}
.ccount{padding:8px 16px;font-size:13px;color:var(--grey);border-top:1px solid var(--hair)}
.cmt{display:flex;gap:8px;padding:8px 16px}
.cmt .cb{flex:1;min-width:0}
.cmt .cn{font-size:13px;color:var(--grey)}
.cmt .ctext{font-size:15px;margin:2px 0}
.cmt .cact{display:flex;gap:4px;align-items:center}
.cmt .reply{font-size:14px;background:var(--grey-bg);border-radius:6px;padding:8px 8px;margin-top:4px}
.nbar{position:sticky;bottom:0;display:flex;align-items:center;gap:8px;padding:8px 8px;background:var(--paper);border-top:1px solid var(--hair)}
.nbar .say{flex:1;background:var(--grey-bg);border-radius:16px;padding:8px 12px;font-size:13px;color:var(--muted)}
.timeline{background:var(--paper);padding:8px;font-size:11px;line-height:1.5;border:1px solid var(--hair)}
.timeline b{display:block;font-size:12px;margin-bottom:4px}
.compose{padding:16px}
.opt{display:block;width:100%;text-align:left;background:var(--grey-bg);border:0;border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer}
.opt b{display:block}
.opt span{font-size:13px;color:var(--grey)}
.opt:disabled{background:var(--disabled);color:var(--muted);cursor:not-allowed}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--paper);border-radius:16px 16px 0 0;padding:16px;box-shadow:0 -2px 0 var(--line);z-index:5}
.sheet-bg{position:absolute;inset:0;background:var(--scrim);z-index:4}
.sheet .sh{font-weight:700;margin:0 0 8px;font-size:15px}

/* mihuashi */
.mhs-top{background:var(--mhs);color:var(--paper);padding:8px 16px 0}
.mhs-top .brand{font-family:var(--font-head);font-size:22px}
.seg{display:flex;gap:16px;margin-top:8px}
.seg button{border:0;background:transparent;color:var(--paper);padding:8px 0 8px;cursor:pointer;opacity:.75}
.seg button.on{opacity:1;box-shadow:inset 0 -3px 0 var(--paper)}
.row-item{display:flex;gap:8px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--hair);background:var(--paper);border-left:0;border-right:0;border-top:0;width:100%;text-align:left;cursor:pointer}
.row-item .grow{flex:1;min-width:0}
.row-item .t{font-weight:700;font-size:15px}
.row-item .s{font-size:13px;color:var(--grey);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-item .dot{min-width:20px;height:20px;border-radius:10px;background:var(--xhs-red);color:var(--paper);font-size:12px;display:flex;align-items:center;justify-content:center;padding:0 8px}
.banner{height:90px;background:var(--mhs-soft);background-size:cover;background-position:center}
.prof{padding:0 16px 12px;margin-top:-32px}
.prof .av{border:3px solid var(--paper)}
.stats{display:flex;gap:16px;font-size:13px;color:var(--grey);margin:8px 0}
.chip{display:inline-block;background:var(--mhs-soft);color:var(--mhs);border-radius:10px;padding:2px 8px;font-size:12px;margin-right:8px}
.works{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:0 16px}
.works img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:4px}
.price{margin:12px 16px;border:1px solid var(--hair);border-radius:10px;padding:8px 12px;font-size:14px}
.price div{display:flex;justify-content:space-between;padding:4px 0}

/* michat */
.wx{background:var(--wx-bg);min-height:100%}
.wx .topbar{background:var(--wx-bg);justify-content:center}
.wx-tabs{position:sticky;bottom:0;display:flex;justify-content:space-around;background:var(--grey-bg);border-top:1px solid var(--hair);padding:8px}
.wx-tabs button{border:0;background:transparent;font-size:12px;cursor:pointer;color:var(--grey)}
.wx-tabs button.on{color:var(--wx-ok);font-weight:700}
.thread{padding:12px;display:flex;flex-direction:column;gap:12px}
.bub-row{display:flex;gap:8px;align-items:flex-start}
.bub-row.me{flex-direction:row-reverse}
.bub{background:var(--paper);border-radius:6px;padding:8px 8px;font-size:15px;max-width:72%}
.bub-row.me .bub{background:var(--wx-green)}
.bub.action-guide{max-width:calc(100% - 40px);min-width:0;padding:12px}
.action-guide h3{margin:0 0 4px;font-size:17px}
.action-guide > p{margin:0 0 8px;font-size:13px;color:var(--muted)}
.guide-section + .guide-section{border-top:1px solid var(--hair)}
.guide-section summary{padding:12px 0;cursor:pointer;font-size:14px;font-weight:700}
.guide-section summary::marker{color:var(--wx-ok)}
.guide-section dl{margin:0 0 8px}
.guide-section dt{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 8px;margin-top:12px;font-size:14px;font-weight:700}
.guide-section dt:first-child{margin-top:0}
.guide-cost{font-size:12px;color:var(--muted);font-weight:400}
.guide-section dd{margin:4px 0 0;font-size:13px;line-height:1.65;overflow-wrap:anywhere}
.sys-line{align-self:center;font-size:12px;color:var(--grey)}
.share-card{background:var(--paper);border:0;border-radius:6px;padding:8px;display:flex;gap:8px;width:210px;font:inherit;font-size:13px;text-align:left;color:var(--ink);cursor:pointer}
.share-card img{width:48px;height:48px;object-fit:cover;flex:none}
.share-card small{display:block;color:var(--grey);margin-top:4px}
.pic-msg img{width:120px;border-radius:6px;display:block}
.pay-card{background:var(--wx-pay);color:var(--paper);border-radius:6px;padding:8px;width:200px;font-size:14px}
.wx-act{position:sticky;bottom:0;display:flex;gap:8px;padding:8px;background:var(--grey-bg);border-top:1px solid var(--hair)}
.wx-act button{flex:1;border:1px solid var(--hair);background:var(--paper);border-radius:6px;padding:8px;cursor:pointer;font-size:14px}
.wx-act button:disabled{color:var(--grey);cursor:not-allowed}
.wallet{margin:12px;background:var(--wx-ok);color:var(--paper);border-radius:10px;padding:16px}
.wallet .big{font-size:30px;font-weight:700}
.bill{margin:0 12px;background:var(--paper);border-radius:10px}
.bill div{display:flex;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--hair);font-size:14px}

/* mimieat */
.eat-top{background:var(--eat);padding:12px 16px;font-family:var(--font-head);font-size:22px}
.food{display:flex;gap:12px;align-items:center;margin:8px 16px;padding:8px;border-radius:12px;background:var(--eat-soft)}
.food .grow{flex:1}
.food .pr{font-weight:700;color:var(--accent)}
.food button{border:0;background:var(--eat);border-radius:14px;padding:8px 16px;font-weight:700;cursor:pointer}
.food button:disabled{opacity:.5;cursor:not-allowed}
.bal{margin:8px 16px;font-size:14px;color:var(--grey)}

.play{position:relative;display:block}
.play::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-left:18px solid var(--paper);border-top:11px solid transparent;border-bottom:11px solid transparent}

/* settings */
.set-list{margin:16px;background:var(--paper);border-radius:10px;overflow:hidden}
.set-list button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--hair);background:var(--paper);padding:12px 16px;cursor:pointer}

.modal{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal .win{max-width:420px;width:100%}
.tour-focus{outline:3px solid var(--focus);outline-offset:4px}
.hud.tour-focus{outline-offset:-5px}
.tutorial-coach{position:fixed;z-index:30;width:300px;max-height:calc(100dvh - 48px);overflow:auto}
.tutorial-coach .bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.tutorial-coach .bar span:last-child{font-family:var(--font-ui);font-size:12px}
.tutorial-coach h2{font-size:18px;margin-bottom:6px}
.tutorial-coach p{font-size:13px;line-height:1.55;margin-bottom:8px}
.tutorial-controls{display:flex;align-items:center;gap:4px 16px;flex-wrap:wrap}
.tutorial-link{border:0;background:transparent;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:4px 0;cursor:pointer;font-size:13px;line-height:1.4}
.tutorial-link:disabled{opacity:.5;text-decoration:none;cursor:default}
@media(max-width:980px){.tutorial-coach{max-height:48dvh}.is-guided .app{padding-bottom:calc(var(--coach-height,260px) + 24px)}}
.screen[tabindex="0"]{cursor:pointer}
.screen:focus-visible{outline:3px solid var(--focus);outline-offset:-3px}
.action-result{padding:12px 16px;background:var(--soft);border-bottom:1px solid var(--line);font-size:14px;line-height:1.6}
.artist-actions{flex-direction:column}
/* Time passing: a brief fade for slots, a darker pause for a new day. */
.time-transition{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:24px;background:rgba(58,35,71,.72);color:var(--paper);text-align:center;animation:time-fade 650ms ease-out both}
.time-transition-label{font-family:var(--font-head);font-size:32px;line-height:1.4;animation:time-label 650ms cubic-bezier(.16,1,.3,1) both}
.time-transition.is-new-day{background:var(--phone);animation-duration:900ms}
.time-transition.is-new-day .time-transition-label{font-size:44px;animation-duration:900ms}
@keyframes time-fade{0%,100%{opacity:0}20%,70%{opacity:1}}
@keyframes time-label{from{transform:translateY(6px)}to{transform:translateY(0)}}
.pie{width:220px;height:220px;border:2px solid var(--line);border-radius:50%;margin:8px auto 12px}
.legend{display:flex;gap:16px;justify-content:center;font-size:14px}
.sw{display:inline-block;width:12px;height:12px;border:2px solid var(--line);margin-right:8px;vertical-align:-1px}
@media (max-width:980px){.stage{min-height:520px}.main,.split{grid-template-columns:minmax(0,1fr)}.phone{max-width:400px;margin:0 auto}}
@media (prefers-reduced-motion:reduce){.btn,.fill,.icon .tile{transition:none}}
@media (prefers-reduced-motion:reduce){.time-transition{animation-timing-function:linear}.time-transition .time-transition-label{animation:none}}
.av-img{image-rendering:pixelated;object-fit:cover;background:var(--paper)}
</style>

  const m = PX[name], n = m.length, rects = [];
  m.forEach((row, y) => [...row].forEach((ch, x) => { if (ch !== ".") rects.push(`<rect class="c-${ch}" x="${x}" y="${y}" width="1.02" height="1.02"/>`); }));

}

function timeTransition(previousDay){
  clearTimeTransition();
  const newDay = S.day !== previousDay;
  const overlay = document.createElement("div");
  overlay.id = "time-transition";
  overlay.className = "time-transition" + (newDay ? " is-new-day" : "");
  overlay.setAttribute("role", "status");
  overlay.setAttribute("aria-live", "polite");
  overlay.setAttribute("aria-atomic", "true");
  overlay.innerHTML = `<div class="time-transition-label">第 ${S.day} 天 · ${SLOTS[S.slot]}</div>`;
  $app.inert = true;
  document.body.append(overlay);
  timeTransitionTimer = setTimeout(clearTimeTransition, newDay ? 900 : 650);
}

const PEOPLE = {"画师本人": "artist", "鉴图小分队": "g4", "单主小葵（被退款的订单）": "g2", "老单主小葵": "g2", "墨水瓶": "g7", "客户布丁": "g9", "客户青柠": "g6", "路人甲": "g1", "细节控": "g1", "围观中": "g1", "匿名用户88": "g3", "怀疑派": "g3", "追问进度": "g3", "画画的猕猴桃": "g5", "观众21": "g5", "潜水中": "g8", "粉彩笔": "g8"};
function avatarOf(name, fallback, cls){
  if (name === "咪画师小助手") return `<span class="av ${cls || ""}" style="background:var(--tile-mhs)">${px("mhs", 24)}</span>`;
  const k = PEOPLE[name];
  return k ? `<img class="av av-img ${cls || ""}" src="${AVATARS[k]}" alt="${esc(name)}">` : avatar(fallback, cls);
}
function avatar(i, cls){
  if (i === -1) return `<img class="av av-img ${cls || ""}" src="${AVATARS.artist}" alt="画师">`;
  if (i === -2) return `<img class="av av-img ${cls || ""}" src="${CHLOE_AV}" alt="Chloe">`;
  return `<span class="av ${cls || ""}" style="background:${AVC[i % AVC.length]}">${"甲乙丙丁戊己"[i % 6]}</span>`;
}
function sticker(){
  const row = off => `<div class="hr ${off ? "off" : ""}">${px("heartO", 12).repeat(6)}</div>`;
  return `<div class="sticker" aria-hidden="true">${row(0)}${row(1)}${row(0)}</div>`;

function startTour(){

function showTourStep(){

  S.app = step.app; S.view = step.view || ""; S.arg = step.arg || "";
  const sample = [{id: "tutorial-example", ...EVIDENCE.e1, title: "过程材料（教程示例）"}];
  S.sheet = step.sheet === "support" ? replySheet("c2", [], true) : step.sheet === "accuse" ? replySheet("c1", sample, true) : step.sheet === "share" ? shareSheet("n2") : null;
  note("Chloe 正在带你熟悉界面。跟着浮窗继续，导览不会消耗时段、金钱或证据。");

function advanceTour(delta = 1){
  if (S?.tutorial?.phase !== "tour") return;
  const next = S.tutorial.step + delta;
  if (next >= tutorialSteps().length) return finishTutorial();
  S.tutorial.step = Math.max(0, next);

}
function clearTutorial(){

}
function finishTutorial(){

  keepActionGuide();
  S.tutorial = {...S.tutorial, phase: "outro"};
  S.app = "chat"; S.view = "thread"; S.arg = "friend"; S.sheet = null;
  chatMsg("friend", {id: `onboarding:outro:${S.chat.friend.length}`, who: "her", text: "暂时就这些啦。我把行动清单留在聊天里，拿不准的时候可以回来看看。"});

  chatMsg("friend", {id: `onboarding:outro:${S.chat.friend.length}`, who: "her", text: "接下来你自己逛逛吧。先听听画师怎么说，还是去找线索，都由你决定。我就在这里，祝你顺利。"});

function renderTutorial(){
  if (!$tutorial) return;
  clearTutorial();
  const t = S?.tutorial;
  if (!t || t.phase === "done" || t.phase === "outro") return;
  const steps = tutorialSteps(), step = steps[t.step];
  const enabled = t.phase === "intro" ? "[data-tour-skip]" : step.action;
  $app.querySelectorAll("button, summary").forEach(b => {
    if (!enabled || !b.matches(enabled)){
      b.disabled = true;
      if (b.tagName === "SUMMARY"){ b.tabIndex = -1; b.onclick = event => event.preventDefault(); }
    } else if (t.phase === "tour"){
      b.disabled = false; b.tabIndex = 0; b.setAttribute("data-tour-action", "");
      b.onclick = event => { event.preventDefault(); event.stopPropagation(); advanceTour(); };
    }

  document.body.classList.add("is-guided");
  $tutorial.innerHTML = `<aside class="tutorial-coach win" aria-labelledby="tutorial-title"><div class="bar"><span>Chloe · 新手导览</span><span>${t.step + 1} / ${steps.length}</span></div><div class="body">
    <h2 id="tutorial-title">${esc(step.title)}</h2><div id="tutorial-body" aria-live="polite">${step.text.map(text => `<p>${esc(text)}</p>`).join("")}</div>
    <div class="tutorial-controls"><button class="tutorial-link" data-tour-prev ${t.step ? "" : "disabled"}>上一步</button>${step.action ? "" : `<button class="tutorial-link" data-tour-next aria-describedby="tutorial-title">${esc(step.next)}</button>`}<button class="tutorial-link tutorial-skip" data-tour-skip>跳过导览，自己探索</button></div></div></aside>`;

  $tutorial.querySelector("[data-tour-skip]").onclick = () => finishTutorial();
  $tutorial.onkeydown = event => { if (event.key === "Escape"){ event.preventDefault(); finishTutorial(); } };
  document.body.style.setProperty("--coach-height", $tutorial.firstElementChild.offsetHeight + "px");
  const action = step.action ? $app.querySelector(step.action) : null;
  const target = action || $app.querySelector(step.target);
  target?.classList.add("tour-focus");
  const scrollTarget = step.target === '[data-tour-target="phone"]' ? $app.querySelector(step.target) : $app.querySelector(".stage");
  scrollTarget?.scrollIntoView({block: "start", behavior: "instant"});
  if (step.viewTarget){
    const view = document.getElementById("view"), anchor = $app.querySelector(step.viewTarget);
    if (view && anchor) view.scrollTop += anchor.getBoundingClientRect().top - view.getBoundingClientRect().top - 48;
  }
  action?.scrollIntoView({block: "nearest", inline: "nearest", behavior: "instant"});
  positionTutorialCoach();
  (action || $tutorial.querySelector("[data-tour-next]")).focus({preventScroll: true});
}
function positionTutorialCoach(){
  if (!$tutorial || S?.tutorial?.phase !== "tour" || !$tutorial.firstElementChild) return;
  const step = tutorialSteps()[S.tutorial.step], target = $app.querySelector(step.target);
  const coach = $tutorial.firstElementChild;
  if (!target) return;
  const onPhone = step.target === '[data-tour-target="phone"]';
  const anchor = onPhone ? $app.querySelector(".screen") : target;
  const rect = anchor.getBoundingClientRect();
  const width = Math.min(300, (onPhone ? rect.width : $app.querySelector(".stage").getBoundingClientRect().width) - 24, window.innerWidth - 24);
  coach.style.width = width + "px";
  const height = coach.offsetHeight;
  const left = onPhone ? rect.left + (rect.width - width) / 2 : $app.querySelector(".stage").getBoundingClientRect().left + 12;
  const action = step.action ? $app.querySelector(step.action) : null;
  const actionRect = action?.getBoundingClientRect();
  const above = actionRect ? actionRect.top - height - 12 : 0;
  const top = actionRect ? (above >= Math.max(12, rect.top + 12) ? above : actionRect.bottom + 12) : onPhone ? rect.bottom - height - 12 : rect.bottom + 12;
  coach.style.left = Math.max(12, Math.min(left, window.innerWidth - width - 12)) + "px";
  coach.style.top = Math.max(12, Math.min(top, window.innerHeight - height - 12)) + "px";
}
if (typeof window !== "undefined"){
  window.addEventListener("resize", positionTutorialCoach);
  window.addEventListener("scroll", positionTutorialCoach, true);
}

/* ---- Messages are revealed by tapping the phone; time waits until the result is read. ---- */
function unreadDialogue(k){ return S.chatVisible[k] < S.chat[k].length; }
function scrollChatToEnd(){
  const view = document.getElementById("view"); if (view) view.scrollTop = view.scrollHeight;
}
function focusPhone(){ $app.querySelector(".screen")?.focus({preventScroll: true}); }
function readPhone(){
  if (!S || S.screen !== "main" || S.tutorial?.phase === "tour" || S.sheet) return;
  if (S.tutorial?.phase === "intro") return continueIntro();
  if (S.app === "mhs" && S.view === "msg" && unreadMhsDialogue()){
    const t = MHS_THREADS.find(t => t.id === S.arg), reply = S.mhsReplies[t.id];
    const message = t.reply.messages[reply.visible++];
    if (message.ev && !S.evidence.some(e => e.id === message.ev)){
      S.evidence.push({id: message.ev, ...EVIDENCE[message.ev], from: `咪画师 · ${t.who}`});
      note(`收到${t.who}的材料：${EVIDENCE[message.ev].title}，已加入证据清单。`);
    }
    desk(); scrollChatToEnd(); focusPhone(); return;
  }
  if (S.app === "chat" && S.view === "thread"){
    const k = S.arg;
    if (unreadDialogue(k)){
      const m = S.chat[k][S.chatVisible[k]];
      S.chatVisible[k] += 1;
      if (m.publishVideo && S.pendingAction?.type === "videoPublished" && !S.pendingAction.published){
        S.pendingAction.published = true;
        S.po = clamp(S.po + MEDIUM); face("happy");
        postMine("画师的作画过程视频", "tablet");
        note("作画过程视频已发布，网友们有了更多了解她创作的机会。");
      }
      if (m.type === "pic" && m.ev && !S.evidence.some(e => e.id === m.ev)) S.evidence.push({id: m.ev, ...EVIDENCE[m.ev]});
      desk(); scrollChatToEnd(); focusPhone(); return;
    }
    if (S.tutorial?.phase === "outro"){
      S.tutorial.phase = "done";
      note("接下来由你安排。Chloe 的行动清单和导览都可以随时重看。");
      desk(); scrollChatToEnd(); focusPhone(); return;
    }
    if (S.pendingAction?.type === "wagerConfirmed"){
      S.pendingAction = null;
      const announcement = makeWagerAnnouncement();
      S.myNotes.unshift(announcement); S.scheduleLivestream = true;
      note("第五天的直播对赌已约定，公告与规则已经发布。");
      S.app = "xhs"; S.view = "note"; S.arg = announcement.id;
      return queueTime(1);
    }
    if (S.pendingAction && !["videoDecision", "wagerDecision"].includes(S.pendingAction.type)){
      const slots = S.pendingAction.slots;
      S.pendingAction = null;
      if (S.stress >= 100) return ending(6);
      if (S.po <= 0) return ending(7);
      if (slots) return consume(slots);
      desk(); scrollChatToEnd(); focusPhone(); return;
    }
  }
  if (S.pendingTime){ const slots = S.pendingTime; clearActionResultTimer(); S.pendingTime = 0; consume(slots); }
}
function queueTime(slots){
  clearActionResultTimer();
  S.pendingTime = slots;
  const state = S, token = actionResultToken;
  const view = document.getElementById("view"), scrollTop = view?.scrollTop || 0;
  desk();
  const next = document.getElementById("view"); if (next) next.scrollTop = scrollTop;
  focusPhone();
  actionResultTimer = setTimeout(() => {
    if (S !== state || token !== actionResultToken || !S.pendingTime) return;
    const pending = S.pendingTime;
    S.pendingTime = 0;
    actionResultTimer = null;
    consume(pending);
  }, RESULT_HOLD_MS);

  document.getElementById("home").onclick = () => go("home");
  q("[data-tour-start]", () => startTour());
  q("[data-tour-skip]", () => finishTutorial());
  q("[data-video-approve]", () => decideVideo(true));
  q("[data-video-decline]", () => decideVideo(false));
  q("[data-wager-approve]", () => decideWager(true));
  q("[data-wager-decline]", () => decideWager(false));
  q("[data-a]", b => act(b.dataset.a));
  q("[data-app]", b => { const k = b.dataset.app; go(k, k === "mhs" ? "msg" : ""); });
  q("[data-note]", b => go("xhs", "note", b.dataset.note));
  q("[data-feed]", () => go("xhs"));
  q("[data-compose]", () => go("xhs", "compose"));
  q("[data-nlike]", b => { S.noteLikes[b.dataset.nlike] = !S.noteLikes[b.dataset.nlike]; desk(); });
  q("[data-up]", b => { const id = b.dataset.up; S.votes[id] = S.votes[id] === "up" ? "" : "up"; desk(); });
  q("[data-down]", b => { const id = b.dataset.down; S.votes[id] = S.votes[id] === "down" ? "" : "down"; desk(); });
  q("[data-reply]", b => { S.sheet = replySheet(b.dataset.reply); S.replyTo = b.dataset.reply; desk(); });
  q("[data-share]", b => { S.sheet = shareSheet(b.dataset.share); desk(); });
  q("[data-close]", () => { S.sheet = null; desk(); });
  q("[data-rp]", b => {
    const cid = S.replyTo, kind = b.dataset.rp; S.sheet = null; S.usedComments.push(cid);
    S.replies[cid] = b.querySelector("b").textContent;
    if (kind === "agree") agree(); else rebut(kind === "ev" ? b.dataset.evidence : null);
    queueTime(1);
  });
  q("[data-star]", b => collectPost(b.dataset.star));
  q("[data-fwd]", b => forward(b.dataset.fwd));
  q("[data-mhs]", b => go("mhs", b.dataset.mhs));
  q("[data-mthread]", b => { const id = b.dataset.mthread; if (!S.mhsRead.includes(id)) S.mhsRead.push(id); go("mhs", "msg", id); });
  q("[data-mhs-reply]", b => replyMhs(b.dataset.mhsReply));
  q("[data-food]", b => order(FOODS.find(f => f.id === b.dataset.food)));
  q("[data-thread]", b => { S.unreadChat[b.dataset.thread] = 0; go("chat", "thread", b.dataset.thread); });
  q("[data-wx]", b => go("chat", b.dataset.wx === "me" ? "me" : ""));
  q("[data-restart]", () => start());
  q("[data-title]", () => start());
}

/* ---- 行动与规则 ---- */
function agree(amount = SUPPORT_REPLY){ S.po = clamp(S.po + amount); face("smile"); note(`你同意了一条评论。网友们更愿意相信你`); }
function rebut(evidenceId){
  const evidence = S.evidence.find(e => e.id === evidenceId);
  if (evidence){ S.po = clamp(S.po + MEDIUM); face("happy"); note(`你出示了「${evidence.title}」进行反驳。这让更多网友愿意相信她`); }
  else { S.po = clamp(S.po - SMALL); face("sad"); note(`你没有证据就反驳了。网友们反而更怀疑了`); }
}
function collect(e){
  if (S.tutorial?.phase === "tour") return;
  if (!e || S.evidence.some(item => item.id === e.id)) return;
  S.evidence.push(e); face("smile"); note(`你收藏了证据：${e.title}，已加入证据清单。`);
  desk();
}
function forward(id){
  if (S.tutorial?.phase === "tour" || S.pendingAction || S.pendingTime) return;
  if (!artistReady()) return;
  const n = findNote(id); S.sheet = null;
  chatMsg("artist", {id: `forward:${id}`, who: "me", type: "card", note: id});
  if (!S.forwarded.includes(id)){
    S.forwarded.push(id);
    if (n.kind === "accuse"){ S.stress = clamp(S.stress + FORWARD_EFFECT); face("sad"); chatMsg("artist", {id: `forward-reply:${id}`, who: "her", text: "……我看到了。好难受。"}); note(`你把指控帖转给了画师。这让她更紧张了`); }
    else if (n.kind === "support"){ S.stress = clamp(S.stress - FORWARD_EFFECT); face("smile"); chatMsg("artist", {id: `forward-reply:${id}`, who: "her", text: "有人帮我说话，好开心！"}); note(`你把支持的帖子转给了画师。这让她稍微放松了`); }
    else { face("neutral"); chatMsg("artist", {id: `forward-reply:${id}`, who: "her", text: n.kind === "rules" ? "公告里的安排我看到了。希望大家按约定来。" : "对，这是我的。"}); note("你把帖子转给了画师。"); }
  }
  S.unreadChat.artist = 0;
  S.pendingAction = {type: "forward", slots: 1};
  go("chat", "thread", "artist");
  scrollChatToEnd(); focusPhone();
}
function order(f){
  if (S.tutorial?.phase === "tour" || S.pendingAction || S.pendingTime) return;
  if (S.money < f.price) return;
  S.money -= f.price; S.bills.unshift({text: `MiMieat ${f.name}`, amount: -f.price});
  S.stress = clamp(S.stress - f.relief); face("happy");
  chatMsg("artist", {id: `order:${f.id}`, who: "her", text: `${f.name}到了，谢谢你！`});
  note(`你给画师点了${f.name}，这让她稍微放松了一些。`); queueTime(1);
}
function artistReady(){
  if (unreadDialogue("artist")){
    go("chat", "thread", "artist"); scrollChatToEnd(); focusPhone(); return false;
  }
  return true;
}
function decideVideo(approve){
  if (S.pendingAction?.type !== "videoDecision" || unreadDialogue("artist")) return false;
  if (approve && 3 - S.slot < 2) return false;
  chatMsg("artist", {id: `video-answer:${S.chat.artist.length}`, who: "me", text: approve ? "好，麻烦你制作并发布吧。" : "先不做了，你缓一缓。"});
  if (approve){
    chatMsg("artist", {id: `video-making:${S.chat.artist.length}`, who: "her", text: "好，我会专心把过程录下来，再整理成视频。"});
    chatMsg("artist", {id: `video-published:${S.chat.artist.length}`, who: "her", publishVideo: true, text: "作画过程视频已经发布了。希望大家看过以后，能更了解我是怎么画的。"});
    note("你同意制作过程视频，画师开始准备。");
    S.pendingAction = {type: "videoPublished", slots: 2, published: false};
  } else {
    chatMsg("artist", {id: `video-declined:${S.chat.artist.length}`, who: "her", text: "好，那先不做。之后需要的时候再和我说。"});
    note("你决定暂时不制作过程视频，没有花掉时段。");
    S.pendingAction = {type: "videoDeclined", slots: 0};
  }
  desk(); scrollChatToEnd(); focusPhone(); return true;
}
function makeWagerAnnouncement(){
  return {id: "livestream-announcement", title: "第 5 天直播对赌公告与规则", author: "代理人（你）", av: 5, img: "rules", body: LIVESTREAM_RULES.join("\n\n"), tags: "#直播对赌 #规则公告 #可收藏为证据", likes: 0, stars: 0, kind: "rules", mine: true, ev: "livestream-announcement", comments: []};
}
function decideWager(approve){
  if (S.pendingAction?.type !== "wagerDecision" || unreadDialogue("artist")) return false;
  if (approve && (S.day > 3 || S.money < CHARACTERS[S.char].livestreamBalance)) return false;
  chatMsg("artist", {id: `wager-answer:${S.chat.artist.length}`, who: "me", text: approve ? "确定，那就安排吧，我们按约定准备。" : "先不安排了，我想让你缓一缓。"});
  if (approve){
    S.stress = clamp(S.stress + CHARACTERS[S.char].livestreamStress);
    chatMsg("artist", {id: `wager-date:${S.chat.artist.length}`, who: "her", text: "好，那把对赌直播定在第五天。我们就按商量好的规则来。"});
    S.pendingAction = {type: "wagerConfirmed", slots: 1};
    note("你确认了对赌安排，画师承受了更大的压力。");
  } else {
    chatMsg("artist", {id: `wager-declined:${S.chat.artist.length}`, who: "her", text: "好，那暂时不安排。谢谢你愿意先和我商量。"});
    S.pendingAction = {type: "wagerDeclined", slots: 0};
    note("你决定暂时不安排对赌，没有花掉行动点。");
  }
  desk(); scrollChatToEnd(); focusPhone(); return true;
}
function act(k){
  if (S.pendingAction || S.pendingTime || (S.tutorial && S.tutorial.phase !== "done")) return;
  if (k === "respond"){
    if (S.po >= 50){ S.po = clamp(S.po + SMALL); face("smile"); note("你发布了公开回应，一些网友更愿意相信你了。"); }
    else { S.po = clamp(S.po - SMALL); face("sad"); note("你发布了公开回应，但网友们反而更怀疑了。"); }
    postMine("代理人的公开回应", "palette");
    return queueTime(1);
  }
  if (k === "video"){
    if (!artistReady()) return;
    if (3 - S.slot < 2){ note("今天已经没有足够时间制作过程视频了。"); return desk(); }
    chatMsg("artist", {id: `video-request:${S.chat.artist.length}`, who: "me", text: "可以制作并发布一段作画过程视频吗？"});
    chatMsg("artist", {id: `video-explain:${S.chat.artist.length}`, who: "her", text: "可以，不过我需要一些时间制作，要重新准备、绘画、录制，再整理视频。"});
    chatMsg("artist", {id: `video-confirm:${S.chat.artist.length}`, who: "her", text: "时间会有点长，这期间我得专心做这件事。你觉得现在要做吗？"});
    S.pendingAction = {type: "videoDecision", slots: 0};
    note("你在和画师商量制作作画过程视频。");
    go("chat", "thread", "artist"); scrollChatToEnd(); focusPhone(); return;
  }
  if (k === "chat"){
    if (!artistReady()) return;
    if (S.slot === 0){ face("speechless"); note("画师早上不在线，她睡得晚。这个时段没有用掉。"); return desk(); }
    S.stress = clamp(S.stress - SMALL); face("smile");
    const e = ARTIST_EVIDENCE.find(x => !S.evidence.some(y => y.id === x.id));
    chatMsg("artist", {id: `check-in:${S.day}:${S.slot}`, who: "me", text: "今天怎么样？"});
    chatMsg("artist", {id: `check-in-reply:${S.day}:${S.slot}`, who: "her", text: e ? "谢谢你来问。这个发你，应该有用。" : "谢谢你陪我聊天，我手上的文件都给你了。"});
    if (e) chatMsg("artist", {id: `file:${e.id}`, who: "her", type: "pic", ev: e.id});
    note("你和画师聊了聊，她稍微放松了一些。");
    S.pendingAction = {type: "chat", slots: 1};
    go("chat", "thread", "artist"); scrollChatToEnd(); focusPhone(); return;
  }
  if (k === "announce"){
    if (!artistReady()) return;
    if (S.scheduleLivestream) return;
    if (S.day > 3){ note("已经来不及提前安排直播对赌了。这个行动点没有用掉。"); return desk(); }
    const required = CHARACTERS[S.char].livestreamBalance;
    if (S.money < required){ note(`余额不足，需要至少保有 ¥${required} 才能发起直播对赌。`); return desk(); }
    chatMsg("artist", {id: `wager-request:${S.chat.artist.length}`, who: "me", text: "我们要不要安排一场直播对赌，公开回应这次争议？"});
    chatMsg("artist", {id: `wager-pressure:${S.chat.artist.length}`, who: "her", text: CHARACTERS[S.char].hatesLivestream ? "我很怕镜头，直播对赌会让我压力特别大。你确定要这么做吗？" : "直播对赌会让我承受很大的压力。我想先和你确认，你真的要安排吗？"});
    S.pendingAction = {type: "wagerDecision", slots: 0};
    note("你在和画师商量直播对赌，她想先确认你的决定。");
    go("chat", "thread", "artist"); scrollChatToEnd(); focusPhone(); return;
  }
  if (k === "rest"){ face("idle"); note("你让时间过去了一个时段。"); consume(1); }
}
function postMine(title, imgKey, options = {}){
  const item = {id: "my" + S.myNotes.length, author: "代理人（你）", av: 5, img: imgKey, title, body: title + "。", tags: "#画师代理", likes: 0, stars: 0, kind: "mine", mine: true, comments: [], ...options};
  S.myNotes.unshift(item);
  return item;
}
function consume(n){
  const previousDay = S.day;
  S.slot += n;
  if (S.stress >= 100) return ending(6);
  if (S.po <= 0) return ending(7);
  if (S.slot < 3){ desk(); return timeTransition(previousDay); }
  if (S.day === 5) return vote();
  S.day += 1; S.slot = 0; newDay();
  if (S.day === 5 && S.scheduleLivestream && S.money >= CHARACTERS[S.char].livestreamBalance) livestream();
  else {
    if (S.day === 5 && S.scheduleLivestream){
      S.scheduleLivestream = false;
      chatMsg("artist", {id: "livestream:insufficient-balance", who: "her", text: "现在的余额不够满足直播对赌的条件，这次没办法进行了。"});
      note("开播前余额不足，直播对赌无法进行。");
    }
    desk();
    if (S.day === 3 && S.app === "chat" && S.arg === "artist"){ scrollChatToEnd(); focusPhone(); }
  }
  timeTransition(previousDay);
}
function newDay(){
  chatMsg("artist", {id: `day:${S.day}`, who: "her", type: "sys", text: `第 ${S.day} 天`});
  if (S.day === 3 && !S.day3Accusation){
    S.day3Accusation = true;
    S.po = clamp(S.po - 20); S.stress = clamp(S.stress + 10); face("sad");
    chatMsg("artist", {id: "day3:new-accusation", who: "her", text: "那个指控我的账号又在小粉书发了新的鉴定帖……现在更多人在怀疑我，我有点撑不住了。你能去看看吗？"});
    S.chatVisible.artist = S.chat.artist.length;
    chatMsg("artist", {id: "day3:accusation-link", who: "her", type: "card", note: DAY3_NOTE.id});
    S.app = "chat"; S.view = "thread"; S.arg = "artist"; S.sheet = null; S.unreadChat.artist = 0;
    note("指控方发布了新的鉴定帖，质疑声变多，画师更紧张了。她发来消息请你查看。");
  } else chatMsg("artist", {id: `morning:${S.day}`, who: "her", text: S.stress >= 70 ? "我今天好累，不太想看评论了……" : S.stress >= 40 ? "早。今天有什么需要我做的吗？" : "早！今天状态还不错。"});
  if (S.po < 40) chatMsg("friend", {id: `morning:${S.day}`, who: "her", text: "评论区好凶……你还撑得住吗？"});
  else if (S.po >= 60) chatMsg("friend", {id: `morning:${S.day}`, who: "her", text: "风向好像变好了，干得漂亮。"});
}

/* ---- 直播 ---- */
function livestream(){
  if (S.money < CHARACTERS[S.char].livestreamBalance){ S.scheduleLivestream = false; note("余额不足，直播对赌无法进行。"); return desk(); }
  S.screen = "live";
  const c = LIVE_COMMENTS[S.liveIndex];
  $app.innerHTML = `<div class="main">
    <section class="stage live" aria-label="直播"><div class="hud"><div class="day-col"><div class="day"><b>5</b><span>直播中</span></div>${sticker()}</div><div class="hud-right"><div class="money">¥${S.money}</div><div class="meters">${meters()}</div></div></div><div class="live-tag">直播中</div><div class="spot">${evidenceList()}</div>${S.last ? `<div class="bubble">${esc(S.last)}</div>` : ""}</section>
    <div class="phone"><div class="screen"><div class="status"><span>${CLOCK[1]}</span><span>第 5 天</span></div>
      <div class="view"><div class="topbar"><span class="grow">小粉书直播 弹幕 ${S.liveIndex + 1} / ${LIVESTREAM_COMMENTS}</span></div>
      ${LIVE_COMMENTS.slice(0, S.liveIndex).map(x => `<div class="cmt">${avatarOf(x.who, 1)}<div class="cb"><div class="cn">${esc(x.who)}</div><div class="ctext">${esc(x.text)}</div></div></div>`).join("")}
      <div class="cmt">${avatarOf(c.who, 2)}<div class="cb"><div class="cn">${esc(c.who)}</div><div class="ctext">${esc(c.text)}</div>
        <div class="row" style="margin-top:6px"><button class="btn" data-l="ag">同意</button><button class="btn" data-l="rb">反驳</button></div></div></div></div></div>
      <button class="home" aria-label="直播中" disabled></button></div></div>`;
  const next = () => { S.liveIndex += 1;
    if (S.stress >= 100) return ending(6);
    if (S.po <= 0) return ending(7);
    S.liveIndex >= LIVESTREAM_COMMENTS ? vote() : livestream(); };
  const ag = $app.querySelector('[data-l="ag"]'), rb = $app.querySelector('[data-l="rb"]');
  if (ag) ag.onclick = () => { agree(SMALL); next(); };
  if (rb) rb.onclick = () => rebutDialog(next);
}
function rebutDialog(done){
  const has = S.evidence.length > 0;
  if (!has) face("confused");
  modal(`<h2>反驳</h2><p>${has ? "要附上证据吗？" : "你还没有证据。"}</p>
    <div class="stack">${S.evidence.map(e => `<button class="btn" data-use="${esc(e.id)}">附上证据：${esc(e.title)}</button>`).join("")}
    <button class="btn" data-use="">不附证据，直接反驳</button></div>`, root => {
    root.querySelectorAll("[data-use]").forEach(b => b.onclick = () => { closeModal(); rebut(b.dataset.use); done(); });
  });
}

/* ---- 投票与结局 ---- */
function vote(){
  S.screen = "vote"; face("think");
  const yes = S.po;
  $app.innerHTML = `<div class="win center"><div class="bar">社区投票</div><div class="body">
    <div><p>社区已经对这场争议作出了判断。</p>
      <div class="pie" style="background:conic-gradient(var(--po) 0 ${yes}%, var(--stress) ${yes}% 100%)" role="img" aria-label="人工绘制 ${yes}%，AI ${100 - yes}%"></div>
      <div class="legend"><span><span class="sw" style="background:var(--po)"></span>人工绘制 ${yes}%</span><span><span class="sw" style="background:var(--stress)"></span>AI ${100 - yes}%</span></div>
      <div class="row" style="margin-top:12px;justify-content:center"><button class="btn primary" id="go">查看结果</button></div></div></div></div>`;
  document.getElementById("go").onclick = () => {
    const p = S.po, s = S.stress;
    if (p === 50) return ending(3);
    if (p > 50) return ending(s >= 50 ? 1 : 2);
    return ending(s >= 50 ? 4 : 5);
  };
}
function ending(n){
  closeModal();
  $app.innerHTML = `<div class="win center"><div class="bar">结局</div><div class="body">
    <div class="stack"><p class="muted">结局 0${n}</p><h1>${ENDINGS[n]}</h1>${meters()}
    <div class="row"><button class="btn primary" id="go">结束游戏</button></div></div></div></div>`;
  document.getElementById("go").onclick = start;
}
function modal(html, wire){
  $modal.innerHTML = `<div class="modal"><div class="win"><div class="bar">确认</div><div class="body">${html}</div></div></div>`;
  wire($modal); const f = $modal.querySelector("button"); if (f) f.focus();
}
function closeModal(){ $modal.innerHTML = ""; }

start();
</script>
</body>
</html>
