 const at=now();const common=(id,day,type,status='draft')=>({id,day,type,status,notes:'示例内容，可自由修改或删除。',updatedAt:at,order:0});

 {id:'action_support',name:'回复支持评论',key:'reply_support',description:'感谢愿意支持画师的网友。',category:'社交',dayStart:1,dayEnd:5,conditions:[],effects:[{statId:'stat_opinion',delta:2}],status:'final',notes:'示例：实际游戏规则以游戏代码为准。',updatedAt:at},

}
class ValidationError extends Error{constructor(errors){super(errors.slice(0,12).join('\n'));this.name='ValidationError';this.errors=errors}}
function normalizeData(input){
 const errors=[];const fail=(path,msg)=>errors.push(path+'：'+msg);const obj=(x,p)=>{if(!x||typeof x!=='object'||Array.isArray(x)){fail(p,'应为对象');return {}}return x};

 const number=(x,p,fallback=0,nullable=false)=>{if(nullable&&(x===null||x===undefined||x===''))return null;if(x===undefined)return fallback;if(typeof x!=='number'||!Number.isFinite(x)){fail(p,'应为有效数字');return fallback}return x};

 arr(input.stats,'stats').forEach((v,i)=>{const p='stats['+i+']';v=obj(v,p);const s={id:id(v.id,p+'.id'),name:text(v.name,p+'.name'),key:key(v.key,p+'.key','stats'),initial:number(v.initial,p+'.initial'),min:number(v.min,p+'.min',0,true),max:number(v.max,p+'.max',0,true),unit:text(v.unit,p+'.unit'),description:text(v.description,p+'.description'),updatedAt:time(v.updatedAt,p+'.updatedAt')};if(s.min!==null&&s.max!==null&&s.min>s.max)fail(p,'最小值不能大于最大值');if((s.min!==null&&s.initial<s.min)||(s.max!==null&&s.initial>s.max))fail(p,'初始值应在最小值和最大值之间');out.stats.push(s)});

function itemOptions(items,emptyLabel){return [['',emptyLabel],...items.map(x=>[x.id,'Day '+x.day+' · '+labelOf(x)])]}
function renderInspector(){const found=locate(view.selected);if(found?.bucket==='cases'){renderCaseInspector(found.item);return}if(!found){$('inspector').innerHTML=emptyMarkup('选择一个条目开始编辑','所有修改会自动保存到当前浏览器。用 JSON 导出备份，或提交到 GitHub。');$('workspace').classList.remove('editing');return}const {item:x,bucket}=found;let body='';
 if(bucket==='stats')body=field('名称',x.name,'name')+field('英文 key',x.key,'key',{help:'字母开头，可含数字与下划线。'})+field('初始值',x.initial,'initial',{type:'number'})+field('单位',x.unit,'unit')+field('最小值',x.min,'min',{type:'number',nullable:true,help:'留空表示不限制。'})+field('最大值',x.max,'max',{type:'number',nullable:true,help:'留空表示不限制。'})+field('说明',x.description,'description',{full:true,rows:3});
 if(bucket==='actions')body=field('名称',x.name,'name')+field('英文 key',x.key,'key',{help:'唯一，供选项关联。'})+field('分类',x.category,'category',{help:'可直接输入自定义分类。'})+field('状态',x.status,'status',{options:statusOptions()})+field('起始 Day',x.dayStart,'dayStart',{type:'number'})+field('结束 Day',x.dayEnd,'dayEnd',{type:'number'})+field('描述',x.description,'description',{full:true,rows:3})+field('行动点消耗',x.timeCost,'timeCost',{type:'number'})+field('类型',x.kind,'kind',{options:[['action','玩家行动'],['event','系统事件']]})+field('其他执行条件 / 流程',x.requirement,'requirement',{full:true,rows:3})+'<div class="field full"><span>可用时段</span><div class="row">'+Object.entries(TIME_SLOTS).map(([key,label])=>'<label><input type="checkbox" data-action-slot="'+key+'" '+(x.timeSlots.includes(key)?'checked':'')+'> '+label+'</label>').join('')+'</div></div>';
 if(bucket==='posts')body=commonFields(x)+field('发帖人昵称',x.author,'author',{full:true})+field('标题',x.title,'title',{full:true})+field('正文',x.body,'body',{full:true,rows:9})+field('配图地址或图片数据',x.image,'image',{full:true,help:'可填 https 地址，或从本机选择图片。'})+'<label class="field full"><span>上传配图</span><input type="file" accept="image/png,image/jpeg,image/webp,image/gif" data-image="'+esc(x.id)+'"><small>支持 PNG、JPG、WebP、GIF，单张不超过 2 MB。</small></label>'+(safeImage(x.image)?'<div class="full"><img class="editor-image" src="'+esc(safeImage(x.image))+'" alt="帖子配图预览"></div>':'')+field('点赞数',x.likes,'likes',{type:'number'});
 if(bucket==='comments'){const replies=allItems().filter(v=>v.bucket==='comments'&&v.item.postId===x.postId&&v.item.id!==x.id).map(v=>v.item);body=commonFields(x)+field('所属帖子',x.postId,'postId',{full:true,options:itemOptions(allPosts(),'未关联帖子')})+field('评论人昵称',x.author,'author')+field('点赞数',x.likes,'likes',{type:'number'})+field('回复谁（楼中楼）',x.replyTo,'replyTo',{full:true,options:[['','直接评论帖子'],...replies.map(r=>[r.id,r.author+'：'+r.text.slice(0,35)])]})+field('评论内容',x.text,'text',{full:true,rows:6})}
 if(bucket==='dialogues')body=commonFields(x)+field('对话组名称',x.name,'name',{full:true});
 if(bucket==='choices')body=commonFields(x)+field('所属对话',x.dialogueId,'dialogueId',{full:true,options:itemOptions(allDialogues(),'未关联对话')})+field('选项文本',x.text,'text',{full:true,rows:3})+field('结果或跳转说明',x.result,'result',{full:true,rows:3})+field('出现条件（可选）',x.condition,'condition',{full:true,rows:2})+field('触发的 Action（可选）',x.actionId,'actionId',{full:true,options:[['','不触发 Action'],...data.actions.map(a=>[a.id,a.name+' · '+a.key])]})+'<div class="full effect-text">'+esc(effectText(data.actions.find(a=>a.id===x.actionId)?caseAdjustedAction(data.actions.find(a=>a.id===x.actionId),currentCase()):null))+'</div>';
 const title=bucket==='actions'?'编辑 Action':bucket==='stats'?'编辑数值':TYPES[bucket];$('inspector').innerHTML='<div class="inspector-head"><div class="row spread"><div class="row"><button class="icon editor-back" data-command="close-editor" aria-label="返回列表">'+icon('back')+'<span>返回列表</span></button><h2>'+title+'</h2></div><div class="row"><button data-command="copy-entity">复制</button><button class="danger" data-command="delete-entity">删除</button></div></div></div><div class="inspector-body"><div class="form-grid">'+body+'</div><div id="formErrors" class="form-error" role="alert"></div>'+(bucket==='dialogues'?renderLines(x):'')+(bucket==='actions'?renderRules(x):'')+(bucket!=='stats'?'<div class="section">'+field('备注',x.notes,'notes',{full:true,rows:3})+'</div>':'')+renderRelated(x,bucket)+'<div class="section muted">ID：'+esc(x.id)+'<br>最后修改：<span id="editedAt">'+esc(formatTime(x.updatedAt))+'</span></div></div>';
}
function renderLines(x){return '<div class="section"><div class="row spread"><h3>按顺序播放的台词 · '+x.lines.length+' 句</h3><button data-command="add-line">新增台词</button></div>'+x.lines.map((l,i)=>'<div class="line-edit"><div class="row"><strong class="muted">'+(i+1)+'</strong><input aria-label="第 '+(i+1)+' 句说话角色" placeholder="说话角色" value="'+esc(l.speaker)+'" data-target="'+esc(x.id)+'" data-path="lines.'+i+'.speaker"><button class="icon" data-line-move="'+i+'" data-direction="-1" '+(i===0?'disabled':'')+' aria-label="上移第 '+(i+1)+' 句">'+icon('up')+'</button><button class="icon" data-line-move="'+i+'" data-direction="1" '+(i===x.lines.length-1?'disabled':'')+' aria-label="下移第 '+(i+1)+' 句">'+icon('down')+'</button><button class="icon danger" data-line-delete="'+i+'" aria-label="删除第 '+(i+1)+' 句">'+icon('close')+'</button></div>'+field('台词内容',l.text,'lines.'+i+'.text',{rows:3})+field('情绪 / 表情（可选）',l.emotion,'lines.'+i+'.emotion')+'</div>').join('')+'</div>'}
function renderRules(x){const statOptions=selected=>data.stats.map(s=>'<option value="'+esc(s.id)+'" '+(s.id===selected?'selected':'')+'>'+esc(s.name)+'</option>').join('');return '<div class="section"><div class="row spread"><h3>执行条件</h3><button data-command="add-condition" '+(!data.stats.length?'disabled':'')+'>添加条件</button></div>'+x.conditions.map((c,i)=>'<div class="condition-row"><select aria-label="条件数值" data-target="'+esc(x.id)+'" data-path="conditions.'+i+'.statId">'+statOptions(c.statId)+'</select><select aria-label="比较符" data-target="'+esc(x.id)+'" data-path="conditions.'+i+'.operator">'+OPS.map(op=>'<option '+(op===c.operator?'selected':'')+'>'+esc(op)+'</option>').join('')+'</select><input aria-label="条件值" type="number" step="any" value="'+c.value+'" data-number="true" data-target="'+esc(x.id)+'" data-path="conditions.'+i+'.value"><button class="icon danger" data-rule-delete="conditions.'+i+'" aria-label="删除条件">'+icon('close')+'</button></div>').join('')+(!x.conditions.length?'<p class="muted">无条件，始终可执行。</p>':'')+'</div><div class="section"><div class="row spread"><h3>数值效果</h3><button data-command="add-effect" '+(!data.stats.length?'disabled':'')+'>添加效果</button></div>'+x.effects.map((e,i)=>'<div class="effect-row"><select aria-label="效果数值" data-target="'+esc(x.id)+'" data-path="effects.'+i+'.statId">'+statOptions(e.statId)+'</select><input aria-label="变化量" type="number" step="any" value="'+e.delta+'" data-number="true" data-target="'+esc(x.id)+'" data-path="effects.'+i+'.delta"><button class="icon danger" data-rule-delete="effects.'+i+'" aria-label="删除效果">'+icon('close')+'</button></div>').join('')+(!x.effects.length?'<p class="muted">'+(data.stats.length?'尚未添加数值效果。':'先在左侧定义数值，再添加条件或效果。')+'</p>':'')+'</div>'}
function renderRelated(x,bucket){let title='',rows=[],button='';if(bucket==='posts'){title='这条帖子的评论';rows=allItems().filter(v=>v.bucket==='comments'&&v.item.postId===x.id).map(v=>v.item);button='<button data-related-add="comments">新增评论</button>'}if(bucket==='dialogues'){title='这段对话的选项';rows=allItems().filter(v=>v.bucket==='choices'&&v.item.dialogueId===x.id).map(v=>v.item);button='<button data-related-add="choices">新增选项</button>'}if(bucket==='actions'){title='所有 Case 中引用此 Action 的选项';rows=allCaseItems().filter(v=>v.bucket==='choices'&&v.item.actionId===x.id).map(v=>({...v.item,caseId:v.caseId,caseName:v.caseName}))}if(!title)return '';return (bucket==='actions'?'<div class="section"><h3>当前 Case 的实际效果</h3><p>基础：'+esc(effectText(x))+'</p>'+caseEffectSummary(x)+(!currentCase()?.preferences.some(p=>p.actionId===x.id)?'<p class="muted">没有本 Case 的额外偏好。</p>':'')+'</div>':'')+'<div class="section"><div class="row spread"><h3>'+title+' · '+rows.length+'</h3>'+button+'</div>'+rows.map(r=>'<div class="sub-entry"><div class="row spread"><small>'+esc(r.caseName?r.caseName+' · ':'')+'Day '+r.day+(r.author?' · '+esc(r.author):'')+'</small><button class="link" data-open="'+esc(r.id)+'" data-case-id="'+esc(r.caseId||view.caseId)+'">编辑</button></div><p>'+esc(r.text)+'</p>'+(r.actionId?'<div class="effect-text">'+esc(effectText(caseAdjustedAction(data.actions.find(a=>a.id===r.actionId),data.cases.find(c=>c.id===(r.caseId||view.caseId)))))+'</div>':'')+'</div>').join('')+(!rows.length?'<p class="muted">尚未关联内容。</p>':'')+'</div>'}
/* 覆盖式编辑窗口使用对话框语义，背景不可聚焦；返回时恢复到列表条目。 */
function editorOpen(){return $('workspace').classList.contains('editing')&&!!locate(view.selected)}
function editorFocusables(){return [...$('inspector').querySelectorAll('button,input,select,textarea,a[href],[tabindex]')].filter(e=>!e.disabled&&e.tabIndex>=0&&e.getClientRects().length)}
function syncEditorSurface({focus=false}={}){const active=editorOpen();for(const element of [document.querySelector('.top'),$('sidebar'),document.querySelector('.list-pane'),document.querySelector('.local-line')])if(element)element.inert=active;const editor=$('inspector');if(active){editor.setAttribute('role','dialog');editor.setAttribute('aria-modal','true');editor.tabIndex=-1;if(focus&&!busy)(editorFocusables()[0]||editor).focus({preventScroll:true})}else{editor.removeAttribute('role');editor.removeAttribute('aria-modal');editor.removeAttribute('tabindex')}}
function closeEditor(){$('workspace').classList.remove('editing');syncEditorSurface();const trigger=[...$('listBody').querySelectorAll('[data-select],[data-open]')].find(e=>(e.dataset.select||e.dataset.open)===view.selected);if(trigger){trigger.scrollIntoView({block:'nearest'});trigger.focus({preventScroll:true})}}
function renderAll(){renderSidebar();renderList();renderInspector();renderSync();syncEditorSurface()}
/* ==================== 剧本与 Action 的编辑操作 ==================== */
function showModal(title,body,buttons,{vertical=false}={}){if($('modal').open)closeModal(null);$('modal').innerHTML='<div class="modal-head"><h2 id="modalTitle">'+esc(title)+'</h2><button class="icon" id="modalClose" aria-label="关闭">'+icon('close')+'</button></div><div class="modal-body">'+body+'</div><div class="modal-foot '+(vertical?'vertical':'')+'">'+buttons.map(([value,label,style=''])=>'<button data-dialog-result="'+esc(value)+'" class="'+esc(style)+'">'+esc(label)+'</button>').join('')+'</div>';$('modalClose').onclick=()=>closeModal(null);$('modal').querySelectorAll('[data-dialog-result]').forEach(b=>b.onclick=()=>closeModal(b.dataset.dialogResult));$('modal').showModal();return new Promise(resolve=>modalResolver=resolve)}
function closeModal(value){const resolve=modalResolver;modalResolver=null;$('modal').close();resolve?.(value)}
async function errorDialog(error,title='操作未完成'){await showModal(title,'<p style="white-space:pre-wrap">'+esc(error.message||error)+'</p>',[['ok','知道了','primary']])}
async function addDay(){const next=Math.max(0,...data.days.map(d=>d.day))+1;const answer=await showModal('新增 Day','<label class="field"><span>天数</span><input id="newDay" type="number" min="1" max="10000" step="1" value="'+next+'"></label><p class="muted">不会改动已有 Day 的编号。</p>',[['cancel','取消'],['add','新增','primary']]);if(answer!=='add')return;const day=Number($('newDay').value);if(!Number.isInteger(day)||day<1||day>10000||data.days.some(d=>d.day===day)){await errorDialog(Error('请输入未被使用的 1–10000 之间的整数。'));return}data.days.push({day,posts:[],comments:[],dialogues:[],choices:[]});data.days.sort((a,b)=>a.day-b.day);view.day=day;view.scope='day';view.query='';view.selected='';$('search').value='';commitMutation();toast('已新增 Day '+day)}
function createItem(bucket,day,parentId=''){const d=data.days.find(d=>d.day===day);if(!d)return;const item={id:uid(TYPE_VALUES[bucket]),day,type:TYPE_VALUES[bucket],status:'draft',notes:'',updatedAt:now(),order:Math.max(-1,...Object.keys(TYPES).flatMap(k=>d[k]).map(x=>x.order))+1};if(bucket==='posts')Object.assign(item,{author:'',title:'新帖子',body:'',image:'',likes:0});if(bucket==='comments')Object.assign(item,{postId:parentId,author:'',text:'新评论',replyTo:'',likes:0});if(bucket==='dialogues')Object.assign(item,{name:'新对话',lines:[{id:uid('line'),speaker:'',text:'',emotion:''}]});if(bucket==='choices')Object.assign(item,{dialogueId:parentId,text:'新选项',result:'',condition:'',actionId:''});d[bucket].push(item);touched(item);saveLocal();selectEntity(item.id)}
async function addItem(){if(!data.days.some(d=>d.day===view.day))return addDay();let bucket=view.type;if(bucket==='all'){const answer=await showModal('新增剧本条目','<label class="field"><span>条目类型</span><select id="newType">'+Object.entries(TYPES).map(([k,v])=>'<option value="'+k+'">'+v+'</option>').join('')+'</select></label>',[['cancel','取消'],['add','新增','primary']]);if(answer!=='add')return;bucket=$('newType').value}createItem(bucket,view.day)}
function addStat(){const item={id:uid('stat'),name:'新数值',key:uniqueKey('new_stat','stats'),initial:0,min:null,max:null,unit:'',description:'',updatedAt:now()};data.stats.push(item);for(const c of data.cases)c.initialValues[item.id]=null;touched(item);saveLocal();selectEntity(item.id)}
function addAction(){const item={id:uid('action'),name:'新 Action',key:uniqueKey('new_action','actions'),description:'',category:'未分类',dayStart:1,dayEnd:Math.max(1,...data.days.map(d=>d.day)),timeCost:0,timeSlots:['morning','afternoon','evening'],kind:'action',requirement:'',conditions:[],effects:[],status:'draft',notes:'',updatedAt:now()};data.actions.push(item);touched(item);saveLocal();selectEntity(item.id)}
function copyEntity(){const source=locate(view.selected);if(!source)return;if(source.bucket==='cases')return copyCase();const {bucket}=source,x=clone(source.item);x.id=uid(bucket);x.updatedAt=now();if(x.status)x.status='draft';if(x.name)x.name+='（副本）';else if(x.title)x.title+='（副本）';else x.text+='（副本）';if(x.key)x.key=uniqueKey(x.key+'_copy',bucket);if(x.lines)x.lines.forEach(l=>l.id=uid('line'));if(source.day){const day=data.days.find(d=>d.day===source.day);x.order=Math.max(-1,...Object.keys(TYPES).flatMap(k=>day[k]).map(v=>v.order))+1;day[bucket].push(x)}else data[bucket].push(x);touched(x);saveLocal();selectEntity(x.id);toast('已创建副本，原条目保留')}
function relatedRemoval(initial){const ids=new Set(initial);let changed=true;while(changed){changed=false;for(const {item:x}of allItems())if(!ids.has(x.id)&&((x.type==='comment'&&ids.has(x.postId))||(x.type==='choice'&&ids.has(x.dialogueId)))){ids.add(x.id);changed=true}}return ids}
function removeEntities(ids){const removedActions=new Set(data.actions.filter(x=>ids.has(x.id)).map(x=>x.id)),removedStats=new Set(data.stats.filter(x=>ids.has(x.id)).map(x=>x.id));for(const day of data.days)for(const bucket of Object.keys(TYPES))day[bucket]=day[bucket].filter(x=>!ids.has(x.id));for(const {item:x}of allItems())if(x.replyTo&&ids.has(x.replyTo)){x.replyTo='';x.updatedAt=now()}data.actions=data.actions.filter(x=>!ids.has(x.id));data.stats=data.stats.filter(x=>!ids.has(x.id));for(const c of data.cases){let changed=false;for(const day of c.days)for(const choice of day.choices)if(removedActions.has(choice.actionId)){choice.actionId='';choice.updatedAt=now();changed=true}const length=c.preferences.length;c.preferences=c.preferences.filter(p=>!removedActions.has(p.actionId));if(c.preferences.length!==length)changed=true;for(const p of c.preferences){const old=p.effects.length+p.conditions.length;p.effects=p.effects.filter(e=>!removedStats.has(e.statId));p.conditions=p.conditions.filter(e=>!removedStats.has(e.statId));if(old!==p.effects.length+p.conditions.length)changed=true}for(const id of removedStats)if(Object.hasOwn(c.initialValues,id)){delete c.initialValues[id];changed=true}if(changed)c.updatedAt=now()}for(const a of data.actions){const old=a.conditions.length+a.effects.length;a.conditions=a.conditions.filter(c=>!removedStats.has(c.statId));a.effects=a.effects.filter(e=>!removedStats.has(e.statId));if(old!==a.conditions.length+a.effects.length)a.updatedAt=now()}}
async function deleteEntity(){const found=locate(view.selected);if(!found)return;if(found.bucket==='cases')return deleteCase();const ids=relatedRemoval([found.item.id]);const text='确定删除「'+labelOf(found.item)+'」吗？'+(ids.size>1?'同时删除 '+(ids.size-1)+' 条关联评论或选项。':'')+(found.bucket==='stats'?'引用此数值的 Action 条件、效果、所有 Case 的开局值和偏好规则会被移除。':'')+(found.bucket==='actions'?'所有 Case 中引用此 Action 的选项会取消关联，相关偏好会移除，选项本身保留。':'');if(await showModal('删除条目','<p>'+esc(text)+'</p>',[['cancel','取消'],['delete','确认删除','danger']])!=='delete')return;removeEntities(ids);view.selected='';commitMutation();toast('条目已删除')}
async function deleteDay(){const day=data.days.find(d=>d.day===view.day);if(!day)return;const ids=relatedRemoval(Object.keys(TYPES).flatMap(k=>day[k]).map(x=>x.id));if(await showModal('删除 Day '+day.day,'<p>将删除 '+ids.size+' 条剧本内容，包括其他 Day 引用这些帖子或对话的评论与选项。数值定义和 Action 保留。</p>',[['cancel','取消'],['delete','确认删除','danger']])!=='delete')return;removeEntities(ids);data.days=data.days.filter(d=>d!==day);view.day=data.days[0]?.day||1;view.selected='';commitMutation()}
function reorderItem(id,direction,targetId=null){const found=locate(id);if(!found?.day)return;const d=data.days.find(d=>d.day===found.day);const rows=Object.keys(TYPES).flatMap(k=>d[k]).sort((a,b)=>a.order-b.order);const index=rows.findIndex(x=>x.id===id);let target=targetId?rows.findIndex(x=>x.id===targetId):index+direction;if(target<0||target>=rows.length||target===index)return;const [x]=rows.splice(index,1);rows.splice(target,0,x);rows.forEach((row,i)=>{if(row.order!==i){row.order=i;row.updatedAt=now()}});commitMutation(null,{editor:false})}
function setPath(object,path,value){if(path.startsWith('initialValues.')){const key=path.slice(14);if(!Object.hasOwn(object.initialValues,key))throw Error('开局值字段不存在');object.initialValues[key]=value;return}const segments=path.split('.');let target=object;for(const key of segments.slice(0,-1)){if(key==='__proto__'||key==='constructor'||key==='prototype')throw Error('无效的字段');target=target[key];if(!target||typeof target!=='object')throw Error('字段不存在')}const last=segments.at(-1);if(!Object.hasOwn(target,last))throw Error('字段不存在');target[last]=value}
function applyField(input){const found=locate(input.dataset.target);if(!found)return;const path=input.dataset.path;let value=input.value;if(input.dataset.number){if(value===''){if(input.dataset.nullable)value=null;else{markInvalid(input,'请填写一个有效数字。');return}}else value=Number(value);if(value!==null&&!Number.isFinite(value)){markInvalid(input,'请填写一个有效数字。');return}}if(path==='day')value=Number(value);const previous=clone(data);try{if(path==='day'){const destination=data.days.find(d=>d.day===value),source=data.days.find(d=>d.day===found.day);if(!destination)throw Error('请选择已有 Day。');if(destination!==source){source[found.bucket]=source[found.bucket].filter(x=>x.id!==found.item.id);destination[found.bucket].push(found.item);found.item.day=value;found.item.order=Math.max(-1,...Object.keys(TYPES).flatMap(k=>destination[k]).filter(x=>x.id!==found.item.id).map(x=>x.order))+1}}else{setPath(found.item,path,value);if(path==='postId'){found.item.replyTo='';for(const {item:child}of allItems())if(child.replyTo===found.item.id&&child.postId!==value){child.replyTo='';child.updatedAt=now()}}}normalizeProject(data);input.removeAttribute('aria-invalid');input.setCustomValidity('');if($('formErrors'))$('formErrors').textContent='';if($('banner').dataset.formError){banner('');delete $('banner').dataset.formError}touched(found.item);if($('editedAt'))$('editedAt').textContent=formatTime(found.item.updatedAt);if($('inspector').contains(input)){const scroll=$('listBody').scrollTop;renderSidebar();renderList();$('listBody').scrollTop=scroll}else if(view.selected===found.item.id)renderInspector();if(['day','postId','actionId','dialogueId'].includes(path)||(input.tagName==='SELECT'&&path.startsWith('preferences.')))renderAll();refreshCaseSummaries()}catch(error){data=bindDays(previous);markInvalid(input,error.message)}}
function markInvalid(input,message){input.setAttribute('aria-invalid','true');input.setCustomValidity(message);if($('formErrors'))$('formErrors').textContent=message;else{$('banner').dataset.formError='1';banner(message,true)}}
function validEditor(){const invalid=document.querySelector('[aria-invalid="true"]');if(invalid){invalid.focus();invalid.reportValidity();return false}return true}
async function lineAction(button){const x=locate(view.selected)?.item;if(!x?.lines)return;if(button.dataset.lineDelete!==undefined){const index=Number(button.dataset.lineDelete);if(await showModal('删除台词','<p>确定删除第 '+(index+1)+' 句台词吗？</p>',[['cancel','取消'],['delete','删除','danger']])!=='delete')return;x.lines.splice(index,1)}else{const index=Number(button.dataset.lineMove),next=index+Number(button.dataset.direction);if(next<0||next>=x.lines.length)return;[x.lines[index],x.lines[next]]=[x.lines[next],x.lines[index]]}commitMutation(x)}

function exportJson(document=data){const content=JSON.stringify(normalizeProject(document),null,2);const blob=new Blob([content],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),link=documentNode('a');link.href=url;link.download='game-script-'+new Date().toISOString().replace(/[:.]/g,'-')+'.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return content}
function documentNode(tag){return document.createElement(tag)}
async function importJson(file){if(!file)return;try{if(file.size>10*1024*1024)throw Error('JSON 文件超过 10 MB，请先减少配图大小。');const incoming=normalizeProject(JSON.parse((await file.text()).replace(/^\uFEFF/,'')));const answer=await showModal('导入 JSON','<p>文件包含 '+incoming.cases.length+' 个 Case、'+incoming.cases.reduce((n,c)=>n+c.days.length,0)+' 个 Day、'+incoming.actions.length+' 个 Action 和 '+incoming.stats.length+' 个数值定义。</p><p>覆盖会替换当前数据；合并会保留已有条目，同 ID 的内容以导入文件为准。同 key 的数值和 Action 会合并并自动修复选项引用。</p>',[['cancel','取消'],['merge','合并'],['replace','覆盖现有数据','primary']]);if(!['merge','replace'].includes(answer))return;const result=answer==='merge'?mergeProject(data,incoming):incoming;data=bindDays(result);resetViewForProject();commitMutation();toast('导入完成，已保存到本机')}catch(error){await errorDialog(error,'导入失败：数据未被替换')}finally{$('importFile').value=''}}
/* ==================== GitHub 设置与同步交互 ==================== */
function validateConfig(c,{token=true}={}){if(!/^[A-Za-z0-9_.-]+$/.test(c.owner)||!/[A-Za-z0-9]/.test(c.owner))throw Error('请填写有效的仓库所有者。');if(!/^[A-Za-z0-9_.-]+$/.test(c.repo)||!/[A-Za-z0-9]/.test(c.repo))throw Error('请填写有效的仓库名称。');if(!c.branch||c.branch.startsWith('/')||c.branch.endsWith('/')||c.branch.includes('..')||/[\s~^:?*\[\\]/.test(c.branch))throw Error('请填写有效的分支名称。');if(!c.path||c.path.startsWith('/')||c.path.endsWith('/')||c.path.split('/').some(p=>!p||p==='.'||p==='..')||!c.path.toLowerCase().endsWith('.json'))throw Error('文件路径须为相对路径，且以 .json 结尾，例如 data/script.json。');if(token&&!c.token)throw Error('请填写 Personal Access Token。');return c}
function readConfigForm(){const value={};for(const key of Object.keys(DEFAULT_CONFIG))value[key]=$('gh_'+key).value.trim();return value}
async function openSettings(){const labels={owner:'仓库所有者（owner）',repo:'仓库名（repo）',branch:'分支',path:'JSON 文件路径',token:'Personal Access Token'};const body='<div class="form-grid">'+Object.keys(labels).map(key=>'<label class="field '+(['path','token'].includes(key)?'full':'')+'"><span>'+labels[key]+'</span><input id="gh_'+key+'" type="'+(key==='token'?'password':'text')+'" value="'+esc(config[key])+'" autocomplete="off" spellcheck="false"></label>').join('')+'</div><div class="notice">使用 fine-grained token：只选择这一个仓库，Repository permissions 中仅启用 <b>Contents → Read and write</b>。Token 只保存在本浏览器设置里，不进入导出的 JSON 或提交内容。<br>如果仓库不在 Token 的可选范围中，请检查资源所有者和你的仓库权限。</div><div class="row"><button id="testConnection">测试连接</button><button id="forgetToken" class="link">清空 Token</button></div><p id="connectionResult" class="form-error" role="status"></p>';
 const answer=showModal('GitHub 设置',body,[['cancel','取消'],['save','保存设置','primary']]);$('forgetToken').onclick=()=>{$('gh_token').value='';$('connectionResult').textContent='保存设置后，Token 会从本机设置里移除。'};$('testConnection').onclick=async()=>{const button=$('testConnection');button.disabled=true;$('connectionResult').textContent='正在测试…';try{const c=validateConfig(readConfigForm()),file=await new GithubClient(c).getFile();if(!file.missing)normalizeProject(JSON.parse(file.text));$('connectionResult').style.color='var(--wx-ok)';$('connectionResult').textContent=file.missing?'仓库与分支连接成功。文件尚不存在，保存设置后首次提交可新建。':'连接成功，远程 JSON 格式有效。'}catch(error){$('connectionResult').style.color='var(--xhs-red)';$('connectionResult').textContent=redact(error.message)}finally{button.disabled=false}};
 if(await answer!=='save')return;try{const next=validateConfig(readConfigForm(),{token:false});const changed=configScope(next)!==configScope();localStorage.setItem(KEYS.config,JSON.stringify(next));config=next;if(changed){meta=defaultMeta();meta.scope=configScope();persistMeta()}syncError='';renderSync();toast('GitHub 设置已保存；可拉取或提交剧本')}catch(error){await errorDialog(error,'设置未保存');return openSettings()}}
function redact(message){let text=String(message);if(config?.token)text=text.split(config.token).join('[Token 已隐藏]');return text.replace(/github_pat_[A-Za-z0-9_]+|gh[pousr]_[A-Za-z0-9]+/g,'[Token 已隐藏]')}
async function ensureConfigured(){if(configured())return true;await openSettings();return configured()}
function setBusy(value){busy=value;renderSync()}
function markSynced(document,sha,commitHash=''){meta={scope:configScope(),sha,baseline:clone(document),lastAt:now(),commitHash};syncError='';if(!storageError)banner('');persistMeta()}
async function confirmCommit(snapshot){const answer=await showModal('提交到 GitHub','<p>目标：<b>'+esc(config.owner+'/'+config.repo)+'</b> · '+esc(config.branch)+'<br><code>'+esc(config.path)+'</code></p><label class="field"><span>提交说明</span><textarea id="commitMessage" rows="3">'+esc(projectCommit(meta.baseline,snapshot))+'</textarea></label><p class="muted">只提交这份剧本 JSON。GitHub 设置与 Token 不会包含在数据中。</p>',[['cancel','取消'],['commit','确认提交','primary']]);if(answer!=='commit')return '';const text=$('commitMessage').value.trim();if(!text)throw Error('提交说明不能为空。');return text}
async function requestCreate(){return await showModal('远程文件不存在','<p>仓库和分支可以访问，但 <code>'+esc(config.path)+'</code> 尚不存在。是否用当前本地数据新建这个文件？</p>',[['cancel','取消'],['create','新建文件','primary']])==='create'}
async function applyRemote(client,file){const incoming=normalizeProject(JSON.parse(file.text));data=bindDays(incoming);resetViewForProject();let hash='';try{hash=await client.lastCommit()}catch{}markSynced(incoming,file.sha,hash);saveLocal();renderAll();toast('已拉取远程版本')}
async function pullRemote({automatic=false}={}){if(busy)return;if(!configured()){if(automatic)return;if(!await ensureConfigured())return}if(!validEditor())return;setBusy(true);let create=false;try{const client=new GithubClient(config);const file=await client.getFile();if(file.missing){create=await requestCreate();return}normalizeProject(JSON.parse(file.text));if(changes().length&&await showModal(automatic?'检测到未提交的本地修改':'拉取将覆盖本地数据','<p>当前有 '+changes().length+' 条未提交的修改。拉取会用远程文件替换本地数据。可以先取消并导出 JSON 备份。</p>',[['cancel','保留本地，取消拉取'],['pull','确认拉取远程版本','primary']])!=='pull')return;await applyRemote(client,file)}catch(error){syncError=redact(error.message);toast('拉取失败，本地数据已保留');banner(syncError,true)}finally{setBusy(false);if(create)await pushRemote({createConfirmed:true})}}
async function pushRemote({createConfirmed=false}={}){if(busy||!validEditor())return;if(!await ensureConfigured())return;let snapshot;try{snapshot=publicData()}catch(error){return errorDialog(error,'数据校验未通过')}let message;try{message=await confirmCommit(snapshot)}catch(error){return errorDialog(error)}if(!message)return;setBusy(true);try{const client=new GithubClient(config);let sha=meta.scope===configScope()?meta.sha:null;
 // 未拉取过该目标时，先读取文件，绝不把已有远程文件当成新文件覆盖。
 if(!sha){const remote=await client.getFile();if(remote.missing){if(!createConfirmed&&!await requestCreate())return}else if(diffProject(normalizeProject(JSON.parse(remote.text)),snapshot).length===0){await applyRemote(client,remote);return}else{await resolveConflict(client,snapshot,message);return}}
 try{const result=await client.putFile(snapshot,sha,message);markSynced(snapshot,result.content.sha,result.commit.sha);saveLocal();toast('提交成功 · '+result.commit.sha.slice(0,7))}catch(error){if(error.status===409||error.status===422)await resolveConflict(client,snapshot,message);else throw error}
 }catch(error){syncError=redact(error.message);banner(syncError,true);toast('提交失败，本地修改已保留')}finally{setBusy(false)}}
async function resolveConflict(client,snapshot,message){const choice=await showModal('远程已有新版本','<p>本地记录的文件 SHA 与远程不一致，或这次提交被 GitHub 拒绝。当前修改仍保存在本机，请选择处理方式。</p>',[['remote','1. 拉取远程版本，放弃本地修改'],['local','2. 强制用本地版本覆盖远程'],['backup','3. 先导出本地 JSON 备份，再拉取','primary'],['cancel','取消，保留现状']],{vertical:true});if(!choice||choice==='cancel')return;
 if(choice==='backup')exportJson(snapshot);const latest=await client.getFile();if(choice==='local'){if(await showModal('确认覆盖远程数据','<p>将以本地剧本替换远程文件中的内容，其他人的更新可能被覆盖。确认后会重新读取到的 SHA 随提交发送；若远程再次变化，仍会停止提交。</p>',[['cancel','取消'],['overwrite','确认用本地覆盖','danger']])!=='overwrite')return;const result=await client.putFile(snapshot,latest.missing?null:latest.sha,message);markSynced(snapshot,result.content.sha,result.commit.sha);saveLocal();toast('已用本地版本提交 · '+result.commit.sha.slice(0,7));return}if(latest.missing)throw Error('远程文件已经删除，无法拉取。当前本地数据仍保留。');await applyRemote(client,latest)}
/* ==================== 使用说明（与工具一起保存在本 HTML 内） ==================== */
function showHelp(){return showModal('使用说明','<h3>打开和编辑</h3><ol><li>双击本 HTML 文件即可使用。首次未配置 GitHub 时，会载入两位画师的 Case、当前游戏的剧本模板和完整 Action。旧版浏览器数据会迁移并保留。</li><li>先在左侧切换画师 Case，再选 Day 或共用 Action 管理，中间选条目，在覆盖列表的大窗口中编辑。点“返回列表”或按 Esc 关闭。修改自动保存在当前浏览器；换浏览器或清理网站数据前，请导出 JSON。</li><li>帖子下方可以新增评论；对话下方可以新增选项。选项关联 Action 后，会显示基础效果与当前 Case 偏好叠加后的结果。Case 设置可编辑开局值、复制 Case 和画师偏好；数值定义与基础 Action 共用。</li><li>条目可拖拽排序，也可用上下箭头；对话台词使用各句旁的箭头排序。删除前都会确认。</li><li>JSON 导入可选覆盖或合并。合并按 ID 更新条目，按唯一 key 合并数值和 Action，并修复引用。JSON 字段全部使用英文。导出格式为 version: 2（共用 stats、actions 与独立 cases）；仍可导入旧版 version: 1。</li></ol><h3>创建 fine-grained token</h3><ol><li>在 GitHub 的 Settings → Developer settings → Personal access tokens → Fine-grained tokens 创建 Token，并设置到期时间。</li><li>选择正确的 Resource owner，Repository access 选择 Only select repositories，再选目标仓库。</li><li>Repository permissions 中，仅将 Contents 设为 Read and write。Metadata 的必要读取权限由 GitHub 自动包含。</li><li>在工具的 GitHub 设置里填写 Token，测试连接后保存。权限只允许你本来就有权操作的仓库；如果目标仓库不可选，需由仓库所有者检查授权。</li></ol><p><a href="https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/managing-your-personal-access-tokens" target="_blank" rel="noopener noreferrer">GitHub 官方 Token 说明</a></p><h3>GitHub 同步与托管</h3><ol><li>默认同步 main 分支中的 data/script.json。拉取覆盖本地；提交前可编辑提交说明。冲突时选择远程、本地覆盖，或先导出备份。</li><li>将本 HTML 放在仓库中，在 Settings → Pages 选择 Deploy from a branch、main 和 /(root)，保存。</li><li>发布完成后，通过 https://所有者.github.io/仓库名/script-manager.html 打开。网页与本地文件使用各自独立的浏览器存储。</li></ol><p><a href="https://docs.github.com/en/pages/getting-started-with-github-pages/configuring-a-publishing-source-for-your-github-pages-site" target="_blank" rel="noopener noreferrer">GitHub Pages 官方说明</a></p><div class="notice">同步对象是你配置的 JSON 数据文件。本工具不会把 JSON 自动编译进现有游戏 HTML；游戏读取剧本 JSON 的接入属于单独的运行时改造。配图较多时可能超出浏览器本地存储容量，请缩小图片并定期导出备份。Token 不包含在备份或剧本文件中。</div>',[['ok','开始编辑','primary']])}
/* ==================== Case 导航、设置及偏好编辑 ==================== */
function currentCase(){return data?.cases?.find(c=>c.id===view.caseId)||data?.cases?.[0]||null}
function bindDays(doc){Object.defineProperty(doc,'days',{enumerable:false,configurable:true,get(){return (doc.cases.find(c=>c.id===view.caseId)||doc.cases[0])?.days||[]},set(days){const c=doc.cases.find(c=>c.id===view.caseId)||doc.cases[0];if(c)c.days=days}});return doc}
function rememberCase(){try{localStorage.setItem(KEYS.activeCase,JSON.stringify(view.caseId))}catch{}}
function allCaseItems(){return (data.cases||[]).flatMap(c=>c.days.flatMap(d=>Object.keys(TYPES).flatMap(bucket=>d[bucket].map(item=>({item,bucket,day:d.day,caseId:c.id,caseName:c.name})))))}
function switchCase(id){if(!data.cases.some(c=>c.id===id))return;const sharedScope=['actions','stats'].includes(view.scope)?view.scope:'day';view.caseId=id;rememberCase();view.day=currentCase()?.days[0]?.day||1;view.scope=sharedScope;view.type='all';view.selected='';clearQuery();$('workspace').classList.remove('editing');renderAll()}
function caseItemCount(c){return c.days.reduce((n,d)=>n+Object.keys(TYPES).reduce((sum,k)=>sum+d[k].length,0),0)}
function renderCasesList(){const head=$('listHead'),body=$('listBody');head.innerHTML='<div class="row spread"><h2>Case 管理</h2><button class="primary" data-command="add-case">新增 Case</button></div><p class="list-meta">各画师的剧本独立；数值定义与基础 Action 共用。偏好只追加到所属 Case。</p>';body.innerHTML=data.cases.map(c=>'<article class="entry" tabindex="0" role="button" data-select="'+esc(c.id)+'"><div class="row spread"><span class="type-tag">'+esc(c.artist||'未填写画师')+'</span><span class="muted">'+c.days.length+' 个 Day · '+caseItemCount(c)+' 条内容</span></div><div class="entry-title">'+esc(c.name||'未命名 Case')+'</div><div class="entry-preview">'+esc(c.description||'点击编辑画师信息、开局值及 Action 偏好。')+'</div><div class="entry-footer"><span>'+c.preferences.length+' 条偏好</span><button data-case-switch="'+esc(c.id)+'">进入剧本</button></div></article>').join('')||emptyMarkup('先建立一个画师 Case','数值定义和 Action 可以共用，剧本按 Case 独立保存。')}
function renderCaseInspector(c){const targets=data.actions.map(a=>[a.id,a.name+' · '+a.key]);let html='<div class="inspector-head"><div class="row spread"><div class="row"><button class="icon editor-back" data-command="close-editor" aria-label="返回列表">'+icon('back')+'<span>返回列表</span></button><h2>Case 设置</h2></div><div class="row"><button data-command="copy-case">复制 Case</button><button class="danger" data-command="delete-case">删除 Case</button></div></div></div><div class="inspector-body"><div class="form-grid">'+field('Case 名称',c.name,'name')+field('画师',c.artist,'artist')+field('Case 说明',c.description,'description',{full:true,rows:3})+'</div><div id="formErrors" class="form-error" role="alert"></div><div class="section"><h3>本 Case 的开局值</h3><p class="muted">留空则使用共用数值定义的初始值，不会改动其他 Case。</p><div class="form-grid">'+data.stats.map(s=>field(s.name,c.initialValues[s.id],'initialValues.'+s.id,{type:'number',nullable:true,help:'共用初始值：'+s.initial+(s.unit?' '+s.unit:'')})).join('')+'</div></div><div class="section"><div class="row spread"><h3>Artist preference · 画师偏好</h3><button data-command="add-preference" '+(!data.actions.length?'disabled':'')+'>新增偏好</button></div><p class="muted">额外效果与基础 Action 相加；追加条件与基础条件同时生效。</p>';
 c.preferences.forEach((p,i)=>{const base=data.actions.find(a=>a.id===p.actionId);html+='<section class="preference-block"><div class="row spread"><h3>偏好 '+(i+1)+'</h3><button class="danger" data-preference-delete="'+i+'">删除偏好</button></div><div class="form-grid">'+field('偏好名称',p.name,'preferences.'+i+'.name')+field('影响的 Action',p.actionId,'preferences.'+i+'.actionId',{options:targets})+field('说明',p.description,'preferences.'+i+'.description',{full:true,rows:2})+'</div><div class="row spread preference-heading"><b>额外数值效果</b><button data-pref-add="effects" data-pref-index="'+i+'" '+(!data.stats.length?'disabled':'')+'>添加额外效果</button></div>'+preferenceRows(c,p,i,'effects')+'<div class="row spread preference-heading"><b>追加执行条件</b><button data-pref-add="conditions" data-pref-index="'+i+'" '+(!data.stats.length?'disabled':'')+'>添加条件</button></div>'+preferenceRows(c,p,i,'conditions')+'<div class="notice" data-pref-summary="'+i+'"><b>基础：</b>'+esc(effectText(base))+'<br><b>本 Case 合计：</b>'+esc(base?effectText(caseAdjustedAction(base,c)):'未关联 Action')+(p.conditions.length?'<br>追加条件：'+esc(p.conditions.map(r=>statName(r.statId)+' '+r.operator+' '+r.value).join('；')):'')+'</div></section>'});
 if(!c.preferences.length)html+='<p class="muted">没有额外偏好，沿用共用 Action 的基础效果。</p>';html+='</div><div class="section muted">Case ID：'+esc(c.id)+'<br>最后修改：<span id="editedAt">'+formatTime(c.updatedAt)+'</span></div></div>';$('inspector').innerHTML=html;
}
function preferenceRows(c,p,index,kind){const isCondition=kind==='conditions';return p[kind].map((r,i)=>{const path='preferences.'+index+'.'+kind+'.'+i;return '<div class="'+(isCondition?'condition-row':'effect-row')+'"><select aria-label="偏好数值" data-target="'+esc(c.id)+'" data-path="'+path+'.statId">'+data.stats.map(s=>'<option value="'+esc(s.id)+'" '+(s.id===r.statId?'selected':'')+'>'+esc(s.name)+'</option>').join('')+'</select>'+(isCondition?'<select aria-label="偏好比较符" data-target="'+esc(c.id)+'" data-path="'+path+'.operator">'+OPS.map(op=>'<option '+(op===r.operator?'selected':'')+'>'+esc(op)+'</option>').join('')+'</select>':'')+'<input type="number" step="any" aria-label="'+(isCondition?'偏好条件值':'偏好额外变化量')+'" value="'+(isCondition?r.value:r.delta)+'" data-number="true" data-target="'+esc(c.id)+'" data-path="'+path+(isCondition?'.value':'.delta')+'"><button class="icon danger" data-pref-rule-delete="'+kind+'.'+i+'" data-pref-index="'+index+'" aria-label="删除偏好规则">'+icon('close')+'</button></div>'}).join('')||'<p class="muted">'+(isCondition?'无追加条件。':'无额外数值变化。')+'</p>'}
function caseEffectSummary(action){const c=currentCase(),preferences=c?.preferences.filter(p=>p.actionId===action.id)||[];if(!preferences.length)return '';const extra=preferences.flatMap(p=>p.effects),conditions=preferences.flatMap(p=>p.conditions);return '<div class="case-effect" data-action-summary="'+esc(action.id)+'">'+esc(c.name)+' · 合计：'+esc(effectText(caseAdjustedAction(action,c)))+(extra.length?'<br>偏好额外：'+esc(extra.map(e=>statName(e.statId)+' '+(e.delta>=0?'+':'')+e.delta).join('、')):'')+(conditions.length?'<br>追加条件：'+esc(conditions.map(r=>statName(r.statId)+' '+r.operator+' '+r.value).join('；')):'')+'</div>'}
function refreshCaseSummaries(){const c=currentCase();if(!c)return;for(const el of $('inspector').querySelectorAll('[data-pref-summary]')){const p=c.preferences[Number(el.dataset.prefSummary)];if(!p)continue;const base=data.actions.find(a=>a.id===p.actionId);el.innerHTML='<b>基础：</b>'+esc(effectText(base))+'<br><b>本 Case 合计：</b>'+esc(effectText(caseAdjustedAction(base,c)))+(p.conditions.length?'<br>追加条件：'+esc(p.conditions.map(r=>statName(r.statId)+' '+r.operator+' '+r.value).join('；')):'')}for(const el of $('inspector').querySelectorAll('[data-action-summary]')){const action=data.actions.find(a=>a.id===el.dataset.actionSummary);if(action)el.outerHTML=caseEffectSummary(action)}}
function resetViewForProject(){if(!data.cases.some(c=>c.id===view.caseId))view.caseId=data.cases[0]?.id||'';rememberCase();view.day=data.days[0]?.day||1;view.selected='';view.query='';view.scope=data.cases.length?'day':'cases';$('search').value=''}
async function addCase(){const answer=await showModal('新增画师 Case','<div class="form-grid"><label class="field"><span>Case 名称</span><input id="newCaseName" value="新 Case"></label><label class="field"><span>画师</span><input id="newCaseArtist" value=""></label><label class="field full"><span>剧本起点</span><select id="newCaseTemplate"><option value="blank">空白 Case（Day 1–Day 5）</option><option value="1">画师 1 游戏模板</option><option value="2">画师 2 游戏模板（含直播偏好）</option></select></label></div><p class="muted">共用现有数值定义和 Action；新 Case 的剧本、开局值与偏好独立。</p>',[['cancel','取消'],['add','新增 Case','primary']]);if(answer!=='add')return;const name=$('newCaseName').value.trim(),artist=$('newCaseArtist').value.trim(),template=$('newCaseTemplate').value;if(!name)return errorDialog(Error('Case 名称不能为空。'));let c;if(template==='blank')c={id:uid('case'),name,artist,description:'',updatedAt:now(),initialValues:Object.fromEntries(data.stats.map(s=>[s.id,null])),preferences:[],days:Array.from({length:5},(_,i)=>({day:i+1,posts:[],comments:[],dialogues:[],choices:[]}))};else{data=bindDays(completeGameActions(data));c=duplicateCaseData(buildArtistCase(Number(template),data.stats,data.actions));c.name=name;c.artist=artist||'画师 '+template}data.cases.push(c);view.caseId=c.id;rememberCase();touched(c);saveLocal();selectEntity(c.id)}
function duplicateCaseData(source){const c=clone(source),map=new Map();c.id=uid('case');c.updatedAt=now();for(const d of c.days)for(const kind of Object.keys(TYPES))for(const item of d[kind]){map.set(item.id,uid(TYPE_VALUES[kind]));if(item.lines)for(const l of item.lines)map.set(l.id,uid('line'))}for(const d of c.days)for(const kind of Object.keys(TYPES))for(const item of d[kind]){item.id=map.get(item.id);item.updatedAt=now();if(item.postId)item.postId=map.get(item.postId)||item.postId;if(item.replyTo)item.replyTo=map.get(item.replyTo)||item.replyTo;if(item.dialogueId)item.dialogueId=map.get(item.dialogueId)||item.dialogueId;if(item.lines)item.lines.forEach(l=>l.id=map.get(l.id))}c.preferences.forEach(p=>p.id=uid('preference'));return c}
function copyCase(){const c=currentCase();if(!c)return;const copy=duplicateCaseData(c);copy.name=(c.name||'Case')+'（副本）';data.cases.push(copy);view.caseId=copy.id;rememberCase();touched(copy);saveLocal();selectEntity(copy.id);toast('已复制 Case 剧本和偏好，共用 Action 保持关联')}
async function deleteCase(){const c=currentCase();if(!c)return;if(await showModal('删除 Case','<p>确定删除「'+esc(c.name)+'」及其 '+caseItemCount(c)+' 条剧本内容、开局值和偏好吗？共用的数值定义与 Action，以及其他 Case 都会保留。</p>',[['cancel','取消'],['delete','确认删除 Case','danger']])!=='delete')return;data.cases=data.cases.filter(x=>x.id!==c.id);view.caseId=data.cases[0]?.id||'';view.selected='';view.scope='cases';rememberCase();commitMutation();renderAll()}
function addPreference(){const c=currentCase();if(!c||!data.actions.length)return;c.preferences.push({id:uid('preference'),name:'新偏好',actionId:data.actions[0].id,description:'',effects:[],conditions:[]});commitMutation(c)}
async function preferenceCommand(button){const c=currentCase();if(!c)return;if(button.dataset.preferenceDelete!==undefined){const i=Number(button.dataset.preferenceDelete);if(await showModal('删除画师偏好','<p>确定删除这条偏好吗？基础 Action 不受影响。</p>',[['cancel','取消'],['delete','删除','danger']])==='delete'){c.preferences.splice(i,1);commitMutation(c)}return}const p=c.preferences[Number(button.dataset.prefIndex)];if(!p)return;if(button.dataset.prefAdd){const kind=button.dataset.prefAdd;if(!data.stats.length)return;p[kind].push(kind==='effects'?{statId:data.stats[0].id,delta:0}:{statId:data.stats[0].id,operator:'>=',value:0});commitMutation(c)}else if(button.dataset.prefRuleDelete){const [kind,index]=button.dataset.prefRuleDelete.split('.');if(await showModal('删除偏好规则','<p>确定删除这条额外效果或追加条件吗？</p>',[['cancel','取消'],['delete','删除','danger']])==='delete'){p[kind].splice(Number(index),1);commitMutation(c)}}}
async function fillGameActions(){const before=data.actions.length;data=bindDays(completeGameActions(data));commitMutation();toast('已补齐 '+(data.actions.length-before)+' 个 Action；已有同 key 的编辑已保留')}

/* ==================== 事件绑定与启动 ==================== */
const commands={
 'add-case':addCase,'copy-case':copyCase,'delete-case':deleteCase,'add-preference':addPreference,'fill-game-actions':fillGameActions,'edit-current-case':()=>currentCase()?selectEntity(currentCase().id):addCase(),'add-day':()=>currentCase()?addDay():addCase(),'delete-day':deleteDay,'add-item':addItem,'add-stat':addStat,'add-action':addAction,'copy-entity':copyEntity,'delete-entity':deleteEntity,
 'close-editor':closeEditor,
 'add-line':()=>{const x=locate(view.selected)?.item;if(x?.lines){x.lines.push({id:uid('line'),speaker:'',text:'',emotion:''});commitMutation(x)}},
 'add-condition':()=>{const x=locate(view.selected)?.item;if(x?.conditions&&data.stats.length){x.conditions.push({statId:data.stats[0].id,operator:'>=',value:0});commitMutation(x)}},
 'add-effect':()=>{const x=locate(view.selected)?.item;if(x?.effects&&data.stats.length){x.effects.push({statId:data.stats[0].id,delta:0});commitMutation(x)}}
};
function clearQuery(){view.query='';$('search').value='';$('listBody').scrollTop=0}
function bindEvents(){
 $('search').addEventListener('input',event=>{view.query=event.target.value.trim();renderSidebar();renderList()});$('statusFilter').onchange=event=>{view.status=event.target.value;renderList()};
 $('importBtn').onclick=()=>{if(validEditor())$('importFile').click()};$('importFile').onchange=event=>importJson(event.target.files[0]);$('exportBtn').onclick=()=>{try{if(validEditor()){exportJson();toast('已导出剧本 JSON，未包含 GitHub 设置')}}catch(error){errorDialog(error)}};$('settingsBtn').onclick=openSettings;$('pullBtn').onclick=()=>pullRemote();$('pushBtn').onclick=()=>pushRemote();$('helpBtn').onclick=showHelp;
 document.addEventListener('click',async event=>{if(event.target.closest('#modal'))return;const b=event.target.closest('button');try{if(b?.dataset.caseSwitch){switchCase(b.dataset.caseSwitch);return}if(b?.dataset.preferenceDelete!==undefined||b?.dataset.prefAdd||b?.dataset.prefRuleDelete){await preferenceCommand(b);return}if(b?.dataset.command){await commands[b.dataset.command]?.();return}if(b?.dataset.day){clearQuery();view.scope='day';view.day=Number(b.dataset.day);view.type='all';view.selected='';renderAll();return}if(b?.dataset.scope){clearQuery();view.scope=b.dataset.scope;view.selected='';renderAll();return}if(b?.dataset.type){view.type=b.dataset.type;renderList();return}if(b?.dataset.open){if(b.dataset.caseId&&b.dataset.caseId!==view.caseId)switchCase(b.dataset.caseId);selectEntity(b.dataset.open);return}if(b?.dataset.sort){view.direction=view.sort===b.dataset.sort?-view.direction:1;view.sort=b.dataset.sort;renderList();return}if(b?.dataset.move){reorderItem(b.dataset.move,Number(b.dataset.direction));return}if(b?.dataset.relatedAdd){const parent=locate(view.selected)?.item;if(parent)createItem(b.dataset.relatedAdd,parent.day,parent.id);return}if(b?.dataset.lineMove!==undefined||b?.dataset.lineDelete!==undefined){await lineAction(b);return}if(b?.dataset.ruleDelete){const x=locate(view.selected)?.item,[key,index]=b.dataset.ruleDelete.split('.');if(await showModal('删除规则','<p>确定删除这条'+(key==='effects'?'数值效果':'执行条件')+'吗？</p>',[['cancel','取消'],['delete','删除','danger']])==='delete'){x[key].splice(Number(index),1);commitMutation(x)}return}const entry=event.target.closest('[data-select]');if(entry&&!b){if(entry.dataset.caseId&&entry.dataset.caseId!==view.caseId)switchCase(entry.dataset.caseId);selectEntity(entry.dataset.select)}}catch(error){await errorDialog(error)}});
 document.addEventListener('input',event=>{if(event.target.dataset.path&&!event.isComposing)applyField(event.target)});document.addEventListener('compositionend',event=>{if(event.target.dataset.path)applyField(event.target)});
 document.addEventListener('change',async event=>{const input=event.target;try{if(input.id==='caseSwitch'){switchCase(input.value);return}if(input.dataset.actionSlot){const a=locate(view.selected)?.item;if(a?.timeSlots){a.timeSlots=input.checked?[...new Set([...a.timeSlots,input.dataset.actionSlot])]:a.timeSlots.filter(t=>t!==input.dataset.actionSlot);commitMutation(a)}return}if(input.dataset.path&&input.tagName==='SELECT')applyField(input);if(input.dataset.path==='image'&&!input.hasAttribute('aria-invalid'))renderInspector();if(input.id==='categoryFilter'){view.category=input.value;renderList()}if(input.id==='rangeStart'||input.id==='rangeEnd'){view[input.id]=input.value;renderList()}if(input.dataset.image){const file=input.files[0];if(!file)return;if(!['image/png','image/jpeg','image/webp','image/gif'].includes(file.type)||file.size>2*1024*1024)throw Error('请选择不超过 2 MB 的 PNG、JPG、WebP 或 GIF 图片。');const reader=new FileReader();const result=await new Promise((resolve,reject)=>{reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(Error('无法读取图片'));reader.readAsDataURL(file)});const x=locate(input.dataset.image)?.item;if(x){x.image=result;commitMutation(x)}}}catch(error){await errorDialog(error)}});
 document.addEventListener('keydown',event=>{if(editorOpen()&&!$('modal').open){if(event.key==='Escape'){event.preventDefault();closeEditor();return}if(event.key==='Tab'){const controls=editorFocusables(),first=controls[0],last=controls.at(-1);if(!first){event.preventDefault();$('inspector').focus()}else if(event.shiftKey&&(document.activeElement===first||!$('inspector').contains(document.activeElement))){event.preventDefault();last.focus()}else if(!event.shiftKey&&(document.activeElement===last||!$('inspector').contains(document.activeElement))){event.preventDefault();first.focus()}}}if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='s'){event.preventDefault();if(saveLocal())toast('已保存到本机')}if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k'&&!$('modal').open){event.preventDefault();if(editorOpen())closeEditor();$('search').focus()}const entry=event.target.closest('[data-select]');if(entry&&event.target===entry&&(event.key==='Enter'||event.key===' ')){event.preventDefault();if(entry.dataset.caseId&&entry.dataset.caseId!==view.caseId)switchCase(entry.dataset.caseId);selectEntity(entry.dataset.select)}});
 $('listBody').addEventListener('dragstart',event=>{const row=event.target.closest('[draggable="true"]');if(!row)return;dragId=row.dataset.select;event.dataTransfer.setData('text/plain',dragId);event.dataTransfer.effectAllowed='move';row.classList.add('dragging')});$('listBody').addEventListener('dragover',event=>{const row=event.target.closest('[draggable="true"]');if(row&&dragId){event.preventDefault();event.dataTransfer.dropEffect='move';document.querySelectorAll('.drop-target').forEach(e=>e.classList.remove('drop-target'));row.classList.add('drop-target')}});$('listBody').addEventListener('drop',event=>{event.preventDefault();const row=event.target.closest('[draggable="true"]');if(row&&dragId&&locate(dragId)?.day===locate(row.dataset.select)?.day)reorderItem(dragId,0,row.dataset.select);dragId=null});$('listBody').addEventListener('dragend',()=>{dragId=null;document.querySelectorAll('.dragging,.drop-target').forEach(e=>e.classList.remove('dragging','drop-target'))});
 $('modal').addEventListener('cancel',event=>{event.preventDefault();closeModal(null)});window.addEventListener('resize',()=>syncEditorSurface({focus:editorOpen()&&!$('inspector').contains(document.activeElement)}));window.addEventListener('pagehide',saveLocal);window.addEventListener('beforeunload',()=>saveLocal());window.addEventListener('storage',event=>{if(event.key===KEYS.data&&event.newValue!==lastStored)banner('另一个窗口更新了本地剧本。请先导出当前编辑，再刷新载入，避免互相覆盖。',true)});
}
function boot(){load();$('brandIcon').innerHTML=icon('book');$('searchIcon').innerHTML=icon('search');$('helpBtn').innerHTML=icon('help');renderAll();bindEvents();if(lastStored&&!storageError)$('localStatus').textContent='本地数据已载入 · '+formatTime(data.updatedAt);if(configured())queueMicrotask(()=>pullRemote({automatic:true}))}
if(typeof document!=='undefined'&&document.getElementById('workspace'))boot();
</script>
</body>
