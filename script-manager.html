<script>

const TYPES={posts:'小红书帖子',comments:'评论',dialogues:'对话',choices:'选项文案'};
const STATUSES={draft:'草稿',review:'待修改',final:'定稿'};
const TYPE_VALUES={posts:'post',comments:'comment',dialogues:'dialogue',choices:'choice'};

const KEYS={data:'picasso.scriptManager.data.v1',config:'picasso.scriptManager.github.v1',meta:'picasso.scriptManager.sync.v1'};
const DEFAULT_CONFIG={owner:'xinruilu24-art',repo:'cct405-prototype',branch:'main',path:'data/script.json',token:''};
const now=()=>new Date().toISOString();
const clone=x=>JSON.parse(JSON.stringify(x));
const uid=(prefix='item')=>prefix+'_'+(globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2));
const emptyData=()=>({version:1,updatedAt:now(),stats:[],actions:[],days:[]});
function sampleData(){
 const at=now();const common=(id,day,type,status='draft')=>({id,day,type,status,notes:'示例内容，可自由修改或删除。',updatedAt:at,order:0});
 return {version:1,updatedAt:at,stats:[
 {id:'stat_opinion',name:'舆论',key:'opinion',initial:55,min:0,max:100,unit:'',description:'网友对画师的信任程度。',updatedAt:at},
 {id:'stat_stress',name:'画师压力',key:'stress',initial:35,min:0,max:100,unit:'',description:'画师承受的压力。',updatedAt:at},
 {id:'stat_money',name:'余额',key:'money',initial:100,min:0,max:null,unit:'元',description:'玩家可支配的资金。',updatedAt:at}],
 actions:[
 {id:'action_support',name:'回复支持评论',key:'reply_support',description:'感谢愿意支持画师的网友。',category:'社交',dayStart:1,dayEnd:5,conditions:[],effects:[{statId:'stat_opinion',delta:2}],status:'final',notes:'示例：实际游戏规则以游戏代码为准。',updatedAt:at},
 {id:'action_care',name:'关心画师',key:'care_artist',description:'问问她今天的情况。',category:'陪伴',dayStart:1,dayEnd:5,conditions:[],effects:[{statId:'stat_stress',delta:-5}],status:'draft',notes:'',updatedAt:at}],
 days:[1,2].map(day=>({day,posts:[{...common('post_'+day,day,'post','review'),author:day===1?'鉴图小分队':'画师本人',title:day===1?'这张约稿是怎么完成的？':'整理了一些创作过程',body:day===1?'社区里出现了对这张约稿的讨论。\n你需要先了解发生了什么，再决定如何回应。':'翻到了此前的练习和过程记录，希望能帮助大家了解我的创作。',image:'',likes:day===1?2316:88}],
 comments:[{...common('comment_'+day,day,'comment','final'),postId:'post_'+day,author:day===1?'墨水瓶':'客户布丁',text:day===1?'我关注这位画师好几年了，想先看看具体材料。':'我也留存了以前约稿的过程图，需要的话可以提供。',replyTo:'',likes:day===1?205:42}],
 dialogues:[{...common('dialogue_'+day,day,'dialogue'),name:day===1?'Day 1 · Chloe 的开场':'Day 2 · 向客户索取材料',lines:[{id:'line_'+day+'_1',speaker:day===1?'Chloe':'客户布丁',text:day===1?'我陪你熟悉一下这里，先听听画师怎么说吧。':'我约过她两次，每次都有过程图。',emotion:day===1?'平静':'认真'},{id:'line_'+day+'_2',speaker:'玩家',text:day===1?'我先去看看大家在讨论什么。':'谢谢你，可以把记录发给我吗？',emotion:''}]}],
 choices:[{...common('choice_'+day,day,'choice'),dialogueId:'dialogue_'+day,text:day===1?'先关心一下画师':'感谢客户的支持',result:day===1?'进入画师聊天，继续了解情况。':'继续阅读客户发来的过程记录。',condition:'',actionId:day===1?'action_care':'action_support'}]}))};
}
class ValidationError extends Error{constructor(errors){super(errors.slice(0,12).join('\n'));this.name='ValidationError';this.errors=errors}}
function normalizeData(input){
 const errors=[];const fail=(path,msg)=>errors.push(path+'：'+msg);const obj=(x,p)=>{if(!x||typeof x!=='object'||Array.isArray(x)){fail(p,'应为对象');return {}}return x};
 const arr=(x,p)=>{if(!Array.isArray(x)){fail(p,'应为数组');return []}return x};
 const text=(x,p,fallback='')=>{if(x===undefined)return fallback;if(typeof x!=='string'){fail(p,'应为文字');return fallback}return x};
 const number=(x,p,fallback=0,nullable=false)=>{if(nullable&&(x===null||x===undefined||x===''))return null;if(x===undefined)return fallback;if(typeof x!=='number'||!Number.isFinite(x)){fail(p,'应为有效数字');return fallback}return x};
 const time=(x,p)=>{const v=text(x,p,now());if(!Number.isFinite(Date.parse(v)))fail(p,'时间格式无效');return v};
 const status=(x,p)=>{if(x===undefined)return 'draft';if(!Object.hasOwn(STATUSES,x)){fail(p,'状态应为 draft、review 或 final');return 'draft'}return x};
 const ids=new Set();const id=(x,p)=>{const v=text(x,p);if(!v||v.length>200)fail(p,'ID 不能为空或超过 200 字');if(ids.has(v))fail(p,'ID 重复：'+v);ids.add(v);return v};
 const integer=(x,p,fallback=1)=>{const v=number(x,p,fallback);if(!Number.isInteger(v)||v<1||v>10000)fail(p,'应为 1–10000 的整数');return v};
 input=obj(input,'数据');if(input.version!==1)fail('version','目前只支持版本 1');
 const out={version:1,updatedAt:time(input.updatedAt,'updatedAt'),stats:[],actions:[],days:[]};
 const keySets={stats:new Set(),actions:new Set()};
 const key=(x,p,group)=>{const v=text(x,p);if(!/^[A-Za-z][A-Za-z0-9_]*$/.test(v))fail(p,'英文 key 须以字母开头，只含字母、数字、下划线');if(keySets[group].has(v))fail(p,'英文 key 重复：'+v);keySets[group].add(v);return v};
 arr(input.stats,'stats').forEach((v,i)=>{const p='stats['+i+']';v=obj(v,p);const s={id:id(v.id,p+'.id'),name:text(v.name,p+'.name'),key:key(v.key,p+'.key','stats'),initial:number(v.initial,p+'.initial'),min:number(v.min,p+'.min',0,true),max:number(v.max,p+'.max',0,true),unit:text(v.unit,p+'.unit'),description:text(v.description,p+'.description'),updatedAt:time(v.updatedAt,p+'.updatedAt')};if(s.min!==null&&s.max!==null&&s.min>s.max)fail(p,'最小值不能大于最大值');if((s.min!==null&&s.initial<s.min)||(s.max!==null&&s.initial>s.max))fail(p,'初始值应在最小值和最大值之间');out.stats.push(s)});
 const statIds=new Set(out.stats.map(s=>s.id));
 arr(input.actions,'actions').forEach((v,i)=>{const p='actions['+i+']';v=obj(v,p);const a={id:id(v.id,p+'.id'),name:text(v.name,p+'.name'),key:key(v.key,p+'.key','actions'),description:text(v.description,p+'.description'),category:text(v.category,p+'.category'),dayStart:integer(v.dayStart,p+'.dayStart'),dayEnd:integer(v.dayEnd,p+'.dayEnd',5),conditions:[],effects:[],status:status(v.status,p+'.status'),notes:text(v.notes,p+'.notes'),updatedAt:time(v.updatedAt,p+'.updatedAt')};if(a.dayStart>a.dayEnd)fail(p,'起始 Day 不能晚于结束 Day');
 arr(v.conditions??[],p+'.conditions').forEach((c,j)=>{const q=p+'.conditions['+j+']';c=obj(c,q);const statId=text(c.statId,q+'.statId');if(!statIds.has(statId))fail(q,'引用的数值不存在');if(!OPS.includes(c.operator))fail(q,'比较符无效');a.conditions.push({statId,operator:OPS.includes(c.operator)?c.operator:'>=',value:number(c.value,q+'.value')})});
 arr(v.effects??[],p+'.effects').forEach((e,j)=>{const q=p+'.effects['+j+']';e=obj(e,q);const statId=text(e.statId,q+'.statId');if(!statIds.has(statId))fail(q,'引用的数值不存在');a.effects.push({statId,delta:number(e.delta,q+'.delta')})});out.actions.push(a)});

function renderActions(head,body){const categories=[...new Set(data.actions.map(a=>a.category).filter(Boolean))].sort();if(view.category&&!categories.includes(view.category))view.category='';head.innerHTML='<div class="row spread"><h2>Action 列表</h2><button class="primary" data-command="add-action">新增 Action</button></div><p class="list-meta">数值变化量可直接在表格内修改。点击名称编辑完整规则。</p><div class="row filters"><select id="categoryFilter" aria-label="按 Action 分类筛选"><option value="">所有分类</option>'+categories.map(c=>'<option '+(view.category===c?'selected':'')+'>'+esc(c)+'</option>').join('')+'</select><label>Day <input id="rangeStart" type="number" min="1" value="'+esc(view.rangeStart)+'" placeholder="起" aria-label="筛选起始 Day"></label><label>— <input id="rangeEnd" type="number" min="1" value="'+esc(view.rangeEnd)+'" placeholder="止" aria-label="筛选结束 Day"></label></div>';
 const rows=data.actions.filter(a=>entryMatches(a)&&(!view.category||a.category===view.category)&&(!view.rangeStart||a.dayEnd>=Number(view.rangeStart))&&(!view.rangeEnd||a.dayStart<=Number(view.rangeEnd))).sort((a,b)=>{const x=actionSortValue(a,view.sort),y=actionSortValue(b,view.sort);return view.direction*(typeof x==='number'?x-y:String(x).localeCompare(String(y),'zh-CN',{numeric:true}))});if(!rows.length){body.innerHTML=emptyMarkup('没有匹配的 Action','可以新增 Action，或调整分类、Day 范围和状态筛选。');return}
 const cols=[['name','名称'],['key','英文 key'],['category','分类'],['range','可用 Day'],['conditions','执行条件'],['effects','数值效果'],['status','状态'],['updatedAt','修改时间']];body.innerHTML='<div class="table-scroll"><table><thead><tr>'+cols.map(([key,title])=>'<th aria-sort="'+(view.sort===key?(view.direction===1?'ascending':'descending'):'none')+'"><button data-sort="'+key+'">'+title+(view.sort===key?(view.direction===1?' ↑':' ↓'):'')+'</button></th>').join('')+'</tr></thead><tbody>'+rows.map(a=>'<tr class="'+(view.selected===a.id?'selected':'')+'"><td><button class="link" data-open="'+esc(a.id)+'">'+esc(a.name||'未命名 Action')+'</button></td><td>'+esc(a.key)+'</td><td>'+esc(a.category||'未分类')+'</td><td>'+a.dayStart+'–'+a.dayEnd+'</td><td>'+esc(conditionText(a))+'</td><td>'+a.effects.map((e,i)=>'<label class="inline-effect">'+esc(statName(e.statId))+'<input class="delta" type="number" step="any" aria-label="'+esc(a.name+' '+statName(e.statId)+' 变化量')+'" value="'+e.delta+'" data-target="'+esc(a.id)+'" data-path="effects.'+i+'.delta" data-number="true"></label>').join('')+(a.effects.length?'':'<span class="muted">无变化</span>')+'</td><td><span class="badge '+a.status+'">'+STATUSES[a.status]+'</span></td><td>'+formatTime(a.updatedAt)+'</td></tr>').join('')+'</tbody></table></div>';
}
/* ==================== 编辑面板与关联内容 ==================== */
function field(label,value,path,{target=view.selected,type='text',full=false,options=null,help='',nullable=false,rows=0}={}){const attr=' data-target="'+esc(target)+'" data-path="'+esc(path)+'"';let input;if(options)input='<select'+attr+'>'+options.map(([v,t])=>'<option value="'+esc(v)+'" '+(String(value)===String(v)?'selected':'')+'>'+esc(t)+'</option>').join('')+'</select>';else if(rows)input='<textarea rows="'+rows+'"'+attr+'>'+esc(value)+'</textarea>';else input='<input type="'+type+'" value="'+esc(value)+'"'+attr+(type==='number'?' data-number="true" step="any"':'')+(nullable?' data-nullable="true"':'')+'>';return '<label class="field '+(full?'full':'')+'"><span>'+label+'</span>'+input+(help?'<small>'+help+'</small>':'')+'</label>'}
function statusOptions(){return Object.entries(STATUSES)}
function commonFields(x){return field('所属 Day',x.day,'day',{options:data.days.map(d=>[d.day,'Day '+d.day])})+field('状态',x.status,'status',{options:statusOptions()})}
function itemOptions(items,emptyLabel){return [['',emptyLabel],...items.map(x=>[x.id,'Day '+x.day+' · '+labelOf(x)])]}
function renderInspector(){const found=locate(view.selected);if(!found){$('inspector').innerHTML=emptyMarkup('选择一个条目开始编辑','所有修改会自动保存到当前浏览器。用 JSON 导出备份，或提交到 GitHub。');$('workspace').classList.remove('editing');return}const {item:x,bucket}=found;let body='';
 if(bucket==='stats')body=field('名称',x.name,'name')+field('英文 key',x.key,'key',{help:'字母开头，可含数字与下划线。'})+field('初始值',x.initial,'initial',{type:'number'})+field('单位',x.unit,'unit')+field('最小值',x.min,'min',{type:'number',nullable:true,help:'留空表示不限制。'})+field('最大值',x.max,'max',{type:'number',nullable:true,help:'留空表示不限制。'})+field('说明',x.description,'description',{full:true,rows:3});
 if(bucket==='actions')body=field('名称',x.name,'name')+field('英文 key',x.key,'key',{help:'唯一，供选项关联。'})+field('分类',x.category,'category',{help:'可直接输入自定义分类。'})+field('状态',x.status,'status',{options:statusOptions()})+field('起始 Day',x.dayStart,'dayStart',{type:'number'})+field('结束 Day',x.dayEnd,'dayEnd',{type:'number'})+field('描述',x.description,'description',{full:true,rows:3});
 if(bucket==='posts')body=commonFields(x)+field('发帖人昵称',x.author,'author',{full:true})+field('标题',x.title,'title',{full:true})+field('正文',x.body,'body',{full:true,rows:9})+field('配图地址或图片数据',x.image,'image',{full:true,help:'可填 https 地址，或从本机选择图片。'})+'<label class="field full"><span>上传配图</span><input type="file" accept="image/png,image/jpeg,image/webp,image/gif" data-image="'+esc(x.id)+'"><small>支持 PNG、JPG、WebP、GIF，单张不超过 2 MB。</small></label>'+(safeImage(x.image)?'<div class="full"><img class="editor-image" src="'+esc(safeImage(x.image))+'" alt="帖子配图预览"></div>':'')+field('点赞数',x.likes,'likes',{type:'number'});
 if(bucket==='comments'){const replies=allItems().filter(v=>v.bucket==='comments'&&v.item.postId===x.postId&&v.item.id!==x.id).map(v=>v.item);body=commonFields(x)+field('所属帖子',x.postId,'postId',{full:true,options:itemOptions(allPosts(),'未关联帖子')})+field('评论人昵称',x.author,'author')+field('点赞数',x.likes,'likes',{type:'number'})+field('回复谁（楼中楼）',x.replyTo,'replyTo',{full:true,options:[['','直接评论帖子'],...replies.map(r=>[r.id,r.author+'：'+r.text.slice(0,35)])]})+field('评论内容',x.text,'text',{full:true,rows:6})}
 if(bucket==='dialogues')body=commonFields(x)+field('对话组名称',x.name,'name',{full:true});
 if(bucket==='choices')body=commonFields(x)+field('所属对话',x.dialogueId,'dialogueId',{full:true,options:itemOptions(allDialogues(),'未关联对话')})+field('选项文本',x.text,'text',{full:true,rows:3})+field('结果或跳转说明',x.result,'result',{full:true,rows:3})+field('出现条件（可选）',x.condition,'condition',{full:true,rows:2})+field('触发的 Action（可选）',x.actionId,'actionId',{full:true,options:[['','不触发 Action'],...data.actions.map(a=>[a.id,a.name+' · '+a.key])]})+'<div class="full effect-text">'+esc(effectText(data.actions.find(a=>a.id===x.actionId)))+'</div>';
 const title=bucket==='actions'?'编辑 Action':bucket==='stats'?'编辑数值':TYPES[bucket];$('inspector').innerHTML='<div class="inspector-head"><div class="row spread"><div class="row"><button class="icon editor-back" data-command="close-editor" aria-label="返回列表">'+icon('back')+'<span>返回列表</span></button><h2>'+title+'</h2></div><div class="row"><button data-command="copy-entity">复制</button><button class="danger" data-command="delete-entity">删除</button></div></div></div><div class="inspector-body"><div class="form-grid">'+body+'</div><div id="formErrors" class="form-error" role="alert"></div>'+(bucket==='dialogues'?renderLines(x):'')+(bucket==='actions'?renderRules(x):'')+(bucket!=='stats'?'<div class="section">'+field('备注',x.notes,'notes',{full:true,rows:3})+'</div>':'')+renderRelated(x,bucket)+'<div class="section muted">ID：'+esc(x.id)+'<br>最后修改：<span id="editedAt">'+esc(formatTime(x.updatedAt))+'</span></div></div>';
}
function renderLines(x){return '<div class="section"><div class="row spread"><h3>按顺序播放的台词 · '+x.lines.length+' 句</h3><button data-command="add-line">新增台词</button></div>'+x.lines.map((l,i)=>'<div class="line-edit"><div class="row"><strong class="muted">'+(i+1)+'</strong><input aria-label="第 '+(i+1)+' 句说话角色" placeholder="说话角色" value="'+esc(l.speaker)+'" data-target="'+esc(x.id)+'" data-path="lines.'+i+'.speaker"><button class="icon" data-line-move="'+i+'" data-direction="-1" '+(i===0?'disabled':'')+' aria-label="上移第 '+(i+1)+' 句">'+icon('up')+'</button><button class="icon" data-line-move="'+i+'" data-direction="1" '+(i===x.lines.length-1?'disabled':'')+' aria-label="下移第 '+(i+1)+' 句">'+icon('down')+'</button><button class="icon danger" data-line-delete="'+i+'" aria-label="删除第 '+(i+1)+' 句">'+icon('close')+'</button></div>'+field('台词内容',l.text,'lines.'+i+'.text',{rows:3})+field('情绪 / 表情（可选）',l.emotion,'lines.'+i+'.emotion')+'</div>').join('')+'</div>'}
function renderRules(x){const statOptions=selected=>data.stats.map(s=>'<option value="'+esc(s.id)+'" '+(s.id===selected?'selected':'')+'>'+esc(s.name)+'</option>').join('');return '<div class="section"><div class="row spread"><h3>执行条件</h3><button data-command="add-condition" '+(!data.stats.length?'disabled':'')+'>添加条件</button></div>'+x.conditions.map((c,i)=>'<div class="condition-row"><select aria-label="条件数值" data-target="'+esc(x.id)+'" data-path="conditions.'+i+'.statId">'+statOptions(c.statId)+'</select><select aria-label="比较符" data-target="'+esc(x.id)+'" data-path="conditions.'+i+'.operator">'+OPS.map(op=>'<option '+(op===c.operator?'selected':'')+'>'+esc(op)+'</option>').join('')+'</select><input aria-label="条件值" type="number" step="any" value="'+c.value+'" data-number="true" data-target="'+esc(x.id)+'" data-path="conditions.'+i+'.value"><button class="icon danger" data-rule-delete="conditions.'+i+'" aria-label="删除条件">'+icon('close')+'</button></div>').join('')+(!x.conditions.length?'<p class="muted">无条件，始终可执行。</p>':'')+'</div><div class="section"><div class="row spread"><h3>数值效果</h3><button data-command="add-effect" '+(!data.stats.length?'disabled':'')+'>添加效果</button></div>'+x.effects.map((e,i)=>'<div class="effect-row"><select aria-label="效果数值" data-target="'+esc(x.id)+'" data-path="effects.'+i+'.statId">'+statOptions(e.statId)+'</select><input aria-label="变化量" type="number" step="any" value="'+e.delta+'" data-number="true" data-target="'+esc(x.id)+'" data-path="effects.'+i+'.delta"><button class="icon danger" data-rule-delete="effects.'+i+'" aria-label="删除效果">'+icon('close')+'</button></div>').join('')+(!x.effects.length?'<p class="muted">'+(data.stats.length?'尚未添加数值效果。':'先在左侧定义数值，再添加条件或效果。')+'</p>':'')+'</div>'}
function renderRelated(x,bucket){let title='',rows=[],button='';if(bucket==='posts'){title='这条帖子的评论';rows=allItems().filter(v=>v.bucket==='comments'&&v.item.postId===x.id).map(v=>v.item);button='<button data-related-add="comments">新增评论</button>'}if(bucket==='dialogues'){title='这段对话的选项';rows=allItems().filter(v=>v.bucket==='choices'&&v.item.dialogueId===x.id).map(v=>v.item);button='<button data-related-add="choices">新增选项</button>'}if(bucket==='actions'){title='引用这个 Action 的选项';rows=allItems().filter(v=>v.bucket==='choices'&&v.item.actionId===x.id).map(v=>v.item)}if(!title)return '';return '<div class="section"><div class="row spread"><h3>'+title+' · '+rows.length+'</h3>'+button+'</div>'+rows.map(r=>'<div class="sub-entry"><div class="row spread"><small>Day '+r.day+(r.author?' · '+esc(r.author):'')+'</small><button class="link" data-open="'+esc(r.id)+'">编辑</button></div><p>'+esc(r.text)+'</p>'+(r.actionId?'<div class="effect-text">'+esc(effectText(data.actions.find(a=>a.id===r.actionId)))+'</div>':'')+'</div>').join('')+(!rows.length?'<p class="muted">尚未关联内容。</p>':'')+'</div>'}
/* 覆盖式编辑窗口使用对话框语义，背景不可聚焦；返回时恢复到列表条目。 */
function editorOpen(){return $('workspace').classList.contains('editing')&&!!locate(view.selected)}
function editorFocusables(){return [...$('inspector').querySelectorAll('button,input,select,textarea,a[href],[tabindex]')].filter(e=>!e.disabled&&e.tabIndex>=0&&e.getClientRects().length)}
function syncEditorSurface({focus=false}={}){const active=editorOpen();for(const element of [document.querySelector('.top'),$('sidebar'),document.querySelector('.list-pane'),document.querySelector('.local-line')])if(element)element.inert=active;const editor=$('inspector');if(active){editor.setAttribute('role','dialog');editor.setAttribute('aria-modal','true');editor.tabIndex=-1;if(focus&&!busy)(editorFocusables()[0]||editor).focus({preventScroll:true})}else{editor.removeAttribute('role');editor.removeAttribute('aria-modal');editor.removeAttribute('tabindex')}}
function closeEditor(){$('workspace').classList.remove('editing');syncEditorSurface();const trigger=[...$('listBody').querySelectorAll('[data-select],[data-open]')].find(e=>(e.dataset.select||e.dataset.open)===view.selected);if(trigger){trigger.scrollIntoView({block:'nearest'});trigger.focus({preventScroll:true})}}
function renderAll(){renderSidebar();renderList();renderInspector();renderSync();syncEditorSurface()}
/* ==================== 剧本与 Action 的编辑操作 ==================== */
function showModal(title,body,buttons,{vertical=false}={}){if($('modal').open)closeModal(null);$('modal').innerHTML='<div class="modal-head"><h2 id="modalTitle">'+esc(title)+'</h2><button class="icon" id="modalClose" aria-label="关闭">'+icon('close')+'</button></div><div class="modal-body">'+body+'</div><div class="modal-foot '+(vertical?'vertical':'')+'">'+buttons.map(([value,label,style=''])=>'<button data-dialog-result="'+esc(value)+'" class="'+esc(style)+'">'+esc(label)+'</button>').join('')+'</div>';$('modalClose').onclick=()=>closeModal(null);$('modal').querySelectorAll('[data-dialog-result]').forEach(b=>b.onclick=()=>closeModal(b.dataset.dialogResult));$('modal').showModal();return new Promise(resolve=>modalResolver=resolve)}
function closeModal(value){const resolve=modalResolver;modalResolver=null;$('modal').close();resolve?.(value)}
async function errorDialog(error,title='操作未完成'){await showModal(title,'<p style="white-space:pre-wrap">'+esc(error.message||error)+'</p>',[['ok','知道了','primary']])}
async function addDay(){const next=Math.max(0,...data.days.map(d=>d.day))+1;const answer=await showModal('新增 Day','<label class="field"><span>天数</span><input id="newDay" type="number" min="1" max="10000" step="1" value="'+next+'"></label><p class="muted">不会改动已有 Day 的编号。</p>',[['cancel','取消'],['add','新增','primary']]);if(answer!=='add')return;const day=Number($('newDay').value);if(!Number.isInteger(day)||day<1||day>10000||data.days.some(d=>d.day===day)){await errorDialog(Error('请输入未被使用的 1–10000 之间的整数。'));return}data.days.push({day,posts:[],comments:[],dialogues:[],choices:[]});data.days.sort((a,b)=>a.day-b.day);view.day=day;view.scope='day';view.query='';view.selected='';$('search').value='';commitMutation();toast('已新增 Day '+day)}
function createItem(bucket,day,parentId=''){const d=data.days.find(d=>d.day===day);if(!d)return;const item={id:uid(TYPE_VALUES[bucket]),day,type:TYPE_VALUES[bucket],status:'draft',notes:'',updatedAt:now(),order:Math.max(-1,...Object.keys(TYPES).flatMap(k=>d[k]).map(x=>x.order))+1};if(bucket==='posts')Object.assign(item,{author:'',title:'新帖子',body:'',image:'',likes:0});if(bucket==='comments')Object.assign(item,{postId:parentId,author:'',text:'新评论',replyTo:'',likes:0});if(bucket==='dialogues')Object.assign(item,{name:'新对话',lines:[{id:uid('line'),speaker:'',text:'',emotion:''}]});if(bucket==='choices')Object.assign(item,{dialogueId:parentId,text:'新选项',result:'',condition:'',actionId:''});d[bucket].push(item);touched(item);saveLocal();selectEntity(item.id)}
async function addItem(){if(!data.days.some(d=>d.day===view.day))return addDay();let bucket=view.type;if(bucket==='all'){const answer=await showModal('新增剧本条目','<label class="field"><span>条目类型</span><select id="newType">'+Object.entries(TYPES).map(([k,v])=>'<option value="'+k+'">'+v+'</option>').join('')+'</select></label>',[['cancel','取消'],['add','新增','primary']]);if(answer!=='add')return;bucket=$('newType').value}createItem(bucket,view.day)}
function addStat(){const item={id:uid('stat'),name:'新数值',key:uniqueKey('new_stat','stats'),initial:0,min:null,max:null,unit:'',description:'',updatedAt:now()};data.stats.push(item);touched(item);saveLocal();selectEntity(item.id)}
function addAction(){const item={id:uid('action'),name:'新 Action',key:uniqueKey('new_action','actions'),description:'',category:'未分类',dayStart:1,dayEnd:Math.max(1,...data.days.map(d=>d.day)),conditions:[],effects:[],status:'draft',notes:'',updatedAt:now()};data.actions.push(item);touched(item);saveLocal();selectEntity(item.id)}
function copyEntity(){const source=locate(view.selected);if(!source)return;const {bucket}=source,x=clone(source.item);x.id=uid(bucket);x.updatedAt=now();if(x.status)x.status='draft';if(x.name)x.name+='（副本）';else if(x.title)x.title+='（副本）';else x.text+='（副本）';if(x.key)x.key=uniqueKey(x.key+'_copy',bucket);if(x.lines)x.lines.forEach(l=>l.id=uid('line'));if(source.day){const day=data.days.find(d=>d.day===source.day);x.order=Math.max(-1,...Object.keys(TYPES).flatMap(k=>day[k]).map(v=>v.order))+1;day[bucket].push(x)}else data[bucket].push(x);touched(x);saveLocal();selectEntity(x.id);toast('已创建副本，原条目保留')}
function relatedRemoval(initial){const ids=new Set(initial);let changed=true;while(changed){changed=false;for(const {item:x}of allItems())if(!ids.has(x.id)&&((x.type==='comment'&&ids.has(x.postId))||(x.type==='choice'&&ids.has(x.dialogueId)))){ids.add(x.id);changed=true}}return ids}
function removeEntities(ids){for(const day of data.days)for(const bucket of Object.keys(TYPES))day[bucket]=day[bucket].filter(x=>!ids.has(x.id));data.actions=data.actions.filter(x=>!ids.has(x.id));data.stats=data.stats.filter(x=>!ids.has(x.id));for(const {item:x}of allItems()){if(x.replyTo&&ids.has(x.replyTo)){x.replyTo='';x.updatedAt=now()}if(x.actionId&&ids.has(x.actionId)){x.actionId='';x.updatedAt=now()}}for(const a of data.actions){const length=a.conditions.length+a.effects.length;a.conditions=a.conditions.filter(c=>!ids.has(c.statId));a.effects=a.effects.filter(e=>!ids.has(e.statId));if(length!==a.conditions.length+a.effects.length)a.updatedAt=now()}}
async function deleteEntity(){const found=locate(view.selected);if(!found)return;const ids=relatedRemoval([found.item.id]);const text='确定删除「'+labelOf(found.item)+'」吗？'+(ids.size>1?'同时删除 '+(ids.size-1)+' 条关联评论或选项。':'')+(found.bucket==='stats'?'引用此数值的 Action 条件和效果会被移除。':'')+(found.bucket==='actions'?'引用此 Action 的选项会取消关联，选项本身保留。':'');if(await showModal('删除条目','<p>'+esc(text)+'</p>',[['cancel','取消'],['delete','确认删除','danger']])!=='delete')return;removeEntities(ids);view.selected='';commitMutation();toast('条目已删除')}
async function deleteDay(){const day=data.days.find(d=>d.day===view.day);if(!day)return;const ids=relatedRemoval(Object.keys(TYPES).flatMap(k=>day[k]).map(x=>x.id));if(await showModal('删除 Day '+day.day,'<p>将删除 '+ids.size+' 条剧本内容，包括其他 Day 引用这些帖子或对话的评论与选项。数值定义和 Action 保留。</p>',[['cancel','取消'],['delete','确认删除','danger']])!=='delete')return;removeEntities(ids);data.days=data.days.filter(d=>d!==day);view.day=data.days[0]?.day||1;view.selected='';commitMutation()}

function applyField(input){const found=locate(input.dataset.target);if(!found)return;const path=input.dataset.path;let value=input.value;if(input.dataset.number){if(value===''){if(input.dataset.nullable)value=null;else{markInvalid(input,'请填写一个有效数字。');return}}else value=Number(value);if(value!==null&&!Number.isFinite(value)){markInvalid(input,'请填写一个有效数字。');return}}if(path==='day')value=Number(value);const previous=clone(data);try{if(path==='day'){const destination=data.days.find(d=>d.day===value),source=data.days.find(d=>d.day===found.day);if(!destination)throw Error('请选择已有 Day。');if(destination!==source){source[found.bucket]=source[found.bucket].filter(x=>x.id!==found.item.id);destination[found.bucket].push(found.item);found.item.day=value;found.item.order=Math.max(-1,...Object.keys(TYPES).flatMap(k=>destination[k]).filter(x=>x.id!==found.item.id).map(x=>x.order))+1}}else{setPath(found.item,path,value);if(path==='postId'){found.item.replyTo='';for(const {item:child}of allItems())if(child.replyTo===found.item.id&&child.postId!==value){child.replyTo='';child.updatedAt=now()}}}normalizeData(data);input.removeAttribute('aria-invalid');input.setCustomValidity('');if($('formErrors'))$('formErrors').textContent='';if($('banner').dataset.formError){banner('');delete $('banner').dataset.formError}touched(found.item);if($('editedAt'))$('editedAt').textContent=formatTime(found.item.updatedAt);if($('inspector').contains(input)){const scroll=$('listBody').scrollTop;renderSidebar();renderList();$('listBody').scrollTop=scroll}else if(view.selected===found.item.id)renderInspector();if(['day','postId','actionId','dialogueId'].includes(path))renderAll()}catch(error){data=previous;markInvalid(input,error.message)}}

function validateConfig(c,{token=true}={}){if(!/^[A-Za-z0-9_.-]+$/.test(c.owner)||!/[A-Za-z0-9]/.test(c.owner))throw Error('请填写有效的仓库所有者。');if(!/^[A-Za-z0-9_.-]+$/.test(c.repo)||!/[A-Za-z0-9]/.test(c.repo))throw Error('请填写有效的仓库名称。');if(!c.branch||c.branch.startsWith('/')||c.branch.endsWith('/')||c.branch.includes('..')||/[\s~^:?*\[\\]/.test(c.branch))throw Error('请填写有效的分支名称。');if(!c.path||c.path.startsWith('/')||c.path.endsWith('/')||c.path.split('/').some(p=>!p||p==='.'||p==='..')||!c.path.toLowerCase().endsWith('.json'))throw Error('文件路径须为相对路径，且以 .json 结尾，例如 data/script.json。');if(token&&!c.token)throw Error('请填写 Personal Access Token。');return c}

async function openSettings(){const labels={owner:'仓库所有者（owner）',repo:'仓库名（repo）',branch:'分支',path:'JSON 文件路径',token:'Personal Access Token'};const body='<div class="form-grid">'+Object.keys(labels).map(key=>'<label class="field '+(['path','token'].includes(key)?'full':'')+'"><span>'+labels[key]+'</span><input id="gh_'+key+'" type="'+(key==='token'?'password':'text')+'" value="'+esc(config[key])+'" autocomplete="off" spellcheck="false"></label>').join('')+'</div><div class="notice">使用 fine-grained token：只选择这一个仓库，Repository permissions 中仅启用 <b>Contents → Read and write</b>。Token 只保存在本浏览器设置里，不进入导出的 JSON 或提交内容。<br>如果仓库不在 Token 的可选范围中，请检查资源所有者和你的仓库权限。</div><div class="row"><button id="testConnection">测试连接</button><button id="forgetToken" class="link">清空 Token</button></div><p id="connectionResult" class="form-error" role="status"></p>';
 const answer=showModal('GitHub 设置',body,[['cancel','取消'],['save','保存设置','primary']]);$('forgetToken').onclick=()=>{$('gh_token').value='';$('connectionResult').textContent='保存设置后，Token 会从本机设置里移除。'};$('testConnection').onclick=async()=>{const button=$('testConnection');button.disabled=true;$('connectionResult').textContent='正在测试…';try{const c=validateConfig(readConfigForm()),file=await new GithubClient(c).getFile();if(!file.missing)normalizeData(JSON.parse(file.text));$('connectionResult').style.color='var(--wx-ok)';$('connectionResult').textContent=file.missing?'仓库与分支连接成功。文件尚不存在，保存设置后首次提交可新建。':'连接成功，远程 JSON 格式有效。'}catch(error){$('connectionResult').style.color='var(--xhs-red)';$('connectionResult').textContent=redact(error.message)}finally{button.disabled=false}};
 if(await answer!=='save')return;try{const next=validateConfig(readConfigForm(),{token:false});const changed=configScope(next)!==configScope();localStorage.setItem(KEYS.config,JSON.stringify(next));config=next;if(changed){meta=defaultMeta();meta.scope=configScope();persistMeta()}syncError='';renderSync();toast('GitHub 设置已保存；可拉取或提交剧本')}catch(error){await errorDialog(error,'设置未保存');return openSettings()}}

async function confirmCommit(snapshot){const answer=await showModal('提交到 GitHub','<p>目标：<b>'+esc(config.owner+'/'+config.repo)+'</b> · '+esc(config.branch)+'<br><code>'+esc(config.path)+'</code></p><label class="field"><span>提交说明</span><textarea id="commitMessage" rows="3">'+esc(defaultCommit(meta.baseline,snapshot))+'</textarea></label><p class="muted">只提交这份剧本 JSON。GitHub 设置与 Token 不会包含在数据中。</p>',[['cancel','取消'],['commit','确认提交','primary']]);if(answer!=='commit')return '';const text=$('commitMessage').value.trim();if(!text)throw Error('提交说明不能为空。');return text}

async function pullRemote({automatic=false}={}){if(busy)return;if(!configured()){if(automatic)return;if(!await ensureConfigured())return}if(!validEditor())return;setBusy(true);let create=false;try{const client=new GithubClient(config);const file=await client.getFile();if(file.missing){create=await requestCreate();return}normalizeData(JSON.parse(file.text));if(changes().length&&await showModal(automatic?'检测到未提交的本地修改':'拉取将覆盖本地数据','<p>当前有 '+changes().length+' 条未提交的修改。拉取会用远程文件替换本地数据。可以先取消并导出 JSON 备份。</p>',[['cancel','保留本地，取消拉取'],['pull','确认拉取远程版本','primary']])!=='pull')return;await applyRemote(client,file)}catch(error){syncError=redact(error.message);toast('拉取失败，本地数据已保留');banner(syncError,true)}finally{setBusy(false);if(create)await pushRemote({createConfirmed:true})}}
async function pushRemote({createConfirmed=false}={}){if(busy||!validEditor())return;if(!await ensureConfigured())return;let snapshot;try{snapshot=publicData()}catch(error){return errorDialog(error,'数据校验未通过')}let message;try{message=await confirmCommit(snapshot)}catch(error){return errorDialog(error)}if(!message)return;setBusy(true);try{const client=new GithubClient(config);let sha=meta.scope===configScope()?meta.sha:null;
 // 未拉取过该目标时，先读取文件，绝不把已有远程文件当成新文件覆盖。

 }catch(error){syncError=redact(error.message);banner(syncError,true);toast('提交失败，本地修改已保留')}finally{setBusy(false)}}
async function resolveConflict(client,snapshot,message){const choice=await showModal('远程已有新版本','<p>本地记录的文件 SHA 与远程不一致，或这次提交被 GitHub 拒绝。当前修改仍保存在本机，请选择处理方式。</p>',[['remote','1. 拉取远程版本，放弃本地修改'],['local','2. 强制用本地版本覆盖远程'],['backup','3. 先导出本地 JSON 备份，再拉取','primary'],['cancel','取消，保留现状']],{vertical:true});if(!choice||choice==='cancel')return;

function showHelp(){return showModal('使用说明','<h3>打开和编辑</h3><ol><li>双击本 HTML 文件即可使用。首次未配置 GitHub 时，会载入 Day 1、Day 2 示例。</li><li>左侧选 Day 或 Action 管理，中间选条目，在覆盖列表的大窗口中编辑。点“返回列表”或按 Esc 关闭。修改自动保存在当前浏览器；换浏览器或清理网站数据前，请导出 JSON。</li><li>帖子下方可以新增评论；对话下方可以新增选项。选项关联 Action 后，会显示具体数值效果。</li><li>条目可拖拽排序，也可用上下箭头；对话台词使用各句旁的箭头排序。删除前都会确认。</li><li>JSON 导入可选覆盖或合并。合并按 ID 更新条目，按唯一 key 合并数值和 Action，并修复引用。JSON 字段全部使用英文。</li></ol><h3>创建 fine-grained token</h3><ol><li>在 GitHub 的 Settings → Developer settings → Personal access tokens → Fine-grained tokens 创建 Token，并设置到期时间。</li><li>选择正确的 Resource owner，Repository access 选择 Only select repositories，再选目标仓库。</li><li>Repository permissions 中，仅将 Contents 设为 Read and write。Metadata 的必要读取权限由 GitHub 自动包含。</li><li>在工具的 GitHub 设置里填写 Token，测试连接后保存。权限只允许你本来就有权操作的仓库；如果目标仓库不可选，需由仓库所有者检查授权。</li></ol><p><a href="https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/managing-your-personal-access-tokens" target="_blank" rel="noopener noreferrer">GitHub 官方 Token 说明</a></p><h3>GitHub 同步与托管</h3><ol><li>默认同步 main 分支中的 data/script.json。拉取覆盖本地；提交前可编辑提交说明。冲突时选择远程、本地覆盖，或先导出备份。</li><li>将本 HTML 放在仓库中，在 Settings → Pages 选择 Deploy from a branch、main 和 /(root)，保存。</li><li>发布完成后，通过 https://所有者.github.io/仓库名/script-manager.html 打开。网页与本地文件使用各自独立的浏览器存储。</li></ol><p><a href="https://docs.github.com/en/pages/getting-started-with-github-pages/configuring-a-publishing-source-for-your-github-pages-site" target="_blank" rel="noopener noreferrer">GitHub Pages 官方说明</a></p><div class="notice">同步对象是你配置的 JSON 数据文件。本工具不会把 JSON 自动编译进现有游戏 HTML；游戏读取剧本 JSON 的接入属于单独的运行时改造。配图较多时可能超出浏览器本地存储容量，请缩小图片并定期导出备份。Token 不包含在备份或剧本文件中。</div>',[['ok','开始编辑','primary']])}

 document.addEventListener('input',event=>{if(event.target.dataset.path&&!event.isComposing)applyField(event.target)});document.addEventListener('compositionend',event=>{if(event.target.dataset.path)applyField(event.target)});
 document.addEventListener('change',async event=>{const input=event.target;try{if(input.dataset.path&&input.tagName==='SELECT')applyField(input);if(input.dataset.path==='image'&&!input.hasAttribute('aria-invalid'))renderInspector();if(input.id==='categoryFilter'){view.category=input.value;renderList()}if(input.id==='rangeStart'||input.id==='rangeEnd'){view[input.id]=input.value;renderList()}if(input.dataset.image){const file=input.files[0];if(!file)return;if(!['image/png','image/jpeg','image/webp','image/gif'].includes(file.type)||file.size>2*1024*1024)throw Error('请选择不超过 2 MB 的 PNG、JPG、WebP 或 GIF 图片。');const reader=new FileReader();const result=await new Promise((resolve,reject)=>{reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(Error('无法读取图片'));reader.readAsDataURL(file)});const x=locate(input.dataset.image)?.item;if(x){x.image=result;commitMutation(x)}}}catch(error){await errorDialog(error)}});
 document.addEventListener('keydown',event=>{if(editorOpen()&&!$('modal').open){if(event.key==='Escape'){event.preventDefault();closeEditor();return}if(event.key==='Tab'){const controls=editorFocusables(),first=controls[0],last=controls.at(-1);if(!first){event.preventDefault();$('inspector').focus()}else if(event.shiftKey&&(document.activeElement===first||!$('inspector').contains(document.activeElement))){event.preventDefault();last.focus()}else if(!event.shiftKey&&(document.activeElement===last||!$('inspector').contains(document.activeElement))){event.preventDefault();first.focus()}}}if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='s'){event.preventDefault();if(saveLocal())toast('已保存到本机')}if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k'&&!$('modal').open){event.preventDefault();if(editorOpen())closeEditor();$('search').focus()}const entry=event.target.closest('[data-select]');if(entry&&event.target===entry&&(event.key==='Enter'||event.key===' ')){event.preventDefault();selectEntity(entry.dataset.select)}});
 $('listBody').addEventListener('dragstart',event=>{const row=event.target.closest('[draggable="true"]');if(!row)return;dragId=row.dataset.select;event.dataTransfer.setData('text/plain',dragId);event.dataTransfer.effectAllowed='move';row.classList.add('dragging')});$('listBody').addEventListener('dragover',event=>{const row=event.target.closest('[draggable="true"]');if(row&&dragId){event.preventDefault();event.dataTransfer.dropEffect='move';document.querySelectorAll('.drop-target').forEach(e=>e.classList.remove('drop-target'));row.classList.add('drop-target')}});$('listBody').addEventListener('drop',event=>{event.preventDefault();const row=event.target.closest('[draggable="true"]');if(row&&dragId&&locate(dragId)?.day===locate(row.dataset.select)?.day)reorderItem(dragId,0,row.dataset.select);dragId=null});$('listBody').addEventListener('dragend',()=>{dragId=null;document.querySelectorAll('.dragging,.drop-target').forEach(e=>e.classList.remove('dragging','drop-target'))});
 $('modal').addEventListener('cancel',event=>{event.preventDefault();closeModal(null)});window.addEventListener('resize',()=>syncEditorSurface({focus:editorOpen()&&!$('inspector').contains(document.activeElement)}));window.addEventListener('pagehide',saveLocal);window.addEventListener('beforeunload',()=>saveLocal());window.addEventListener('storage',event=>{if(event.key===KEYS.data&&event.newValue!==lastStored)banner('另一个窗口更新了本地剧本。请先导出当前编辑，再刷新载入，避免互相覆盖。',true)});
}
function boot(){load();$('brandIcon').innerHTML=icon('book');$('searchIcon').innerHTML=icon('search');$('helpBtn').innerHTML=icon('help');renderAll();bindEvents();if(lastStored&&!storageError)$('localStatus').textContent='本地数据已载入 · '+formatTime(data.updatedAt);if(configured())queueMicrotask(()=>pullRemote({automatic:true}))}
if(typeof document!=='undefined'&&document.getElementById('workspace'))boot();
</script>
