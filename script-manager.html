<header class="top">
<div class="brand"><div class="brand-title"><span class="brand-mark" id="brandIcon"></span><div><h1>游戏剧本管理器</h1><small class="brand-sub">Prove It, Picasso! · 文案、剧情与行动数值</small></div></div><div class="sync" id="syncStatus" aria-live="polite"></div></div>

<script>

/* ==================== 数据层：格式、校验与合并 ==================== */
const TYPES={posts:'小红书帖子',comments:'评论',dialogues:'对话',choices:'选项文案'};
const STATUSES={draft:'草稿',review:'待修改',final:'定稿'};

const OPS=['>=','<=','>','<','==','!='];

const DEFAULT_CONFIG={owner:'xinruilu24-art',repo:'cct405-prototype',branch:'main',path:'data/script.json',token:''};
const now=()=>new Date().toISOString();
const clone=x=>JSON.parse(JSON.stringify(x));
const uid=(prefix='item')=>prefix+'_'+(globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2));
const emptyData=()=>({version:1,updatedAt:now(),stats:[],actions:[],days:[]});
function sampleData(){
 const at=now();const common=(id,day,type,status='draft')=>({id,day,type,status,notes:'示例内容，可自由修改或删除。',updatedAt:at,order:0});
 return {version:1,updatedAt:at,stats:[
 {id:'stat_opinion',name:'舆论',key:'opinion',initial:55,min:0,max:100,unit:'',description:'网友对画师的信任程度。',updatedAt:at},
 {id:'stat_stress',name:'画师压力',key:'stress',initial:35,min:0,max:100,unit:'',description:'画师承受的压力。',updatedAt:at},
 {id:'stat_money',name:'余额',key:'money',initial:100,min:0,max:null,unit:'元',description:'玩家可支配的资金。',updatedAt:at}],
 actions:[
 {id:'action_support',name:'回复支持评论',key:'reply_support',description:'感谢愿意支持画师的网友。',category:'社交',dayStart:1,dayEnd:5,conditions:[],effects:[{statId:'stat_opinion',delta:2}],status:'final',notes:'示例：实际游戏规则以游戏代码为准。',updatedAt:at},
 {id:'action_care',name:'关心画师',key:'care_artist',description:'问问她今天的情况。',category:'陪伴',dayStart:1,dayEnd:5,conditions:[],effects:[{statId:'stat_stress',delta:-5}],status:'draft',notes:'',updatedAt:at}],
 days:[1,2].map(day=>({day,posts:[{...common('post_'+day,day,'post','review'),author:day===1?'鉴图小分队':'画师本人',title:day===1?'这张约稿是怎么完成的？':'整理了一些创作过程',body:day===1?'社区里出现了对这张约稿的讨论。\n你需要先了解发生了什么，再决定如何回应。':'翻到了此前的练习和过程记录，希望能帮助大家了解我的创作。',image:'',likes:day===1?2316:88}],
 comments:[{...common('comment_'+day,day,'comment','final'),postId:'post_'+day,author:day===1?'墨水瓶':'客户布丁',text:day===1?'我关注这位画师好几年了，想先看看具体材料。':'我也留存了以前约稿的过程图，需要的话可以提供。',replyTo:'',likes:day===1?205:42}],
 dialogues:[{...common('dialogue_'+day,day,'dialogue'),name:day===1?'Day 1 · Chloe 的开场':'Day 2 · 向客户索取材料',lines:[{id:'line_'+day+'_1',speaker:day===1?'Chloe':'客户布丁',text:day===1?'我陪你熟悉一下这里，先听听画师怎么说吧。':'我约过她两次，每次都有过程图。',emotion:day===1?'平静':'认真'},{id:'line_'+day+'_2',speaker:'玩家',text:day===1?'我先去看看大家在讨论什么。':'谢谢你，可以把记录发给我吗？',emotion:''}]}],

}
class ValidationError extends Error{constructor(errors){super(errors.slice(0,12).join('\n'));this.name='ValidationError';this.errors=errors}}
function normalizeData(input){
 const errors=[];const fail=(path,msg)=>errors.push(path+'：'+msg);const obj=(x,p)=>{if(!x||typeof x!=='object'||Array.isArray(x)){fail(p,'应为对象');return {}}return x};
 const arr=(x,p)=>{if(!Array.isArray(x)){fail(p,'应为数组');return []}return x};
 const text=(x,p,fallback='')=>{if(x===undefined)return fallback;if(typeof x!=='string'){fail(p,'应为文字');return fallback}return x};
 const number=(x,p,fallback=0,nullable=false)=>{if(nullable&&(x===null||x===undefined||x===''))return null;if(x===undefined)return fallback;if(typeof x!=='number'||!Number.isFinite(x)){fail(p,'应为有效数字');return fallback}return x};
 const time=(x,p)=>{const v=text(x,p,now());if(!Number.isFinite(Date.parse(v)))fail(p,'时间格式无效');return v};
 const status=(x,p)=>{if(x===undefined)return 'draft';if(!Object.hasOwn(STATUSES,x)){fail(p,'状态应为 draft、review 或 final');return 'draft'}return x};
 const ids=new Set();const id=(x,p)=>{const v=text(x,p);if(!v||v.length>200)fail(p,'ID 不能为空或超过 200 字');if(ids.has(v))fail(p,'ID 重复：'+v);ids.add(v);return v};
 const integer=(x,p,fallback=1)=>{const v=number(x,p,fallback);if(!Number.isInteger(v)||v<1||v>10000)fail(p,'应为 1–10000 的整数');return v};
 input=obj(input,'数据');if(input.version!==1)fail('version','目前只支持版本 1');

function relatedRemoval(initial){const ids=new Set(initial);let changed=true;while(changed){changed=false;for(const {item:x}of allItems())if(!ids.has(x.id)&&((x.type==='comment'&&ids.has(x.postId))||(x.type==='choice'&&ids.has(x.dialogueId)))){ids.add(x.id);changed=true}}return ids}
function removeEntities(ids){const removedActions=new Set(data.actions.filter(x=>ids.has(x.id)).map(x=>x.id)),removedStats=new Set(data.stats.filter(x=>ids.has(x.id)).map(x=>x.id));for(const day of data.days)for(const bucket of Object.keys(TYPES))day[bucket]=day[bucket].filter(x=>!ids.has(x.id));for(const {item:x}of allItems())if(x.replyTo&&ids.has(x.replyTo)){x.replyTo='';x.updatedAt=now()}data.actions=data.actions.filter(x=>!ids.has(x.id));data.stats=data.stats.filter(x=>!ids.has(x.id));for(const c of data.cases){let changed=false;for(const day of c.days)for(const choice of day.choices)if(removedActions.has(choice.actionId)){choice.actionId='';choice.updatedAt=now();changed=true}const length=c.preferences.length;c.preferences=c.preferences.filter(p=>!removedActions.has(p.actionId));if(c.preferences.length!==length)changed=true;for(const p of c.preferences){const old=p.effects.length+p.conditions.length;p.effects=p.effects.filter(e=>!removedStats.has(e.statId));p.conditions=p.conditions.filter(e=>!removedStats.has(e.statId));if(old!==p.effects.length+p.conditions.length)changed=true}for(const id of removedStats)if(Object.hasOwn(c.initialValues,id)){delete c.initialValues[id];changed=true}if(changed)c.updatedAt=now()}for(const a of data.actions){const old=a.conditions.length+a.effects.length;a.conditions=a.conditions.filter(c=>!removedStats.has(c.statId));a.effects=a.effects.filter(e=>!removedStats.has(e.statId));if(old!==a.conditions.length+a.effects.length)a.updatedAt=now()}}
async function deleteEntity(){const found=locate(view.selected);if(!found)return;if(found.bucket==='cases')return deleteCase();const ids=relatedRemoval([found.item.id]);const text='确定删除「'+labelOf(found.item)+'」吗？'+(ids.size>1?'同时删除 '+(ids.size-1)+' 条关联评论或选项。':'')+(found.bucket==='stats'?'引用此数值的 Action 条件、效果、所有 Case 的开局值和偏好规则会被移除。':'')+(found.bucket==='actions'?'所有 Case 中引用此 Action 的选项会取消关联，相关偏好会移除，选项本身保留。':'');if(await showModal('删除条目','<p>'+esc(text)+'</p>',[['cancel','取消'],['delete','确认删除','danger']])!=='delete')return;removeEntities(ids);view.selected='';commitMutation();toast('条目已删除')}
async function deleteDay(){const day=data.days.find(d=>d.day===view.day);if(!day)return;const ids=relatedRemoval(Object.keys(TYPES).flatMap(k=>day[k]).map(x=>x.id));if(await showModal('删除 Day '+day.day,'<p>将删除 '+ids.size+' 条剧本内容，包括其他 Day 引用这些帖子或对话的评论与选项。数值定义和 Action 保留。</p>',[['cancel','取消'],['delete','确认删除','danger']])!=='delete')return;removeEntities(ids);data.days=data.days.filter(d=>d!==day);view.day=data.days[0]?.day||1;view.selected='';commitMutation()}
function reorderItem(id,direction,targetId=null){const found=locate(id);if(found?.bucket==='events')return moveEvent(found.item.key,direction,targetId?locate(targetId)?.item.key:null);if(!found?.day)return;const d=data.days.find(d=>d.day===found.day);const rows=Object.keys(TYPES).flatMap(k=>d[k]).sort((a,b)=>a.order-b.order);const index=rows.findIndex(x=>x.id===id);let target=targetId?rows.findIndex(x=>x.id===targetId):index+direction;if(target<0||target>=rows.length||target===index)return;const [x]=rows.splice(index,1);rows.splice(target,0,x);rows.forEach((row,i)=>{if(row.order!==i){row.order=i;row.updatedAt=now()}});commitMutation(null,{editor:false})}
function setPath(object,path,value){if(path.startsWith('initialValues.')){const key=path.slice(14);if(!Object.hasOwn(object.initialValues,key))throw Error('开局值字段不存在');object.initialValues[key]=value;return}const segments=path.split('.');let target=object;for(const key of segments.slice(0,-1)){if(key==='__proto__'||key==='constructor'||key==='prototype')throw Error('无效的字段');target=target[key];if(!target||typeof target!=='object')throw Error('字段不存在')}const last=segments.at(-1);if(!Object.hasOwn(target,last))throw Error('字段不存在');target[last]=value}
function applyField(input){const found=locate(input.dataset.target);if(!found)return;const path=input.dataset.path;let value=input.value;if(input.dataset.number){if(value===''){if(input.dataset.nullable)value=null;else{markInvalid(input,'请填写一个有效数字。');return}}else value=Number(value);if(value!==null&&!Number.isFinite(value)){markInvalid(input,'请填写一个有效数字。');return}}if(path==='day')value=Number(value);const previous=clone(data);try{if(path==='day'){const destination=data.days.find(d=>d.day===value),source=data.days.find(d=>d.day===found.day);if(!destination)throw Error('请选择已有 Day。');if(destination!==source){source[found.bucket]=source[found.bucket].filter(x=>x.id!==found.item.id);destination[found.bucket].push(found.item);found.item.day=value;found.item.order=Math.max(-1,...Object.keys(TYPES).flatMap(k=>destination[k]).filter(x=>x.id!==found.item.id).map(x=>x.order))+1}}else{setPath(found.item,path,value);if(path==='postId'){found.item.replyTo='';for(const {item:child}of allItems())if(child.replyTo===found.item.id&&child.postId!==value){child.replyTo='';child.updatedAt=now()}}}normalizeProject(data);input.removeAttribute('aria-invalid');input.setCustomValidity('');if($('formErrors'))$('formErrors').textContent='';if($('banner').dataset.formError){banner('');delete $('banner').dataset.formError}touched(found.item);if($('editedAt'))$('editedAt').textContent=formatTime(found.item.updatedAt);if($('inspector').contains(input)){const scroll=$('listBody').scrollTop;renderSidebar();renderList();$('listBody').scrollTop=scroll}else if(view.selected===found.item.id)renderInspector();if(['day','postId','actionId','dialogueId'].includes(path)||(input.tagName==='SELECT'&&path.startsWith('preferences.')))renderAll();refreshCaseSummaries()}catch(error){data=bindDays(previous);markInvalid(input,error.message)}}
function markInvalid(input,message){input.setAttribute('aria-invalid','true');input.setCustomValidity(message);if($('formErrors'))$('formErrors').textContent=message;else{$('banner').dataset.formError='1';banner(message,true)}}

async function lineAction(button){const x=locate(view.selected)?.item;if(!x?.lines)return;if(button.dataset.lineDelete!==undefined){const index=Number(button.dataset.lineDelete);if(await showModal('删除台词','<p>确定删除第 '+(index+1)+' 句台词吗？</p>',[['cancel','取消'],['delete','删除','danger']])!=='delete')return;x.lines.splice(index,1)}else{const index=Number(button.dataset.lineMove),next=index+Number(button.dataset.direction);if(next<0||next>=x.lines.length)return;[x.lines[index],x.lines[next]]=[x.lines[next],x.lines[index]]}commitMutation(x)}

async function importJson(file){if(!file)return;try{if(file.size>10*1024*1024)throw Error('JSON 文件超过 10 MB，请先减少配图大小。');const incoming=normalizeProject(JSON.parse((await file.text()).replace(/^\uFEFF/,'')));const answer=await showModal('导入 JSON','<p>文件包含 '+incoming.cases.length+' 个 Case、'+incoming.cases.reduce((n,c)=>n+c.days.length,0)+' 个 Day、'+incoming.actions.length+' 个 Action 和 '+incoming.stats.length+' 个数值定义，以及 '+incoming.cases.reduce((n,c)=>n+c.events.length,0)+' 个事件。</p><p>覆盖会替换当前数据；合并会保留已有条目，同一 Case 的同一事件 ID 以导入文件为准；不同 Case 可以重用事件 ID。其他同 ID 的内容以导入文件为准。同 key 的数值和 Action 会合并并自动修复选项引用。</p>',[['cancel','取消'],['merge','合并'],['replace','覆盖现有数据','primary']]);if(!['merge','replace'].includes(answer))return;const result=answer==='merge'?mergeProject(data,incoming):incoming;data=bindDays(result);resetViewForProject();commitMutation();toast('导入完成，已保存到本机')}catch(error){await errorDialog(error,'导入失败：数据未被替换')}finally{$('importFile').value=''}}

function validateConfig(c,{token=true}={}){if(!/^[A-Za-z0-9_.-]+$/.test(c.owner)||!/[A-Za-z0-9]/.test(c.owner))throw Error('请填写有效的仓库所有者。');if(!/^[A-Za-z0-9_.-]+$/.test(c.repo)||!/[A-Za-z0-9]/.test(c.repo))throw Error('请填写有效的仓库名称。');if(!c.branch||c.branch.startsWith('/')||c.branch.endsWith('/')||c.branch.includes('..')||/[\s~^:?*\[\\]/.test(c.branch))throw Error('请填写有效的分支名称。');if(!c.path||c.path.startsWith('/')||c.path.endsWith('/')||c.path.split('/').some(p=>!p||p==='.'||p==='..')||!c.path.toLowerCase().endsWith('.json'))throw Error('文件路径须为相对路径，且以 .json 结尾，例如 data/script.json。');if(token&&!c.token)throw Error('请填写 Personal Access Token。');return c}
function readConfigForm(){const value={};for(const key of Object.keys(DEFAULT_CONFIG))value[key]=$('gh_'+key).value.trim();return value}
async function openSettings(){const labels={owner:'仓库所有者（owner）',repo:'仓库名（repo）',branch:'分支',path:'JSON 文件路径',token:'Personal Access Token'};const body='<div class="form-grid">'+Object.keys(labels).map(key=>'<label class="field '+(['path','token'].includes(key)?'full':'')+'"><span>'+labels[key]+'</span><input id="gh_'+key+'" type="'+(key==='token'?'password':'text')+'" value="'+esc(config[key])+'" autocomplete="off" spellcheck="false"></label>').join('')+'</div><div class="notice">使用 fine-grained token：只选择这一个仓库，Repository permissions 中仅启用 <b>Contents → Read and write</b>。Token 只保存在本浏览器设置里，不进入导出的 JSON 或提交内容。<br>如果仓库不在 Token 的可选范围中，请检查资源所有者和你的仓库权限。</div><div class="row"><button id="testConnection">测试连接</button><button id="forgetToken" class="link">清空 Token</button></div><p id="connectionResult" class="form-error" role="status"></p>';
 const answer=showModal('GitHub 设置',body,[['cancel','取消'],['save','保存设置','primary']]);$('forgetToken').onclick=()=>{$('gh_token').value='';$('connectionResult').textContent='保存设置后，Token 会从本机设置里移除。'};$('testConnection').onclick=async()=>{const button=$('testConnection');button.disabled=true;$('connectionResult').textContent='正在测试…';try{const c=validateConfig(readConfigForm()),file=await new GithubClient(c).getFile();if(!file.missing)normalizeProject(JSON.parse(file.text));$('connectionResult').style.color='var(--wx-ok)';$('connectionResult').textContent=file.missing?'仓库与分支连接成功。文件尚不存在，保存设置后首次提交可新建。':'连接成功，远程 JSON 格式有效。'}catch(error){$('connectionResult').style.color='var(--xhs-red)';$('connectionResult').textContent=redact(error.message)}finally{button.disabled=false}};
 if(await answer!=='save')return;try{const next=validateConfig(readConfigForm(),{token:false});const changed=configScope(next)!==configScope();localStorage.setItem(KEYS.config,JSON.stringify(next));config=next;if(changed){meta=defaultMeta();meta.scope=configScope();persistMeta()}syncError='';renderSync();toast('GitHub 设置已保存；可拉取或提交剧本')}catch(error){await errorDialog(error,'设置未保存');return openSettings()}}

async function confirmCommit(snapshot){const answer=await showModal('提交到 GitHub','<p>目标：<b>'+esc(config.owner+'/'+config.repo)+'</b> · '+esc(config.branch)+'<br><code>'+esc(config.path)+'</code></p><label class="field"><span>提交说明</span><textarea id="commitMessage" rows="3">'+esc(projectCommit(meta.baseline,snapshot))+'</textarea></label><p class="muted">只提交这份剧本 JSON。GitHub 设置与 Token 不会包含在数据中。</p>',[['cancel','取消'],['commit','确认提交','primary']]);if(answer!=='commit')return '';const text=$('commitMessage').value.trim();if(!text)throw Error('提交说明不能为空。');return text}

async function applyRemote(client,file){const remoteDocument=JSON.parse(file.text),incoming=normalizeProject(remoteDocument);data=bindDays(incoming);resetViewForProject();let hash='';try{hash=await client.lastCommit()}catch{}markSynced(incoming,file.sha,hash);if(!hasBlockFormat(remoteDocument)){meta.needsBlockSync=true;persistMeta()}saveLocal();renderAll();toast('已拉取远程版本')}
async function pullRemote({automatic=false}={}){if(busy)return;if(!configured()){if(automatic)return;if(!await ensureConfigured())return}if(!validEditor())return;setBusy(true);let create=false;try{const client=new GithubClient(config);const file=await client.getFile();if(file.missing){create=await requestCreate();return}normalizeProject(JSON.parse(file.text));if(changes().length&&await showModal(automatic?'检测到未提交的本地修改':'拉取将覆盖本地数据','<p>当前有 '+changes().length+' 条未提交的修改。拉取会用远程文件替换本地数据。可以先取消并导出 JSON 备份。</p>',[['cancel','保留本地，取消拉取'],['pull','确认拉取远程版本','primary']])!=='pull')return;await applyRemote(client,file)}catch(error){syncError=redact(error.message);toast('拉取失败，本地数据已保留');banner(syncError,true)}finally{setBusy(false);if(create)await pushRemote({createConfirmed:true})}}
async function pushRemote({createConfirmed=false}={}){const issues=eventIssues();if(issues.length){await errorDialog(Error(issues.slice(0,15).map(x=>x.caseId+' / '+x.eventId+' · 第 '+x.line+' 行：'+x.message).join('\n')),'事件尚未就绪，未提交到 GitHub');return}if(busy||!validEditor())return;if(!await ensureConfigured())return;let snapshot;try{snapshot=publicData()}catch(error){return errorDialog(error,'数据校验未通过')}let message;try{message=await confirmCommit(snapshot)}catch(error){return errorDialog(error)}if(!message)return;setBusy(true);try{const client=new GithubClient(config);let sha=meta.scope===configScope()?meta.sha:null;
 // 未拉取过该目标时，先读取文件，绝不把已有远程文件当成新文件覆盖。
 if(!sha){const remote=await client.getFile();if(remote.missing){if(!createConfirmed&&!await requestCreate())return}else if(diffProject(normalizeProject(JSON.parse(remote.text)),snapshot).length===0){if(hasBlockFormat(JSON.parse(remote.text))){await applyRemote(client,remote);return}sha=remote.sha}else{await resolveConflict(client,snapshot,message);return}}
 try{const result=await client.putFile(snapshot,sha,message);markSynced(snapshot,result.content.sha,result.commit.sha);saveLocal();toast('提交成功 · '+result.commit.sha.slice(0,7))}catch(error){if(error.status===409||error.status===422)await resolveConflict(client,snapshot,message);else throw error}
 }catch(error){syncError=redact(error.message);banner(syncError,true);toast('提交失败，本地修改已保留')}finally{setBusy(false)}}
async function resolveConflict(client,snapshot,message){const choice=await showModal('远程已有新版本','<p>本地记录的文件 SHA 与远程不一致，或这次提交被 GitHub 拒绝。当前修改仍保存在本机，请选择处理方式。</p>',[['remote','1. 拉取远程版本，放弃本地修改'],['local','2. 强制用本地版本覆盖远程'],['backup','3. 先导出本地 JSON 备份，再拉取','primary'],['cancel','取消，保留现状']],{vertical:true});if(!choice||choice==='cancel')return;
 if(choice==='backup')exportJson(snapshot);const latest=await client.getFile();if(choice==='local'){if(await showModal('确认覆盖远程数据','<p>将以本地剧本替换远程文件中的内容，其他人的更新可能被覆盖。确认后会重新读取到的 SHA 随提交发送；若远程再次变化，仍会停止提交。</p>',[['cancel','取消'],['overwrite','确认用本地覆盖','danger']])!=='overwrite')return;const result=await client.putFile(snapshot,latest.missing?null:latest.sha,message);markSynced(snapshot,result.content.sha,result.commit.sha);saveLocal();toast('已用本地版本提交 · '+result.commit.sha.slice(0,7));return}if(latest.missing)throw Error('远程文件已经删除，无法拉取。当前本地数据仍保留。');await applyRemote(client,latest)}

function currentCase(){return data?.cases?.find(c=>c.id===view.caseId)||data?.cases?.[0]||null}
function bindDays(doc){Object.defineProperty(doc,'days',{enumerable:false,configurable:true,get(){return (doc.cases.find(c=>c.id===view.caseId)||doc.cases[0])?.days||[]},set(days){const c=doc.cases.find(c=>c.id===view.caseId)||doc.cases[0];if(c)c.days=days}});return doc}

function preferenceRows(c,p,index,kind){const isCondition=kind==='conditions';return p[kind].map((r,i)=>{const path='preferences.'+index+'.'+kind+'.'+i;return '<div class="'+(isCondition?'condition-row':'effect-row')+'"><select aria-label="偏好数值" data-target="'+esc(c.id)+'" data-path="'+path+'.statId">'+data.stats.map(s=>'<option value="'+esc(s.id)+'" '+(s.id===r.statId?'selected':'')+'>'+esc(s.name)+'</option>').join('')+'</select>'+(isCondition?'<select aria-label="偏好比较符" data-target="'+esc(c.id)+'" data-path="'+path+'.operator">'+OPS.map(op=>'<option '+(op===r.operator?'selected':'')+'>'+esc(op)+'</option>').join('')+'</select>':'')+'<input type="number" step="any" aria-label="'+(isCondition?'偏好条件值':'偏好额外变化量')+'" value="'+(isCondition?r.value:r.delta)+'" data-number="true" data-target="'+esc(c.id)+'" data-path="'+path+(isCondition?'.value':'.delta')+'"><button class="icon danger" data-pref-rule-delete="'+kind+'.'+i+'" data-pref-index="'+index+'" aria-label="删除偏好规则">'+icon('close')+'</button></div>'}).join('')||'<p class="muted">'+(isCondition?'无追加条件。':'无额外数值变化。')+'</p>'}

function refreshCaseSummaries(){const c=currentCase();if(!c)return;for(const el of $('inspector').querySelectorAll('[data-pref-summary]')){const p=c.preferences[Number(el.dataset.prefSummary)];if(!p)continue;const base=data.actions.find(a=>a.id===p.actionId);el.innerHTML='<b>基础：</b>'+esc(effectText(base))+'<br><b>本 Case 合计：</b>'+esc(effectText(caseAdjustedAction(base,c)))+(p.conditions.length?'<br>追加条件：'+esc(p.conditions.map(r=>statName(r.statId)+' '+r.operator+' '+r.value).join('；')):'')}for(const el of $('inspector').querySelectorAll('[data-action-summary]')){const action=data.actions.find(a=>a.id===el.dataset.actionSummary);if(action)el.outerHTML=caseEffectSummary(action)}}
function resetViewForProject(){if(!data.cases.some(c=>c.id===view.caseId))view.caseId=data.cases[0]?.id||'';rememberCase();view.day=data.days[0]?.day||1;view.selected='';view.query='';view.scope=data.cases.length?'events':'cases';$('search').value=''}
async function addCase(){const answer=await showModal('新增画师 Case','<div class="form-grid"><label class="field"><span>Case 名称</span><input id="newCaseName" value="新 Case"></label><label class="field"><span>画师</span><input id="newCaseArtist" value=""></label><label class="field full"><span>剧本起点</span><select id="newCaseTemplate"><option value="blank">空白 Case（Day 1–Day 5）</option><option value="1">画师 1 游戏模板</option><option value="2">画师 2 游戏模板（含直播偏好）</option></select></label></div><p class="muted">共用现有数值定义和 Action；新 Case 的剧本、开局值与偏好独立。</p>',[['cancel','取消'],['add','新增 Case','primary']]);if(answer!=='add')return;const name=$('newCaseName').value.trim(),artist=$('newCaseArtist').value.trim(),template=$('newCaseTemplate').value;if(!name)return errorDialog(Error('Case 名称不能为空。'));let c;if(template==='blank')c={id:uid('case'),name,artist,description:'',updatedAt:now(),initialValues:Object.fromEntries(data.stats.map(s=>[s.id,null])),preferences:[],days:Array.from({length:5},(_,i)=>({day:i+1,posts:[],comments:[],dialogues:[],choices:[]}))};else{data=bindDays(completeGameActions(data));c=duplicateCaseData(buildArtistCase(Number(template),data.stats,data.actions));c.name=name;c.artist=artist||'画师 '+template}c.events=c.events||[];data.cases.push(c);view.caseId=c.id;rememberCase();touched(c);saveLocal();selectEntity(c.id)}
function duplicateCaseDataV2(source){const c=clone(source),map=new Map();c.id=uid('case');c.updatedAt=now();for(const d of c.days)for(const kind of Object.keys(TYPES))for(const item of d[kind]){map.set(item.id,uid(TYPE_VALUES[kind]));if(item.lines)for(const l of item.lines)map.set(l.id,uid('line'))}for(const d of c.days)for(const kind of Object.keys(TYPES))for(const item of d[kind]){item.id=map.get(item.id);item.updatedAt=now();if(item.postId)item.postId=map.get(item.postId)||item.postId;if(item.replyTo)item.replyTo=map.get(item.replyTo)||item.replyTo;if(item.dialogueId)item.dialogueId=map.get(item.dialogueId)||item.dialogueId;if(item.lines)item.lines.forEach(l=>l.id=map.get(l.id))}c.preferences.forEach(p=>p.id=uid('preference'));return c}
function copyCase(){const c=currentCase();if(!c)return;const copy=duplicateCaseData(c);copy.name=(c.name||'Case')+'（副本）';data.cases.push(copy);view.caseId=copy.id;rememberCase();touched(copy);saveLocal();selectEntity(copy.id);toast('已复制 Case 剧本和偏好，共用 Action 保持关联')}
async function deleteCase(){const c=currentCase();if(!c)return;if(await showModal('删除 Case','<p>确定删除「'+esc(c.name)+'」及其 '+caseItemCount(c)+' 条旧剧本内容，以及 '+(c.events?.length||0)+' 个事件的完整文本、开局值和偏好吗？共用的数值定义与 Action，以及其他 Case 都会保留。</p>',[['cancel','取消'],['delete','确认删除 Case','danger']])!=='delete')return;data.cases=data.cases.filter(x=>x.id!==c.id);view.caseId=data.cases[0]?.id||'';view.selected='';view.scope='cases';rememberCase();commitMutation();renderAll()}

async function preferenceCommand(button){const c=currentCase();if(!c)return;if(button.dataset.preferenceDelete!==undefined){const i=Number(button.dataset.preferenceDelete);if(await showModal('删除画师偏好','<p>确定删除这条偏好吗？基础 Action 不受影响。</p>',[['cancel','取消'],['delete','删除','danger']])==='delete'){c.preferences.splice(i,1);commitMutation(c)}return}const p=c.preferences[Number(button.dataset.prefIndex)];if(!p)return;if(button.dataset.prefAdd){const kind=button.dataset.prefAdd;if(!data.stats.length)return;p[kind].push(kind==='effects'?{statId:data.stats[0].id,delta:0}:{statId:data.stats[0].id,operator:'>=',value:0});commitMutation(c)}else if(button.dataset.prefRuleDelete){const [kind,index]=button.dataset.prefRuleDelete.split('.');if(await showModal('删除偏好规则','<p>确定删除这条额外效果或追加条件吗？</p>',[['cancel','取消'],['delete','删除','danger']])==='delete'){p[kind].splice(Number(index),1);commitMutation(c)}}}
async function fillGameActions(){const before=data.actions.length;data=bindDays(completeGameActions(data));commitMutation();toast('已补齐 '+(data.actions.length-before)+' 个 Action；已有同 key 的编辑已保留')}

/* ==================== 事件文本：解析、校验与旧数据投影 ==================== */
const EVENT_SLOTS={any:'未限定',morning:'早上',afternoon:'下午',evening:'晚上',live:'直播中'};
const eventKey=(caseId,id)=>JSON.stringify([caseId,id]);
function eventRegistry(project,c){
 const roles=new Set(['玩家','系统',...GAME_REFERENCE.opening.map(()=> 'Chloe'),...GAME_REFERENCE.mhs.map(t=>t.who),...GAME_REFERENCE.live.map(t=>t.who),'画师']);
 for(const artistCase of project.cases)for(const d of artistCase.days){for(const x of d.dialogues)for(const l of x.lines)if(l.speaker)roles.add(l.speaker);for(const p of d.posts)if(p.author)roles.add(p.author);for(const x of d.comments)if(x.author)roles.add(x.author)}
 return {roles,stats:new Map(project.stats.map(s=>[s.key,s])),actions:new Map(project.actions.map(a=>[a.key,a])),evidence:new Map([...Object.entries(GAME_REFERENCE.evidence),['livestream-announcement',{title:'第 5 天直播对赌公告与规则',text:GAME_REFERENCE.rules.join('\n\n')}]]),posts:new Map(c.days.flatMap(d=>d.posts).map(x=>[x.id,x])),comments:new Map(c.days.flatMap(d=>d.comments).map(x=>[x.id,x]))};
}
/* 条件表达式使用递归下降解析，不使用 eval / Function，不执行脚本。 */
function parseEventCondition(source,registry){
 const tokens=[];let position=0;
 while(position<source.length){const rest=source.slice(position),space=/^\s+/.exec(rest);if(space){position+=space[0].length;continue}const match=/^(>=|<=|==|!=|&&|\|\||[()!<>]|-?\d+(?:\.\d+)?|"(?:[^"\\]|\\.)*"|[A-Za-z_][A-Za-z0-9_]*)/.exec(rest);if(!match)throw Error('条件中无法识别「'+rest.slice(0,16)+'」');tokens.push(match[0]);position+=match[0].length}
 let i=0;const take=()=>tokens[i++],expect=t=>{if(take()!==t)throw Error('条件缺少 '+t)};
 function atom(){const t=take();if(t==='('){const x=or();expect(')');return x}if(t==='true'||t==='false')return {type:'boolean',value:t==='true'};if(t==='evidence'){expect('(');const raw=take();if(!raw?.startsWith('"'))throw Error('evidence 必须填写双引号中的证据 ID');let id;try{id=JSON.parse(raw)}catch{throw Error('证据 ID 的引号无效')}expect(')');if(!registry.evidence.has(id))throw Error('未知证据 ID：'+id);return {type:'evidence',id}}if(!registry.stats.has(t)&&!['day','slot'].includes(t))throw Error('未知数值 key：'+(t||'（表达式不完整）'));const operator=take();if(!OPS.includes(operator))throw Error('请使用 >=、<=、>、<、== 或 != 比较 '+t);const valueToken=take();let value;if(t==='slot'){try{value=JSON.parse(valueToken)}catch{throw Error('slot 请与双引号中的时段比较')}if(!Object.hasOwn(EVENT_SLOTS,value)||value==='any'||!['==','!='].includes(operator))throw Error('slot 只支持 == / != 与 morning、afternoon、evening、live 比较')}else{value=Number(valueToken);if(valueToken===undefined||!/^[-\d]/.test(valueToken)||!Number.isFinite(value))throw Error('比较值必须是数字')}return {type:'compare',key:t,statId:registry.stats.get(t)?.id||null,operator,value}}
 function not(){if(tokens[i]==='!'){i++;return {type:'not',value:not()}}return atom()}
 function and(){let x=not();while(tokens[i]==='&&'){i++;x={type:'and',left:x,right:not()}}return x}
 function or(){let x=and();while(tokens[i]==='||'){i++;x={type:'or',left:x,right:and()}}return x}
 const ast=or();if(i!==tokens.length)throw Error('条件存在多余内容：'+tokens.slice(i).join(' '));return ast;
}
function parseChatEventText(source,project,owner,event=null,{targets=true}={}){
 const errors=[],warnings=[],registry=eventRegistry(project,owner),lines=source.replace(/\r\n?/g,'\n').split('\n'),meta={},metaLines={},ast={id:'',caseId:owner.id,title:'',day:1,slot:'any',status:'draft',when:'true',condition:null,sharedWith:[],steps:[],choices:[],notes:''};
 const fail=(line,message)=>errors.push({caseId:owner.id,eventId:ast.id||event?.id||'未命名事件',line,message});
 let bodyAt=lines.length,seenHeader=false;
 for(let i=0;i<lines.length;i++){
  const line=lines[i];if(!line.trim()||line.startsWith('//'))continue;
  if(!seenHeader){const m=/^===\s*(\S+)\s*$/.exec(line);seenHeader=true;if(!m)fail(i+1,'第一行应为 === 事件ID，ID 不能含空格');else ast.id=m[1];continue}
  const h=/^(case|title|day|slot|status|when|shared_with):\s*(.*)$/.exec(line);if(h){if(Object.hasOwn(meta,h[1]))fail(i+1,'重复的头部字段：'+h[1]);meta[h[1]]=h[2];metaLines[h[1]]=i+1;continue}bodyAt=i;break;
 }
 if(!ast.id)fail(1,'缺少事件 ID，请填写 === 事件ID');
 for(const key of ['case','title','day','slot','status','when'])if(!Object.hasOwn(meta,key))fail(1,'缺少 '+key+' 字段');
 ast.title=meta.title||'';if(ast.title.startsWith('"'))try{ast.title=JSON.parse(ast.title);if(typeof ast.title!=='string')throw Error()}catch{ast.title='';fail(metaLines.title||1,'带引号的标题应为 JSON 字符串')}if(!ast.title.trim())fail(metaLines.title||1,'标题不能为空');ast.caseId=meta.case||owner.id;
 if(!project.cases.some(c=>c.id===ast.caseId))fail(metaLines.case||1,'Case ID 不存在，请使用当前 Case ID：'+owner.id);else if(ast.caseId!==owner.id)fail(metaLines.case,'事件属于 '+owner.id+'；跨 Case 请复制事件或设置 shared_with');
 ast.day=Number(meta.day);if(!Number.isInteger(ast.day)||ast.day<1||ast.day>5)fail(metaLines.day||1,'Day 应为当前游戏的 1–5');
 ast.slot=meta.slot||'any';if(!Object.hasOwn(EVENT_SLOTS,ast.slot))fail(metaLines.slot||1,'时段应为 morning / afternoon / evening / live / any（未限定）');
 ast.status=meta.status||'draft';if(!Object.hasOwn(STATUSES,ast.status))fail(metaLines.status||1,'状态应为 draft / review / final');
 ast.when=meta.when||'true';try{ast.condition=parseEventCondition(ast.when,registry)}catch(e){fail(metaLines.when||1,e.message)}
 ast.sharedWith=(meta.shared_with||'').split(',').map(s=>s.trim()).filter(Boolean);for(const id of ast.sharedWith)if(id===owner.id||!project.cases.some(c=>c.id===id))fail(metaLines.shared_with,'shared_with 请填写其他已存在的 Case ID');
 const reserved=new Set(['END']);if(reserved.has(ast.id)||ast.id.includes('::'))fail(1,'事件 ID 不能为 END 或包含 ::');
 if((owner.events||[]).some(e=>e!==event&&(e.key!==event?.key)&&eventSourceId(e)===ast.id))fail(1,'同一个 Case 内事件 ID 重复：'+ast.id);
 let choice=null,ended=false;const currentSteps=()=>choice?choice.steps:ast.steps;
 function jsonText(raw,line){try{const x=JSON.parse(raw);if(typeof x!=='string')throw Error();return x}catch{fail(line,'这里需要 JSON 双引号字符串；换行写为 \\n');return ''}}
 for(let i=bodyAt;i<lines.length;i++){
  const raw=lines[i];if(!raw.trim())continue;if(raw.includes('\t')){fail(i+1,'缩进请使用空格，不使用 Tab');continue}
  const indent=raw.length-raw.trimStart().length,content=raw.trimStart();if(content.startsWith('//'))continue;
  if(indent===0&&content.startsWith('*')){const m=/^\*\s+\[(.+)\]\s*$/.exec(content);let label=m?.[1];if(!m&&/^\*\s+"/.test(content))try{label=JSON.parse(content.replace(/^\*\s+/,''))}catch{}if(typeof label!=='string'||!label.trim()){fail(i+1,'选项格式应为 * [选项文本]，或 * "JSON 字符串"，且不能为空');choice=null;continue}choice={id:'',text:label,when:'true',condition:{type:'boolean',value:true},legacyCondition:'',result:'',steps:[],line:i+1};ast.choices.push(choice);ended=false;continue}
  const expected=choice?2:0;if(indent!==expected){fail(i+1,'当前语句应缩进 '+expected+' 个空格；多行台词请再缩进 2 格');continue}
  if(content.startsWith('===')){fail(i+1,'一个条目只编辑一个事件，请使用“新增事件”创建下一事件');continue}
  if(ended){fail(i+1,'跳转之后不能再写语句；请放到跳转前或新的选项中');continue}
  if(content.startsWith('@')){
   const m=/^@([a-z_]+):\s*(.*)$/.exec(content);if(!m){fail(i+1,'指令格式应为 @指令: 内容');continue}const [,command,value]=m;
   if(command==='when'){if(!choice){fail(i+1,'事件条件请放在头部 when: 中');continue}choice.when=value;try{choice.condition=parseEventCondition(value,registry)}catch(e){fail(i+1,e.message)}continue}
   if(command==='legacy_when'){if(!choice){fail(i+1,'@legacy_when 只用于保留旧选项的自由文本条件');continue}choice.legacyCondition=jsonText(value,i+1);warnings.push({line:i+1,message:'旧条件说明按原文保留，不自动执行。可另写 @when 形成结构化条件。'});continue}
   if(command==='result'){if(!choice){fail(i+1,'@result 只用于选项的结果说明');continue}choice.result=jsonText(value,i+1);continue}

function legacyEventSyntaxMarkup(){return '<p>每个条目只写一个事件。指令必须以 <code>@</code> 开头；角色名后的内容和缩进台词始终是普通文字。</p><pre class="syntax-sample">'+esc('=== 你自己的事件ID\ncase: '+(currentCase()?.id||'当前CaseID')+'\ntitle: 事件标题\nday: 2\nslot: afternoon\nstatus: draft\nwhen: true\n\n玩家:\n  这里写多行台词。\n  @ 和 -> 在这个缩进中也是台词。\n\n* [一个选择]\n  @when: true\n  玩家: 选择之后的台词。\n  -> END')+'</pre><ul><li>头部：case 使用实际 Case ID；day 为 1–5；slot 为 morning / afternoon / evening / live / any。any 表示旧内容未限定时段。status 为 draft / review / final。</li><li>台词：<code>角色: 一句台词</code> 或 <code>角色：</code> 后换行再缩进 2 格；中文和英文冒号均可。台词块内的空行、中文标点和指令样文字原样保留。非台词块中的空行只是分隔。</li><li>选项：<code>* [文字]</code> 顶格写；选项内语句缩进 2 格，多行台词再多缩进 2 格。不使用 Tab。</li><li>条件：头部 <code>when:</code> 控制事件；选项内 <code>@when:</code> 控制选项。支持数值 key 与数字比较、day、slot == "morning"、true/false、evidence("实际ID")、!、&&、|| 和括号。条件不执行 JavaScript。</li><li>执行：<code>@action: 实际ActionKey</code> 使用共用规则加当前 Case 偏好；<code>@effect: 实际数值key -10</code> 是额外变化，两者同时写会相加。@action 的既有流程要求、时段和行动点会保留，不替代游戏里的异步流程。</li><li>材料与显示：<code>@unlock_evidence: 证据ID</code>、<code>@show_post: 本Case帖子ID</code>、<code>@show_comment: 本Case评论ID</code>。请从引用表复制真实 ID。展示帖子不等于已取得其证据。</li><li>跳转：<code>-> 同Case事件ID</code> 或 <code>-> END</code>，必须在当前段落最后。跨 Case 用 <code>-> CaseID::事件ID</code>，目标必须用 shared_with 明确共享给当前 Case。</li><li>共享：可选头部 <code>shared_with: 另一个CaseID,另一个CaseID</code>；共享事件只在所属 Case 编辑。复制 Case 得到独立事件副本。</li><li>注释：语句位置的 <code>// 注释</code> 忽略，台词块内的 // 原样保留。<code>@notes: "备注"</code>、<code>@result: "选项结果说明"</code> 使用 JSON 字符串，换行写为 \\n。</li><li>迁移字段：@line_id / @choice_id / @emotion 保留原 ID 与表情。@legacy_when 只保留旧自由文本条件，不自动推断成表达式；可另补 @when。</li></ul><div class="notice">自动保存文本草稿；点击“保存并编译”将有效文本写入本 Case 的 events、dialogues、choices。错误草稿可备份，但不能提交到 GitHub。原游戏尚未读取剧本 JSON，此处不会改写游戏引擎或改变原游戏剧情。</div>'}

function eventSyntaxMarkup(){return '<p><b>帖子与聊天分开：</b>每个 block 只写一种文案。一个帖子 block 包含正文、所有评论和楼中楼；一组聊天 block 包含台词、选项和每个选择后的回复。</p><p>公共头部使用 <code>=== ID</code>、<code>case:</code>、<code>type: post / chat / system</code>、<code>title:</code>、<code>day:</code>、<code>through:</code>、<code>slot:</code>、<code>status:</code>、<code>when:</code>。through 是可用范围的最后一天；不填写时聊天仅属于起始 Day。trigger 是原游戏触发流程的说明，不会被当成可执行条件。</p><h3>帖子 block</h3><pre class="syntax-sample">'+esc('=== 自定帖子ID\ncase: '+(currentCase()?.id||'当前CaseID')+'\ntype: post\ntitle: 帖子标题\nday: 1\nthrough: 5\nslot: any\nstatus: draft\nwhen: true\nauthor: "发帖人"\nlikes: 0\n\nbody:\n  帖子正文，可多行。\n\n[comment 自定评论ID]\nauthor: "评论人"\nreply_to: ""\nday: 1\nlikes: 0\nstatus: draft\ntext:\n  评论内容。\n\n[comment 自定回复ID]\nauthor: "回复人"\nreply_to: "自定评论ID"\nday: 1\nlikes: 0\nstatus: draft\ntext:\n  楼中楼的内容。')+'</pre><p>reply_to 填同一 block 内的评论 ID，留空是顶层评论。可嵌套多层，会检查断链和循环。image 字段可选；不填写会保留现有配图。evidence 使用真实证据 ID，只标记可收藏的材料；publish 是负责发布的 Action key，不会在查看帖子时执行。</p><h3>聊天 block</h3><pre class="syntax-sample">'+esc('=== 自定对话ID\ncase: '+(currentCase()?.id||'当前CaseID')+'\ntype: chat\ntitle: 对话组名称\nday: 2\nthrough: 2\nslot: afternoon\nstatus: draft\nwhen: true\n\n玩家:\n  多行台词。\n\n* [一个选项]\n  @when: true\n  玩家: 选项后的台词。\n  -> END')+'</pre><p>角色名使用引用表中的已有角色；语句位置的 // 是注释，缩进台词块内的 //、@、中文标点和空行原样保留。选项语句缩进 2 格，多行台词再缩进 2 格。</p><p>指令：<code>@action: key</code>、<code>@effect: stat_key +2</code>、<code>@unlock_evidence: ID</code>、<code>@show_post: ID</code>、<code>@show_comment: ID</code>、<code>-> 事件ID / END</code>。条件支持数值比较、day、slot、evidence("ID")、!、&&、|| 和括号。@action 使用当前 Case 的偏好；@effect 额外叠加。</p><p>旧 @line_id、@choice_id、@emotion、@notes、@result、@legacy_when 仍可使用，备注与结果说明用 JSON 字符串。shared_with 只用于明确共享；默认所有 block 都归当前 Case。</p><div class="notice">文本草稿自动保存。点击“保存并编译”更新 events 与现有 posts/comments 或 dialogues/choices。JSON 和 GitHub 同步都保留 block 文本与结构。游戏本体目前仍使用 index.html 的原逻辑，不会在此自动改写。</div>'}

function createBlock(type){const c=currentCase();if(!c)return addCase();c.events=c.events||[];const day=Number(view.eventDay)||1;let id=type+'_1',i=2;while(c.events.some(e=>eventSourceId(e)===id))id=type+'_'+i++;const e={key:uid('block'),id,caseId:c.id,title:type==='post'?'新帖子':'新对话',day,through:day,slot:view.eventSlot||'any',status:'draft',blockType:type,order:Math.max(-1,...c.events.map(x=>x.order))+1,updatedAt:now(),legacy:{},assets:{image:''},appliedSource:null};if(type==='post')e.source=postBlockSource(c,{id,title:e.title,author:'代理人（你）',body:'',likes:0,day,status:'draft',notes:''},[],{id,through:day});else e.source='=== '+id+'\ncase: '+c.id+'\ntype: '+type+'\ntitle: '+e.title+'\nday: '+day+'\nthrough: '+day+'\nslot: '+e.slot+'\nstatus: draft\nwhen: true\n\n-> END';c.events.push(e);view.blockType=type;touched(c);saveLocal();selectEntity(eventSelection(e.key));return e}

 document.addEventListener('input',event=>{if(event.target.dataset.path&&!event.isComposing)applyField(event.target)});document.addEventListener('compositionend',event=>{if(event.target.dataset.path)applyField(event.target)});
 document.addEventListener('change',async event=>{const input=event.target;try{if(input.id==='caseSwitch'){switchCase(input.value);return}if(input.dataset.actionSlot){const a=locate(view.selected)?.item;if(a?.timeSlots){a.timeSlots=input.checked?[...new Set([...a.timeSlots,input.dataset.actionSlot])]:a.timeSlots.filter(t=>t!==input.dataset.actionSlot);commitMutation(a)}return}if(input.dataset.path&&input.tagName==='SELECT')applyField(input);if(input.dataset.path==='image'&&!input.hasAttribute('aria-invalid'))renderInspector();if(input.id==='categoryFilter'){view.category=input.value;renderList()}if(input.id==='rangeStart'||input.id==='rangeEnd'){view[input.id]=input.value;renderList()}if(input.dataset.image){const file=input.files[0];if(!file)return;if(!['image/png','image/jpeg','image/webp','image/gif'].includes(file.type)||file.size>2*1024*1024)throw Error('请选择不超过 2 MB 的 PNG、JPG、WebP 或 GIF 图片。');const reader=new FileReader();const result=await new Promise((resolve,reject)=>{reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(Error('无法读取图片'));reader.readAsDataURL(file)});const x=locate(input.dataset.image)?.item;if(x){x.image=result;commitMutation(x)}}}catch(error){await errorDialog(error)}});
 document.addEventListener('keydown',event=>{if(editorOpen()&&!$('modal').open){if(event.key==='Escape'){event.preventDefault();closeEditor();return}if(event.key==='Tab'){const controls=editorFocusables(),first=controls[0],last=controls.at(-1);if(!first){event.preventDefault();$('inspector').focus()}else if(event.shiftKey&&(document.activeElement===first||!$('inspector').contains(document.activeElement))){event.preventDefault();last.focus()}else if(!event.shiftKey&&(document.activeElement===last||!$('inspector').contains(document.activeElement))){event.preventDefault();first.focus()}}}if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='s'){event.preventDefault();if(!eventForSelection()&&saveLocal())toast('已保存到本机')}if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k'&&!$('modal').open){event.preventDefault();if(editorOpen())closeEditor();$('search').focus()}const entry=event.target.closest('[data-select]');if(entry&&event.target===entry&&(event.key==='Enter'||event.key===' ')){event.preventDefault();if(entry.dataset.caseId&&entry.dataset.caseId!==view.caseId)switchCase(entry.dataset.caseId);selectEntity(entry.dataset.select)}});
 $('listBody').addEventListener('dragstart',event=>{const row=event.target.closest('[draggable="true"]');if(!row)return;dragId=row.dataset.select;event.dataTransfer.setData('text/plain',dragId);event.dataTransfer.effectAllowed='move';row.classList.add('dragging')});$('listBody').addEventListener('dragover',event=>{const row=event.target.closest('[draggable="true"]');if(row&&dragId){event.preventDefault();event.dataTransfer.dropEffect='move';document.querySelectorAll('.drop-target').forEach(e=>e.classList.remove('drop-target'));row.classList.add('drop-target')}});$('listBody').addEventListener('drop',event=>{event.preventDefault();const row=event.target.closest('[draggable="true"]');if(row&&dragId&&locate(dragId)?.day===locate(row.dataset.select)?.day)reorderItem(dragId,0,row.dataset.select);dragId=null});$('listBody').addEventListener('dragend',()=>{dragId=null;document.querySelectorAll('.dragging,.drop-target').forEach(e=>e.classList.remove('dragging','drop-target'))});
 $('modal').addEventListener('cancel',event=>{event.preventDefault();closeModal(null)});window.addEventListener('resize',()=>syncEditorSurface({focus:editorOpen()&&!$('inspector').contains(document.activeElement)}));window.addEventListener('pagehide',saveLocal);window.addEventListener('beforeunload',()=>saveLocal());window.addEventListener('storage',event=>{if(event.key===KEYS.data&&event.newValue!==lastStored)banner('另一个窗口更新了本地剧本。请先导出当前编辑，再刷新载入，避免互相覆盖。',true)});
}
function boot(){load();$('brandIcon').innerHTML=icon('book');$('searchIcon').innerHTML=icon('search');$('helpBtn').innerHTML=icon('help');renderAll();bindEvents();if(lastStored&&!storageError)$('localStatus').textContent='本地数据已载入 · '+formatTime(data.updatedAt);if(configured())queueMicrotask(()=>pullRemote({automatic:true}))}
if(typeof document!=='undefined'&&document.getElementById('workspace'))boot();
</script>
